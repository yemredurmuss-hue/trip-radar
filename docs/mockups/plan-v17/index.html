.lr .xx { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity .18s; }
.lr .xx svg { width: 12px; height: 12px; }
.lr:hover .xx, .lr:focus-within .xx { opacity: 1; }
@media (hover: none) { .lr .xx { opacity: 1; } }
/* Hero bilgi satırı (bugünkü gibi ikonlu) */
.factrow { display: flex; flex-wrap: wrap; gap: 8px 0; font-size: 13px; color: var(--ink); }
.factrow span { display: inline-flex; gap: 5px; align-items: center; padding: 0 9px; border-left: 1px solid var(--line); white-space: nowrap; }
.factrow span:first-child { padding-left: 0; border-left: 0; }
.factrow svg { width: 16px; height: 16px; color: var(--muted); }

/* Biniş kartı */
.tkw { container-type: inline-size; min-width: 0; }
.tk { padding: 0; grid-template-columns: minmax(0, 1fr) 150px; gap: 0; display: grid; }
.tk-main { padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.route { display: grid; grid-template-columns: auto minmax(50px, 1fr) auto; align-items: center; gap: 8px; }
.route .c b { display: block; font-size: 21px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
.route .c small { font-size: 12.5px; color: var(--muted); }
.route .c .t { font-size: 14px; font-weight: 700; }
.route .c.r { text-align: right; }
.route .sil { width: 100%; height: 44px; color: var(--c-fly); }
.m-bos .route .sil { opacity: .45; }
.tk-stub { position: relative; border-left: 1.5px dashed var(--dash); padding: 14px; display: grid; gap: 3px; align-content: center; min-width: 0; font-size: 13px; }
.tk-stub::before, .tk-stub::after { content: ""; position: absolute; left: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--app); }
.tk-stub::before { top: -10px; } .tk-stub::after { bottom: -10px; }
.stub-k { font-size: 12px; color: var(--muted); }
.stub-v { font-size: 15px; font-weight: 750; }
.tk .stamp { right: 12px; top: auto; bottom: 10px; width: 36px; height: 36px; }
@container (max-width: 480px) { .tk { grid-template-columns: minmax(0, 1fr); } .tk-stub { border-left: 0; border-top: 1.5px dashed var(--dash); } .tk-stub::before, .tk-stub::after { display: none; } }

/* Deneyimler: planda olanlar satır, fikirler kare */
.planned { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 1px 12px; align-items: center; padding: 8px 10px 8px 8px; border-radius: 14px; animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
.prow img { width: 48px; height: 48px; border-radius: 10px; background: var(--tile); object-fit: contain; padding: 2px; grid-row: span 2; }
.prow .t { font-size: 14.5px; font-weight: 650; }
.prow .m { grid-column: 2; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.prow .r { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.back { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.back:hover { color: var(--accent-ink); }
.back svg { width: 14px; height: 14px; }
.ideas-h { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
.ideas-h b { color: var(--ink); }
.ideas-h .sp { flex: 1; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--app); border-color: var(--ink); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 12px; }
.tile { position: relative; display: grid; gap: 4px; padding: 8px 8px 10px; border-radius: 16px; align-content: start; background: var(--app); border: 1px solid var(--line); transition: transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .25s; animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.tile .pic { height: 92px; border-radius: 11px; background: var(--tile); display: grid; place-items: center; overflow: hidden; position: relative; }
.tile .pic img { height: 80px; object-fit: contain; }
.tile .kind { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700; color: #1c1a33; background: rgba(255,255,255,.92); border-radius: 6px; padding: 1px 6px; display: inline-flex; gap: 4px; align-items: center; }
.tile .kind svg { width: 11px; height: 11px; }
.tile .t { font-size: 13.5px; font-weight: 650; line-height: 1.3; margin-top: 2px; }
.tile .m { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.tile .who { position: absolute; top: 14px; left: 14px; }
.tile .x { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--app); color: var(--muted); display: grid; place-items: center; opacity: 0; transition: opacity .18s; box-shadow: var(--shadow-sm); }
.tile .x svg { width: 12px; height: 12px; }
.tile:hover .x, .tile:focus-within .x { opacity: 1; }
@media (hover: none) { .tile .x { opacity: 1; } }
.tile .add { justify-self: start; margin-top: 4px; display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 600; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); border-radius: 999px; padding: 4px 11px; }
.tile .add svg { width: 13px; height: 13px; }
.morebtn { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--lav); border-radius: 999px; padding: 5px 12px; }
.morebtn svg { width: 14px; height: 14px; }

/* Belgeler satırları */
.drow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: 14px; }
.drow img { width: 40px; height: 40px; object-fit: contain; grid-row: span 2; }
.drow b { font-size: 15px; }
.drow .ts { grid-column: 2; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.drow .tr { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 8px; align-items: center; }
.info-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--book-bg); color: var(--book-ink); font-size: 14px; font-weight: 600; }
.info-row svg { width: 16px; height: 16px; }
.info-row span { color: var(--ink); font-weight: 400; }

/* Hazırlık: işaretlenen “Hazır”a taşınır */
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.ck { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 14px; cursor: pointer; animation: rise .4s cubic-bezier(.16, 1, .3, 1); }
.ck .box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--dash); background: var(--app); display: grid; place-items: center; flex: none; color: transparent; transition: background .25s, border-color .25s; }
.ck .box svg { width: 13px; height: 13px; stroke-width: 3; }
.ck .ct { flex: 1; min-width: 0; display: grid; }
.ck small { font-size: 12px; color: var(--muted); }
.ck .buy { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; color: var(--accent-ink); white-space: nowrap; }
.ck .buy .bm { width: 15px; height: 15px; font-size: 9px; }
.ready-h { font-size: 13px; font-weight: 650; color: var(--book-ink); display: flex; gap: 6px; align-items: center; }
.ready-h svg { width: 15px; height: 15px; }
.ck.ok { background: var(--app); border: 1px solid var(--book-line); }
.ck.ok .box { background: var(--book-ink); border-color: var(--book-ink); color: var(--app); }
.ck.ok .tag { font-size: 11.5px; font-weight: 700; color: var(--book-ink); background: var(--book-bg); border-radius: 999px; padding: 1px 8px; }

/* Seçim penceresi */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: grid; place-items: center; padding: 24px 16px; opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.picker { width: min(640px, 100%); max-height: min(88vh, 860px); overflow: auto; background: var(--app); border-radius: 22px; box-shadow: var(--shadow-lg); transform: translateY(16px) scale(.98); transition: transform .4s cubic-bezier(.16, 1, .3, 1); }
.scrim.on .picker { transform: none; }
.pk-h { position: sticky; top: 0; background: var(--app); z-index: 2; padding: 18px 20px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; border-bottom: 1px solid var(--line2); }
.pk-h .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; grid-row: span 2; }
.pk-h .ic svg { width: 20px; height: 20px; }
.pk-h h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
.pk-h p { margin: 0; font-size: 13.5px; color: var(--muted); grid-column: 2; }
.pk-h .close { grid-row: 1 / span 2; grid-column: 3; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.pk-b { padding: 16px 20px 18px; display: grid; gap: 14px; }
.foryou { padding: 12px 14px; border-radius: 14px; background: var(--lav); font-size: 14px; display: grid; gap: 2px; }
.foryou b { font-weight: 700; }
.pk-sec { display: grid; gap: 8px; }
.pk-sec h6 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.pk-sec h6 svg { width: 14px; height: 14px; }
.opt { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); transition: border-color .2s, background .2s; animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
.opt:hover { border-color: var(--accent); }
.opt.cur { background: var(--plan-bg); border-color: var(--plan-line); }
.opt.cur.rez { background: var(--book-bg); border-color: var(--book-line); }
.score { width: 44px; height: 44px; border-radius: 50%; grid-row: span 3; display: grid; place-items: center; align-content: center; font-weight: 800; font-size: 16px; line-height: 1; background: var(--soft); }
.score small { font-size: 9px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.score.hi { background: var(--lav); color: var(--accent-ink); }
.opt .on { font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rozet { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--lav); color: var(--accent-ink); }
.opt .os { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.opt .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.reacts { display: inline-flex; gap: 5px; align-items: center; }
.reacts svg { width: 14px; height: 14px; }
.opt .pr { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-weight: 750; font-size: 16px; }
.opt .pr small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.opt .act { grid-column: 3; grid-row: 3; justify-self: end; }
.ghost { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--app); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.ghost svg { width: 13px; height: 13px; }
.chosen-ok { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 650; color: var(--book-ink); }
.chosen-ok svg { width: 14px; height: 14px; }
.booked { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 0; }
.booked div { padding: 10px 12px; border-radius: 12px; background: var(--book-bg); display: grid; gap: 1px; }
.booked dt { font-size: 12px; color: var(--muted); }
.booked dd { margin: 0; font-weight: 700; font-size: 15px; }
.pk-f { position: sticky; bottom: 0; background: var(--app); border-top: 1px solid var(--line2); padding: 12px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pk-f .sp { flex: 1; }
.empty { font-size: 13.5px; color: var(--muted); padding: 10px 12px; border-radius: 12px; background: var(--soft); }

/* Hareket */
.arrive .art { animation: drop .7s cubic-bezier(.16, 1, .3, 1); }
@keyframes drop { 0% { transform: translateY(-14px) scale(.85); opacity: 0; } 100% { transform: none; opacity: 1; } }
.arrive .sil { animation: takeoff 1.1s cubic-bezier(.16, 1, .3, 1); }
@keyframes takeoff { 0% { transform: translate(-40%, 8px) rotate(-6deg); opacity: 0; } 60% { transform: translate(6%, -4px) rotate(-3deg); opacity: 1; } 100% { transform: none; } }
.arrive .lab { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); display: inline-block; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.arrive { animation: glow 1.6s cubic-bezier(.16, 1, .3, 1); }
@keyframes glow { 0% { box-shadow: 0 0 0 0 var(--glow); } 35% { box-shadow: 0 0 0 6px var(--glow); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* Pano */
.pano { padding: 22px 26px 28px; display: grid; gap: 16px; }
.pano-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pano-h h3 { margin: 0; font-family: var(--display); font-size: 34px; letter-spacing: -0.025em; }
.pano-h .cnt { color: var(--muted); font-size: 15px; }
.pano-h .sp { flex: 1; }
.pbtn { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 14px; }
.pbtn.primary { background: var(--lav); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-ink); font-weight: 600; }
.pbtn svg { width: 16px; height: 16px; }
.view { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 3px; }
.view button { padding: 6px 12px; border-radius: 9px; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.view button svg { width: 15px; height: 15px; }
.view button[aria-pressed="true"] { background: var(--app); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
.cats { display: flex; gap: 6px 20px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; align-items: center; }
.cats button { display: inline-flex; gap: 8px; align-items: center; padding: 8px 2px 10px; font-size: 14.5px; }
.cats button span { color: var(--muted); }
.cats button.on { color: var(--accent-ink); box-shadow: inset 0 -2px 0 var(--accent); }
.cats svg { width: 19px; height: 19px; }
.cats .fav svg { color: #e11d5b; }
.cats .fav.on svg { fill: #e11d5b; }
.group { display: grid; gap: 12px; }
.group + .group { padding-top: 14px; border-top: 1px solid var(--line2); }
.group-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.group-h b { font-size: 16px; }
.group-h .s { font-size: 13px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.group-h .sp { flex: 1; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; align-items: start; }
.pc { position: relative; background: var(--app); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); display: grid; transition: transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .25s, border-color .4s; }
.pc:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.pc.inplan { border-color: var(--plan-dot); }
.pc.isrez { border-color: var(--book-ink); }
.pc .img { height: 112px; position: relative; display: grid; place-items: center; overflow: hidden; }
.pc .img img { height: 88px; object-fit: contain; }
.pc .rz { position: absolute; top: 10px; left: 10px; }
.pc .heart { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; color: #1c1a33; transition: transform .25s cubic-bezier(.2, 1.6, .4, 1); }
.pc .heart:active { transform: scale(.85); }
.pc .heart svg { width: 16px; height: 16px; }
.pc .heart.on svg { fill: #e11d5b; stroke: #e11d5b; }
.pc .sc { position: absolute; right: 10px; bottom: -20px; width: 44px; height: 44px; border-radius: 50%; background: var(--app); box-shadow: var(--shadow-sm); display: grid; place-items: center; align-content: center; font-weight: 800; font-size: 15px; line-height: 1; z-index: 1; }
.pc .sc small { font-size: 9px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.pc .bd { padding: 14px 14px 8px; display: grid; gap: 4px; align-content: start; }
.pc .need { font-size: 12px; font-weight: 650; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.pc .need svg { width: 13px; height: 13px; }
.pc .row1 { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pc h5 { margin: 0; font-size: 16px; font-weight: 750; line-height: 1.25; padding-right: 40px; }
.pc .meta { font-size: 13px; color: var(--muted); }
.pc .row3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.pc .pr { font-size: 16.5px; font-weight: 750; }
.pc .pr small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.addp { display: inline-flex; gap: 6px; align-items: center; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); border-radius: 10px; padding: 5px 11px; font-size: 13.5px; font-weight: 600; }
.addp svg { width: 14px; height: 14px; }
.addp.on { background: var(--plan-bg); border-color: var(--plan-line); color: var(--plan-ink); }
.addp.rez { background: var(--book-bg); border-color: var(--book-line); color: var(--book-ink); }
.dest { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.dest svg { width: 12px; height: 12px; }
.why2 { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 14px; border-top: 1px solid var(--line2); font-size: 13px; color: var(--accent-ink); font-weight: 600; }
.why2 svg { width: 15px; height: 15px; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.why2[aria-expanded="true"] svg { transform: rotate(180deg); }
.detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.16, 1, .3, 1); }
.detail.open { grid-template-rows: 1fr; }
.detail > div { overflow: hidden; }
.detail .in { padding: 4px 14px 12px; display: grid; gap: 8px; font-size: 13px; }
.pm-l { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
.pm-l li { display: flex; gap: 6px; align-items: flex-start; }
.pm-l .p { color: var(--plus); } .pm-l .m { color: var(--minus); }
.pm-l li::before { font-weight: 800; width: 10px; flex: none; }
.pm-l .p::before { content: "+"; } .pm-l .m::before { content: "−"; }
.only { font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 0 5px; background: var(--lav); color: var(--accent-ink); white-space: nowrap; }
.crit { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; color: var(--muted); }
.crit b { color: var(--ink); font-weight: 600; }
.crit .y { color: var(--plus); font-weight: 650; } .crit .n { color: var(--minus); font-weight: 650; } .crit .q { color: var(--muted); }
.crit-h { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.ele { justify-self: start; font-size: 12.5px; color: var(--muted); }
.ele:hover { color: var(--minus); }
.pc .ft { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 10px; border-top: 1px solid var(--line2); font-size: 12.5px; color: var(--muted); gap: 8px; }
.pc .ft span { display: inline-flex; gap: 6px; align-items: center; }
.pc .ft svg { width: 15px; height: 15px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
table.cmp { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
.cmp th, .cmp td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line2); vertical-align: top; }
.cmp thead th { background: var(--soft); font-size: 14px; }
.cmp thead th .tn { display: flex; gap: 8px; align-items: center; }
.cmp thead th small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.cmp tbody th { color: var(--muted); font-weight: 500; white-space: nowrap; width: 140px; }
.cmp tr.part th { font-size: 11.5px; font-weight: 700; color: var(--accent-ink); background: color-mix(in srgb, var(--lav) 50%, var(--app)); padding: 6px 12px; }
.cmp td.best { background: var(--best); color: var(--book-ink); font-weight: 700; }
.cmp .y { color: var(--plus); font-weight: 650; } .cmp .n { color: var(--minus); font-weight: 650; } .cmp .q { color: var(--muted); }
.cmp tr:last-child td, .cmp tr:last-child th { border-bottom: 0; }

/* Bildirim */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--app); padding: 10px 16px; border-radius: 14px; font-size: 14px; display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.16, 1, .3, 1); z-index: 80; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { color: var(--lav); font-weight: 650; white-space: nowrap; }

.pfoot { font-size: 12.5px; color: var(--muted); text-align: center; }
.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* v10 · Pano: 4 sütun, büyük görsel, az bilgi, düğmeler aynı hizada */
.pano .pgrid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; align-items: stretch; }
@media (min-width: 1100px) { .pano .pgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pano .pc { display: flex; flex-direction: column; }
.pano .pc .img { height: auto; aspect-ratio: 4 / 3; }
.pano .pc .img img { height: auto; width: 58%; max-height: 82%; object-fit: contain; }
.pano .pc .bd { flex: 1; padding: 16px 16px 4px; gap: 6px; }
.pano .pc h5 { font-size: 17px; }
.pano .pc .meta { display: flex; gap: 6px; align-items: center; min-width: 0; }
.pano .pc .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pano .pc .act { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px 14px; min-height: 58px; }
.pano .pc .ft .ups { margin-left: auto; margin-right: 10px; }
.pano .pc .why3 { display: inline-flex; gap: 3px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--accent-ink); }
.pano .pc .why3 svg { width: 14px; height: 14px; transition: transform .3s; }
.pano .pc .why3[aria-expanded="true"] svg { transform: rotate(180deg); }

.pano .addp { white-space: nowrap; }
.pano .pc h5 { padding-right: 0; }

.slot .foot { flex-wrap: wrap; row-gap: 6px; }
.slot.m-rez .row > div { padding-right: 46px; }
/* v11 · kart altında aday özeti; seçim penceresinde AI ayrı */
.opts { padding: 4px 12px 4px 5px; }
.opts .avs .av.ai { background: var(--lav); color: var(--accent-ink); }
.alt { font-size: 12.5px; color: var(--muted); border-bottom: 1px dotted var(--dash); margin-left: 4px; }
.alt:hover { color: var(--accent-ink); }
.pk-sec.ai-sec { background: color-mix(in srgb, var(--lav) 40%, transparent); border: 1px dashed color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 16px; padding: 12px; }
.pk-sec.ai-sec > p { margin: -4px 0 4px; font-size: 12.5px; color: var(--muted); }
/* v11 · Pano: durum süzgeci, sıralama, beğenenler, planla bağ */
.ptools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: -4px 0 14px; }
.ptools .sp { flex: 1; }
.seg2 { display: inline-flex; gap: 2px; background: var(--soft); border-radius: 10px; padding: 3px; }
.seg2 button { font-size: 13px; padding: 5px 12px; border-radius: 8px; color: var(--muted); }
.seg2 button b { font-weight: 700; margin-left: 3px; }
.seg2 button[aria-pressed="true"] { background: var(--app); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.sortl { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.sortl select { font: inherit; font-size: 13px; color: var(--ink); background: var(--app); border: 1px solid var(--line); border-radius: 10px; padding: 5px 28px 5px 10px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.pano .pc h5 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pano .pc .rib { position: absolute; left: 10px; bottom: 10px; display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--plan-bg); color: var(--plan-ink); border: 1px solid var(--plan-line); box-shadow: var(--shadow-sm); }
.pano .pc .rib.rez { background: var(--book-bg); color: var(--book-ink); border-color: var(--book-line); }
.pano .pc .rib svg { width: 12px; height: 12px; }
.pano .goplan { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 650; color: var(--plan-ink); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.pano .goplan:hover { background: var(--plan-bg); }
.pano .goplan.rez { color: var(--book-ink); }
.pano .goplan.rez:hover { background: var(--book-bg); }
.pano .goplan svg { width: 13px; height: 13px; }
.pano .likes { display: inline-flex; gap: 5px; align-items: center; margin-left: auto; margin-right: 10px; color: #e11d5b; }
.pano .likes svg { width: 13px; height: 13px; fill: currentColor; stroke: currentColor; }
.pano .likes .av { width: 20px; height: 20px; font-size: 10px; margin-left: -3px; box-shadow: 0 0 0 2px var(--app); }
.pano .likes .av:first-of-type { margin-left: 0; }
.group.focus { outline: 2px solid var(--accent); outline-offset: 8px; border-radius: 14px; }
.group-h .gp { font-size: 13px; font-weight: 650; color: var(--plan-ink); display: inline-flex; gap: 4px; align-items: center; }
.group-h .gp.rez { color: var(--book-ink); }
.group-h .gp svg { width: 13px; height: 13px; }
.switch h1 { color: var(--ink); }
.page { background: var(--bg); }
.pano .pc .img img { mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pano .pc .img img { mix-blend-mode: normal; } }
:root[data-theme="dark"] .pano .pc .img img { mix-blend-mode: normal; }
.pc .ft .av, .pano .likes .av { display: inline-grid; place-items: center; gap: 0; }
.pano .pc .sc { bottom: 10px; right: 10px; }
.grid3 .slot.m-rez .row > div { padding-right: 0; }
.grid3 .slot .stamp { top: auto; bottom: 46px; right: 12px; width: 32px; height: 32px; }
.grid3 .slot .stamp svg { width: 13px; height: 13px; }

/* v12 · Kararlar (uçuş, konaklama, ulaşım) v11 kartlarıyla; kaynak açık: Pano'dan (sizin) / ✨ Önerimiz.
   Hazır gelenler (etkinlik, yapılacak ve restoran, eSIM) gerçek önerilerle planda gelir: × çıkar, ↻ başkası. */
.grp { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 4px -2px; }
.grp b { font-size: 12.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); }
.grp span { font-size: 13.5px; color: var(--muted); }
.srckey { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); padding: 8px 12px; border-radius: 12px; background: var(--soft); }
.srckey > span { display: inline-flex; gap: 7px; align-items: center; }
.srckey b { color: var(--ink); font-weight: 650; }
.srcbtn { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; text-align: left; }
.srcchip { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; font-weight: 650; padding: 2px 9px 2px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--app); color: var(--ink); white-space: nowrap; }
.srcchip .avs { display: inline-flex; }
.srcchip .avs .av + .av { margin-left: -6px; }
.srcchip.ai { border: 1px dashed var(--accent); color: var(--accent-ink); }
.srcbtn .pickgo { display: inline-flex; gap: 2px; align-items: center; font-size: 13px; font-weight: 700; color: var(--accent-ink); padding: 3px 4px 3px 8px; }
.srcbtn:hover .pickgo { text-decoration: underline; }
.pk-wants { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.pk-wants > span:first-child { color: var(--muted); font-weight: 650; margin-right: 2px; }
.pk-wants .w { padding: 3px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
.hz-fit { display: flex; gap: 4px 10px; flex-wrap: wrap; font-size: 12.5px; margin-top: 3px; }
.hz-ok { color: var(--plus); } .hz-no { color: var(--minus); } .hz-unk { color: var(--muted); }
.hz-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.hz-h .sp { flex: 1; }
.hz-h .ghostbtn { display: inline-flex; gap: 6px; align-items: center; padding: 5px 11px; border-radius: 9px; border: 1px solid var(--line); color: var(--accent-ink); font-weight: 650; font-size: 13px; }
.hz-h .ghostbtn:hover { background: var(--lav); }
.hz-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px; }
.hz-tile { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; background: var(--app); min-width: 0; position: relative; }
.hz-tile.rez { background: var(--book-bg); border-color: var(--book-line); }
.hz-pic { aspect-ratio: 16 / 10; display: grid; place-items: center; position: relative; background: color-mix(in srgb, var(--c-exp) 10%, var(--app)); max-width: 100%; }
.hz-pic img { width: 40%; }
.hz-tag { position: absolute; top: 8px; left: 8px; font-size: 11.5px; font-weight: 700; background: var(--app); color: var(--accent-ink); border-radius: 999px; padding: 2px 8px 2px 3px; display: inline-flex; gap: 5px; align-items: center; }
.hz-tag.rez { color: var(--book-ink); padding-left: 8px; }
.hz-tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
.hz-ib { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); background: var(--app); border: 1px solid var(--line); }
.hz-ib:hover { color: var(--ink); }
.hz-ib svg { width: 15px; height: 15px; }
.hz-b { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
.hz-n { font-weight: 700; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.hz-m { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.hz-m svg { width: 13px; height: 13px; }
.hz-p { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.hz-p b { font-size: 16px; }
.hz-p span { font-size: 12.5px; color: var(--muted); }
.hz-f { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; padding-top: 6px; border-top: 1px solid var(--line2); }
.hz-f .sp { flex: 1; }
.hz-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.hz-city { display: grid; gap: 6px; align-content: start; }
.hz-city h5 { margin: 0 0 2px; font-size: 12.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hz-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; background: var(--tile); border: 1px solid var(--line2); }
.hz-pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.hz-pin svg { width: 15px; height: 15px; }
.hz-pin.food { background: #e8710a; } .hz-pin.go { background: #1a73e8; }
.hz-rt { min-width: 0; }
.hz-rt b { display: block; font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hz-rt span { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.hz-row .hz-ib { width: 28px; height: 28px; }

/* v13 · niyet kartı sade; altına açılan liste: Pano'dan (sizin) sonra Önerimiz. Kart açılınca satırı kaplar. */
.slot.open, .tkw.open { grid-column: 1 / -1; }
.slot.open { cursor: default; box-shadow: var(--shadow-sm); }
.dd2 { display: inline-flex; gap: 8px; align-items: center; font-weight: 650; color: var(--accent-ink); padding: 4px 8px 4px 11px; border-radius: 999px; background: color-mix(in srgb, var(--lav) 60%, transparent); }
.dd2:hover { background: var(--lav); }
.dd2 .avs { display: inline-flex; }
.dd2 .avs .av { width: 20px; height: 20px; font-size: 10px; margin-left: -6px; box-shadow: 0 0 0 2px var(--app); }
.dd2 .avs .av:first-child { margin-left: 0; }
.dd2 svg.chev { width: 15px; height: 15px; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.dd2[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
.drop2 { display: grid; gap: 14px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--dash) 40%, transparent); animation: rise .35s cubic-bezier(.16, 1, .3, 1); cursor: default; }
.dr-want { margin: 0; font-size: 13px; color: var(--muted); }
.dr-want b { color: var(--ink); font-weight: 600; }
.dr-g { display: grid; gap: 6px; }
.dr-gh { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.dr-gh svg { width: 14px; height: 14px; }
.dr-gh span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); font-size: 12.5px; margin-left: 2px; }
.dr-g.ai .dr-gh { color: var(--accent-ink); }
.dr-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 9px 10px 9px 12px; border-radius: 12px; background: var(--app); border: 1px solid var(--line); }
.m-bos .dr-row { background: var(--tile); }
.dr-g.ai .dr-row { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.dr-row.cur { border: 1.5px dashed var(--plan-line); background: var(--plan-bg); }
.dr-t { min-width: 0; display: grid; }
.dr-t b { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-t b .num { font-weight: 500; color: var(--muted); font-size: 13px; }
.dr-t small { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-p { text-align: right; font-weight: 750; font-size: 15px; white-space: nowrap; }
.dr-p small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.dr-f { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.dr-f .k { font-weight: 650; margin-right: 2px; }
.dr-f .sp { flex: 1; }
.dr-empty { margin: 0; font-size: 13.5px; color: var(--muted); }
@media (max-width: 640px) { .dr-row { grid-template-columns: 22px minmax(0, 1fr) auto; } .dr-who { display: none; } .dr-a { grid-column: 2 / -1; justify-self: start; } }

/* v14 · karta basınca dört açılış (Çevir, Balon, Çekmece, Kart içinde); ulaşım hazır gelir; kartta bilgi az, araçlar üstüne gelince */
.om-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.om-row .om-l { font-size: 13px; font-weight: 650; color: var(--ink); margin: 0 2px 0 4px; }
.om-row .om-d { font-size: 13px; color: var(--muted); }
.slot.sel { outline: 2px solid var(--accent); outline-offset: 3px; }
.slot.flipback { cursor: default; animation: flipin .5s cubic-bezier(.16, 1, .3, 1); gap: 10px; }
@keyframes flipin { from { transform: perspective(1000px) rotateY(-80deg); opacity: .2; } to { transform: none; opacity: 1; } }
.bk-h { display: flex; gap: 8px; align-items: center; min-width: 0; }
.bk-h b { font-size: 16px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-h small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.bk-h .sp { flex: 1; }
.xbtn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); background: var(--app); flex: none; }
.xbtn:hover { color: var(--ink); }
.xbtn svg { width: 13px; height: 13px; }
.ol { display: grid; gap: 6px; }
.ol-w { margin: 0; font-size: 12.5px; color: var(--muted); }
.ol-h { font-size: 11.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.ol-h.ai { color: var(--accent-ink); }
.ol-h svg { width: 13px; height: 13px; }
.or { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 8px 8px 11px; border-radius: 12px; background: var(--tile); border: 1px solid var(--line2); }
.or.ai { border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--app); }
.or.cur { border: 1.5px dashed var(--plan-line); background: var(--plan-bg); }
.or-t { min-width: 0; }
.or-t b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.or-t small { display: flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.or-t small .bm { width: 15px; height: 15px; font-size: 8.5px; }
.or-t small .av { width: 16px; height: 16px; font-size: 8.5px; border-width: 1px; }
.or-p { font-weight: 750; font-size: 14px; white-space: nowrap; text-align: right; }
.or .pick { padding: 4px 11px; font-size: 12.5px; }
.ol-f { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.ol-f a { color: var(--accent-ink); }
.ol-f .sp { flex: 1; }
.ol-f .morebtn { padding: 4px 10px; font-size: 12.5px; }
#layerRoot .pop { position: fixed; z-index: 55; width: min(420px, calc(100vw - 32px)); max-height: 72vh; overflow: auto; background: var(--app); border-radius: 18px; box-shadow: var(--shadow-lg); border: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; animation: rise .28s cubic-bezier(.16, 1, .3, 1); }
.sheet-scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--scrim) 45%, transparent); z-index: 54; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.sheet { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(440px, calc(100vw - 24px)); background: var(--app); border-radius: 22px; box-shadow: var(--shadow-lg); z-index: 55; display: flex; flex-direction: column; animation: slidein .34s cubic-bezier(.16, 1, .3, 1); }
@keyframes slidein { from { transform: translateX(36px); opacity: 0; } }
.sh-h { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.sheet .sh-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line2); }
.sh-h img { width: 52px; height: 44px; object-fit: contain; border-radius: 12px; background: var(--tile); padding: 3px; }
.sh-h b { display: block; font-size: 16px; }
.sh-h small { font-size: 12.5px; color: var(--muted); }
.sh-b { overflow: auto; padding: 14px 18px 20px; display: grid; gap: 10px; align-content: start; }
.srcl { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.srcl.ai { color: var(--accent-ink); }
.srcl .av { width: 18px; height: 18px; font-size: 9px; }
.slot.swiping .what, .slot.swiping .route b { animation: rise .3s cubic-bezier(.16, 1, .3, 1); }
.pager { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pg { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--app); color: var(--ink); }
.pg svg { width: 14px; height: 14px; }
.flipx { transform: scaleX(-1); }
.aldim-top.hov { display: none; }
.slot:hover .aldim-top.hov, .slot:focus-within .aldim-top.hov { display: inline-flex; }
.slot.m-plan:hover .top .lab, .slot.m-plan:focus-within .top .lab { display: none; }
@media (hover: none) { .aldim-top.hov { display: inline-flex; } .slot.m-plan .top .lab { display: none; } }
.sec-i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--lav); color: var(--accent-ink); align-self: center; cursor: help; }
.sec-i svg { width: 11px; height: 11px; }
.mvl { display: grid; gap: 8px; }
.mv { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 10px 8px 8px; border-radius: 14px; border: 1.5px dashed var(--plan-line); background: var(--plan-bg); }
.mv.rez { border: 1.5px solid var(--book-line); background: var(--book-bg); }
.mv img { width: 52px; height: 42px; object-fit: contain; }
.mv-t { min-width: 0; }
.mv-t b { display: block; font-size: 15px; font-weight: 700; }
.mv-t small { font-size: 12.5px; color: var(--muted); }
.mv-p { font-weight: 750; font-size: 15px; }
.mv-a { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.mv-n { font-size: 12.5px; color: var(--muted); }
.go.sm { padding: 5px 11px; font-size: 12.5px; }
.mv .hz-ib, .hz-tools, .hz-row .hz-ib { opacity: 0; transition: opacity .18s; }
.mv:hover .hz-ib, .mv:focus-within .hz-ib, .hz-tile:hover .hz-tools, .hz-tile:focus-within .hz-tools, .hz-row:hover .hz-ib, .hz-row:focus-within .hz-ib { opacity: 1; }
@media (hover: none) { .mv .hz-ib, .hz-tools, .hz-row .hz-ib { opacity: 1; } }
.hz-tile { border: 1.5px dashed var(--plan-line); }
.hz-tile.rez { border: 1.5px solid var(--book-line); }
@media (max-width: 640px) { .mv { grid-template-columns: 44px minmax(0, 1fr) auto; } .mv-a { grid-column: 2 / -1; justify-content: flex-start; } }

.ol-pano svg { width: 15px; height: 15px; flex: none; }
.ol-pano:hover { background: color-mix(in srgb, var(--accent) 18%, var(--lav)); }
.grid3 .slot .foot { flex-wrap: wrap; row-gap: 6px; }

/* v16 · şablon standardı: metin uzasa da kart boyu aynı (tek satır, kesilir, tam adı üstüne gelince) */
.slot:not(.tk):not(.flipback) { display: flex; flex-direction: column; min-height: 172px; }
.slot:not(.tk) > .foot { margin-top: auto; }
.tk-main { display: flex; flex-direction: column; }
.tk-main > .foot { margin-top: auto; }
.what, .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row > div { min-width: 0; }
.route .c { min-width: 0; }
.route .c b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stub-k, .stub-v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
/* açılan seçenekler: küçük kartlar, hepsi aynı boy */
.mc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.mc-tag { position: absolute; top: 6px; right: 6px; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent); }

.mc-b { padding: 8px 10px 10px; display: grid; gap: 2px; align-content: start; min-width: 0; }

<script>
const I = (id, cls = "i") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const SIL = cls => `<svg class="${cls}" aria-hidden="true"><use href="#sil-plane"/></svg>`;
const BR = { web: ["W", "Resmî site"], tk: ["T", "Turkish Airlines"], qr: ["Q", "Qatar Airways"], ek: ["E", "Emirates"], booking: ["B.", "Booking"], airbnb: ["A", "Airbnb"], jr: ["JR", "JR"], klook: ["K", "Klook"], airalo: ["A", "Airalo"], ubigi: ["U", "Ubigi"], holafly: ["H", "Holafly"], google: ["G", "Google Flights"], sky: ["S", "Skyscanner"], amazon: ["a", "Amazon"], viator: ["V", "Viator"], trip: ["T", "Tripadvisor"], maps: ["M", "Google Maps"], yt: ["▶", "YouTube"], ig: ["◎", "Instagram"] };
const bm = k => `<span class="bm" style="background:var(--b-${k});${k === "jr" ? "font-size:8px" : ""}">${BR[k][0]}</span>`;
const blink = (k, extra = "") => `<a class="blink" href="#" onclick="return false">${bm(k)}${BR[k][1]}${extra}${I("ext")}</a>`;
const eur = n => n == null ? "—" : "€" + n.toLocaleString("tr-TR");
const priceTxt = o => o.total == null ? `<span class="nolink">Fiyat linkte ↗</span>` : `${eur(o.total)}<small>toplam</small>`;
const PEOPLE = { E: ["Emre", "e"], S: ["Sabine", "s"] };
const av = (w, lg) => w === "AI" ? `<span class="av ai${lg ? " lg" : ""}" title="AI önerisi">${I("spark")}</span>` : `<span class="av${lg ? " lg" : ""}" style="background:var(--p-${PEOPLE[w][1]})" title="${PEOPLE[w][0]}">${w}</span>`;
const saver = w => w === "AI" ? `<span class="saver">${av("AI")}Önerimiz</span>` : `<span class="saver">${av(w)}<b>${PEOPLE[w][0]}</b> kaydetti</span>`;
const sd = m => `<span class="sd ${m}">${m === "rez" ? I("check") : ""}</span>`;
