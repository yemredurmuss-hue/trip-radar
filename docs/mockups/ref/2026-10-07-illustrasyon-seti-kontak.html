<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İllüstrasyon seti — kontak</title>
<style>
  :root { --bg: #f4f4f7; --card: #fff; --line: #e4e4ea; --text: #1d1d2b; --muted: #6b6b7b; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
  h2 { font-size: 15px; margin: 24px 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  figure img { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; border: 1px solid var(--line); }
  figcaption { margin-top: 8px; font-size: 13px; }
  figcaption small { display: block; color: var(--muted); font-size: 11px; }
</style>
</head>
