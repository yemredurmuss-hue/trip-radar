<title>Bali Planı Aşamaları</title>
<style>
/* Layout: üstte senaryo seçici; altında eklentinin web panosu (solda sohbet, sağda bugünkü hero v9 + kategori bölümleri). "Aşamalar" sekmesi aynı kartın dört hâlini yan yana ve canlı gösterir. */
:root {
  --bg: #eeecf5; --app: #ffffff; --soft: #f7f5f1; --tile: #fbfaf7;
  --ink: #1c1a33; --muted: #6b6790; --line: #e7e4dd; --line2: #efece7;
  --accent: #5b45e0; --accent-ink: #4a35cc; --lav: #ece8ff; --on-accent: #ffffff;
  --mint: #eaf7f2; --mintbar: #2cc79a; --planbar: #f0a53a;
  --idea-bg: #f5f2ff; --idea-line: #d8cfff;
  --plan-bg: #fbf6ea; --plan-line: #ead7a6; --plan-ink: #8a5a00;
  --book-bg: #eef8f1; --book-line: #bfe3cc; --book-ink: #1b7f45;
  --c-fly: #6a4fe0; --c-stay: #23998b; --c-move: #c58a2e; --c-exp: #a8336f; --c-todo: #1f8f4e; --c-esim: #3b6fd1; --c-ins: #0f8a6a; --c-insp: #c0256b;
  --b-booking: #003b95; --b-airbnb: #c8174f; --b-google: #1765cc; --b-sky: #0062e3; --b-viator: #186b6d; --b-airalo: #b82a30; --b-trip: #00744e; --b-maps: #1e8e3e; --b-yt: #d00000; --b-qatar: #5c0632; --b-klook: #a83a00;
  --on-brand: #ffffff;
  --glow: rgba(91, 69, 224, .4);
  --shadow: 0 1px 2px rgba(28, 26, 51, .05), 0 16px 40px -22px rgba(28, 26, 51, .28);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0c14; --app: #17161f; --soft: #201e2c; --tile: #efede8;
  --ink: #eeecfb; --muted: #aaa6c9; --line: #2f2d40; --line2: #292737;
  --accent: #9a8bff; --accent-ink: #b5aaff; --lav: #2a2550; --on-accent: #16132e;
  --mint: #142d27; --mintbar: #2cc79a; --planbar: #f0a53a;
  --idea-bg: #1f1b38; --idea-line: #3a3270;
  --plan-bg: #2a2416; --plan-line: #57461f; --plan-ink: #f0bf63;
  --book-bg: #142a1e; --book-line: #26583a; --book-ink: #5fd393;
  --c-fly: #9d8bff; --c-stay: #3fc4b4; --c-move: #e2ab52; --c-exp: #e866a6; --c-todo: #4cc584; --c-esim: #77a3f3; --c-ins: #3fc79f; --c-insp: #ec6aa4;
  --glow: rgba(154, 139, 255, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 44px -22px rgba(0, 0, 0, .8);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d0c14; --app: #17161f; --soft: #201e2c; --tile: #efede8;
  --ink: #eeecfb; --muted: #aaa6c9; --line: #2f2d40; --line2: #292737;
  --accent: #9a8bff; --accent-ink: #b5aaff; --lav: #2a2550; --on-accent: #16132e;
  --mint: #142d27; --mintbar: #2cc79a; --planbar: #f0a53a;
  --idea-bg: #1f1b38; --idea-line: #3a3270;
  --plan-bg: #2a2416; --plan-line: #57461f; --plan-ink: #f0bf63;
  --book-bg: #142a1e; --book-line: #26583a; --book-ink: #5fd393;
  --c-fly: #9d8bff; --c-stay: #3fc4b4; --c-move: #e2ab52; --c-exp: #e866a6; --c-todo: #4cc584; --c-esim: #77a3f3; --c-ins: #3fc79f; --c-insp: #ec6aa4;
  --glow: rgba(154, 139, 255, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 44px -22px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
::selection { background: var(--lav); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.page { padding-block: 20px 48px; padding-inline: clamp(16px, 2.4vw, 32px); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 1560px; margin: 0 auto; }
.page > * { min-width: 0; }

/* Senaryo seçici */
.switch { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; gap: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-radius: 16px; }
.switch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.switch h1 { margin: 0 8px 0 4px; font-family: var(--display); font-size: 17px; letter-spacing: -0.01em; }
.tabs-sc { display: flex; gap: 4px; flex-wrap: wrap; background: var(--app); padding: 4px; border-radius: 12px; box-shadow: var(--shadow); }
.tabs-sc button { padding: 6px 12px; border-radius: 9px; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tabs-sc button b { font-weight: 700; color: var(--accent-ink); }
.tabs-sc button[aria-selected="true"] { background: var(--ink); color: var(--app); }
.tabs-sc button[aria-selected="true"] b { color: var(--app); }
.motion { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 9px; }
.motion:hover { background: var(--app); }
.sc-desc { margin: 0 4px; font-size: 14px; color: var(--muted); }
.sc-desc b { color: var(--ink); font-weight: 600; }

/* Uygulama kabuğu */
.shell { background: var(--app); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line2); }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 750; font-size: 17px; }
.logo svg { width: 22px; height: 22px; }
.tripsel { color: var(--muted); font-size: 14px; display: inline-flex; gap: 4px; align-items: center; padding-left: 14px; border-left: 1px solid var(--line); }
.topbar .sp { flex: 1; }
.share { font-size: 13.5px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; display: inline-flex; gap: 6px; align-items: center; }
.cols { display: grid; grid-template-columns: 340px minmax(0, 1fr); }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .chat { border-right: 0; border-bottom: 1px solid var(--line2); max-height: none; } }

/* Sohbet */
.chat { border-right: 1px solid var(--line2); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.chat h2 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.chat h2 svg { color: var(--accent); }
.msgs { display: grid; gap: 10px; align-content: start; flex: 1; }
.msg { padding: 10px 12px; border-radius: 14px; font-size: 14px; max-width: 100%; }
.msg.me { background: var(--lav); border-top-left-radius: 5px; }
.msg.ai { background: var(--soft); border-top-left-radius: 5px; }
.msg b { font-weight: 650; }
.who-l { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-ink); background: var(--app); }
.links { display: grid; gap: 4px; margin-top: 8px; }
.links .lk { display: flex; gap: 7px; align-items: center; font-size: 12.5px; background: var(--app); border-radius: 8px; padding: 4px 7px; min-width: 0; }
.links .lk span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.links .head { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.input { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 12px; color: var(--muted); font-size: 14px; }
.input .send { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; background: var(--lav); color: var(--accent-ink); display: grid; place-items: center; }

/* Hero v9, aynen */
.main { padding: 20px 24px 28px; display: grid; gap: 18px; min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 62fr) minmax(0, 34fr); gap: 4%; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.story { display: grid; gap: 12px; align-content: start; min-width: 0; }
.photo { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 1.92 / 1; max-width: 100%; }
.photo svg { display: block; width: 100%; height: 100%; }
.citysel { position: absolute; top: 12px; left: 12px; display: flex; padding: 4px; background: rgba(255,255,255,.9); border-radius: 999px; font-size: 14px; color: #6b6790; }
.citysel span { padding: 4px 12px; border-radius: 999px; }
.citysel span.on { background: #fff; color: #1c1a33; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.pills { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
.pills span { background: #ece8ff; color: #4a35cc; font-size: 13px; padding: 5px 11px; border-radius: 999px; }
.story h3 { margin: 4px 0 0; font-family: var(--display); font-size: clamp(28px, 3vw, 40px); line-height: 1.05; letter-spacing: -0.025em; }
.dline { display: flex; gap: 8px; align-items: center; font-size: 16px; }
.dline svg { color: var(--ink); }
.tone { margin: 0; color: var(--muted); font-size: 16px; text-wrap: pretty; }
.cells { display: flex; flex-wrap: wrap; border-top: 0; }
.cell { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 0; margin-right: 16px; border-right: 1px solid var(--line); font-size: 16px; white-space: nowrap; }
.cell:last-child { border-right: 0; }
.cell svg { width: 20px; height: 20px; }
.prog { background: var(--mint); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; }
.prog b { font-size: 16px; }
.prog .legend { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.seg { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--mintbar) 16%, transparent); }
.seg i { display: block; height: 100%; transition: width .7s cubic-bezier(.16, 1, .3, 1); }
.prog .cta { grid-row: 1 / span 3; grid-column: 2; background: var(--ink); color: var(--app); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
@media (max-width: 560px) { .prog { grid-template-columns: minmax(0, 1fr); } .prog .cta { grid-row: auto; grid-column: auto; justify-self: start; } }
.card { background: var(--soft); border-radius: 20px; padding: 18px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card .blk + .blk { border-top: 1px solid var(--line); padding-top: 14px; }
.people { display: flex; gap: 12px; align-items: center; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--accent-ink); background: var(--lav); border: 2px solid var(--soft); }
.av + .av { margin-left: -12px; }
.people small { display: block; color: var(--muted); font-size: 13.5px; }
.styles { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.style { font-size: 13.5px; padding: 5px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
.style svg { width: 15px; height: 15px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14.5px; }
.kv .h { font-weight: 700; font-size: 17px; }
.kv .m { color: var(--muted); }
.kv .r { text-align: right; }
.country { display: flex; gap: 8px; align-items: center; font-size: 14.5px; }
.flag { width: 24px; height: 16px; border-radius: 3px; background: linear-gradient(#d7262e 50%, #fff 50%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.wx { display: flex; gap: 16px; font-size: 14px; margin-top: 8px; flex-wrap: wrap; }
.wx span { display: inline-flex; gap: 6px; align-items: center; }
.wx svg { width: 16px; height: 16px; color: var(--c-move); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.ptabs { display: flex; justify-content: center; gap: 28px; font-size: 15px; color: var(--muted); }
.ptabs span.on { color: var(--ink); font-weight: 650; box-shadow: inset 0 -3px 0 var(--accent); padding-bottom: 8px; }

/* Plan başlığı */
.planbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.planbar strong { font-size: 20px; font-family: var(--display); letter-spacing: -0.01em; }
.sortsw { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; font-size: 13px; }
.sortsw span { padding: 4px 10px; border-radius: 8px; color: var(--muted); }
.sortsw span.on { background: var(--app); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.stagekey { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }

/* Aşama çipleri: her yerde aynı dil */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.st svg { width: 13px; height: 13px; }
.st-niyet { color: var(--muted); border: 1.5px dashed color-mix(in srgb, var(--muted) 60%, transparent); }
.st-fikir { color: var(--accent-ink); background: var(--idea-bg); border: 1px solid var(--idea-line); }
.st-plan { color: var(--plan-ink); background: var(--plan-bg); border: 1px solid var(--plan-line); }
.st-rez { color: var(--book-ink); background: var(--book-bg); border: 1px solid var(--book-line); }

/* Bölümler: tek yüzey, ince çizgi */
.plan { border: 1px solid var(--line2); border-radius: 22px; overflow: hidden; }
.sec { padding: 18px 20px 20px; display: grid; gap: 14px; }
.sec + .sec { border-top: 1px solid var(--line2); }
.sec-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sec-h h4 { margin: 0; font-size: 17px; font-weight: 650; }
.sec-h .sp { flex: 1; }
.sec-h .sum { font-size: 13px; color: var(--muted); }
.mini { width: 96px; height: 6px; border-radius: 99px; background: var(--line2); display: flex; overflow: hidden; }
.mini i { display: block; height: 100%; transition: width .7s cubic-bezier(.16, 1, .3, 1); }
.sec-why { margin: -6px 0 0; font-size: 13.5px; color: var(--accent-ink); display: flex; gap: 6px; align-items: center; }
.sec-why svg { width: 14px; height: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 10px; }

/* İhtiyaç kartı (niyet kabı) */
.need { position: relative; border-radius: 18px; padding: 14px; display: grid; gap: 10px; align-content: start; background: var(--app); border: 1.5px dashed color-mix(in srgb, var(--muted) 50%, transparent); transition: background .4s, border-color .4s, box-shadow .3s; min-width: 0; }
.need.s-fikir { border: 1px solid var(--idea-line); }
.need.s-plan { background: var(--plan-bg); border: 1px solid var(--plan-line); }
.need.s-rez { background: var(--book-bg); border: 1px solid var(--book-line); }
.nhead { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; }
.illus { width: 72px; height: 54px; border-radius: 10px; background: var(--tile); object-fit: contain; padding: 3px; grid-row: span 2; }
.nhead h5 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.nmeta { font-size: 13.5px; color: var(--muted); grid-column: 2; }
.nmeta .date { color: var(--ink); font-weight: 600; }
.nhead .st { grid-row: 1; grid-column: 3; }
.why { margin: 0; font-size: 13.5px; color: var(--accent-ink); display: flex; gap: 6px; align-items: flex-start; }
.why svg { width: 14px; height: 14px; margin-top: 2px; }
.wants { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.wants li { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--soft); }
.need.s-plan .wants li, .need.s-rez .wants li { background: color-mix(in srgb, var(--app) 70%, transparent); }

/* Fikir satırı (aday) */
.opts { display: grid; gap: 6px; }
.opt { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 1px 10px; align-items: center; padding: 7px 8px; border-radius: 12px; background: var(--idea-bg); transition: background .2s, box-shadow .3s; }
.opt.ai { background: transparent; border: 1px dashed var(--idea-line); }
.opt .th { width: 44px; height: 44px; border-radius: 9px; grid-row: span 2; }
.opt .on { font-size: 14px; font-weight: 650; display: flex; gap: 6px; align-items: center; min-width: 0; }
.opt .on span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .os { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.opt .pr { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-size: 14.5px; font-weight: 700; }
.opt .pr small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.mine { font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 5px; padding: 0 5px; }
.aitag { font-size: 11px; font-weight: 700; color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 5px; padding: 0 5px; display: inline-flex; gap: 3px; align-items: center; }
.aitag svg { width: 10px; height: 10px; }
.bm { width: 16px; height: 16px; border-radius: 4px; color: var(--on-brand); font-size: 9.5px; font-weight: 800; display: inline-grid; place-items: center; flex: none; }
/* Üstüne gelince eylemler görünür */
.hov { position: absolute; right: 8px; top: 50%; transform: translateY(-50%) translateX(6px); display: flex; gap: 6px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .18s, transform .25s cubic-bezier(.16, 1, .3, 1); background: linear-gradient(90deg, transparent, var(--app) 18%); padding-left: 24px; border-radius: 10px; }
.opt:hover .hov, .opt:focus-within .hov { opacity: 1; transform: translateY(-50%); pointer-events: auto; }
.btn { border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn svg { width: 14px; height: 14px; }
.btn.dark { background: var(--ink); color: var(--app); }
.btn.ghost { border: 1px solid var(--line); background: var(--app); }
.btn.link { color: var(--accent-ink); padding-inline: 6px; }
.xbtn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--app); border: 1px solid var(--line); }
.xbtn:hover { color: #c62828; }
.xbtn svg { width: 13px; height: 13px; }
.moreai { font-size: 13px; color: var(--accent-ink); display: inline-flex; gap: 6px; align-items: center; padding: 4px 2px; }
.moreai svg { width: 14px; height: 14px; }

/* Seçilmiş (plan / rezerve) */
.chosen { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 2px 12px; align-items: center; padding: 10px; border-radius: 14px; background: color-mix(in srgb, var(--app) 75%, transparent); }
.chosen .th { width: 56px; height: 56px; border-radius: 11px; grid-row: span 3; align-self: start; }
.chosen .cn { font-weight: 700; font-size: 15.5px; }
.chosen .cs { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.chosen .cp { grid-column: 2; font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.chosen .cp small { font-weight: 400; font-size: 12px; color: var(--muted); }
.marks { font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; grid-column: 2 / -1; }
.y { color: var(--book-ink); } .q { color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rest { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
.rest:hover { color: var(--accent-ink); }
.rest svg { width: 14px; height: 14px; }
.doc { font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; padding: 3px 9px; border-radius: 999px; background: var(--app); border: 1px solid var(--book-line); color: var(--book-ink); }

/* Aşama hesapları */
function stayStage(s) { if (s.stage) return s.stage; if ((s.mine || []).length || (s.ai || []).length || s.aiHidden) return "fikir"; return "niyet"; }
function needs(sc) {
  const out = [];
  const f = sc.flight.stage; out.push(f, f);
  STAYS.forEach(s => out.push(stayStage(sc.stays[s.k])));
  sc.transfers.forEach(t => out.push(t));
  out.push(sc.ins);
  return out;
}
const tally = arr => ({ rez: arr.filter(s => s === "rez").length, plan: arr.filter(s => s === "plan").length, rest: arr.filter(s => s !== "rez" && s !== "plan").length, n: arr.length });

  if (stage === "plan") right = x.ticket ? `${chip("plan", "Planda · bilet yok")}<a class="btn dark" href="#" onclick="return false">Bilet al ↗</a>` : `${chip("plan", "Planda · 25 Mart")}`;
  if (stage === "rez") right = `${chip("rez", x.cat === "esim" ? "Alındı" : "Bilet alındı")}`;
  return `<div class="idea s-${stage}${x.ai && stage === "fikir" ? " ai" : ""}${o.fresh ? " fresh" : ""}">${o.fresh ? `<span class="ftag">Yeni · senin linkin</span>` : ""}
    <img src="illus/${x.img}.png" alt="">
    <span class="t">${x.t}</span>
    <span class="m num"><span class="city">${I("pin")}${x.city}</span>${srcHtml}</span>
    <span class="w">${x.why}</span>
    <span class="r">${right}</span></div>`;
}

function ideaSection(sc, cat, icon, color, name) {
  const list = sc.ideas.filter(([k]) => IDEAS[k].cat === cat);
  const order = list.slice().sort((a, b) => (b[1]?.mine ? 1 : 0) - (a[1]?.mine ? 1 : 0));
  const inPlan = list.filter(([, o]) => o && (o.stage === "plan" || o.stage === "rez")).length;
  return `<section class="sec"><header class="sec-h"><span style="color:${color}">${I(icon)}</span><h4>${name}</h4><span class="sp"></span>
      <span class="sum num">${list.length - inPlan} fikir${inPlan ? ` · ${inPlan} planda` : ""}</span></header>
    <div class="grid2">${order.map(ideaRow).join("")}</div>
    <div class="more"><span>+4 fikir daha</span><button>${I("refresh")}Yeni öneriler</button></div></section>`;
}

function board(sc) {
  const stayStages = STAYS.map(s => stayStage(sc.stays[s.k]));
  return `${hero(sc)}
  <div class="planbar"><strong>Plan</strong><span class="sortsw"><span class="on">Kategoriye göre</span><span>Yolculuk sırasıyla</span></span>
    <span class="stagekey">${chip("niyet", "Niyet")}${chip("fikir", "Fikir")}${chip("plan", "Plan")}${chip("rez", "Rezerve")}</span></div>
  <div class="plan">
    <section class="sec">${secHead("plane", "var(--c-fly)", "Uçuş", [sc.flight.stage, sc.flight.stage])}<div class="grid3">${flightCard(sc)}</div></section>
    <section class="sec">${secHead("bed", "var(--c-stay)", "Konaklama", stayStages)}
      <div class="grid3">${STAYS.map(s => stayCard(s, sc)).join("")}
      ${sc.orphan ? `<div class="orphan"><span class="th" style="background:linear-gradient(135deg,#f5c9a0,#b0603a)"></span><div class="ot"><b>Batu Bolong Lofts · Canggu</b><small><span class="mine">Senin linkin</span> Booking · rotada Canggu yok</small></div><button class="btn dark">Rotaya ekle</button><button class="btn ghost">Fikir olarak kalsın</button></div>` : ""}</div></section>
    ${transfers(sc)}
    ${ideaSection(sc, "exp", "star", "var(--c-exp)", "Deneyimler")}
    ${ideaSection(sc, "todo", "map", "var(--c-todo)", "Yapılacaklar ve restoranlar")}
    <section class="sec">${secHead("shield", "var(--c-ins)", "Sigorta ve internet", [sc.ins])}
      <div class="grid2">
        <div class="trow s-${sc.ins}">${I("shield")}<b>Seyahat sağlık sigortası</b><span class="ts num">Endonezya · 2 kişi${sc.dated ? " · 12–27 Mart" : " · 15 gün"} · dalış ve scooter kapsamına bak</span><span class="tr">${chip(sc.ins)}<a href="#" onclick="return false" style="font-size:13px">Karşılaştır ↗</a></span></div>
        ${sc.ideas.filter(([k]) => k === "esim").map(ideaRow).join("")}
      </div></section>
    ${sc.inspo ? `<section class="sec"><header class="sec-h"><span style="color:var(--c-insp)">${I("play")}</span><h4>İlham</h4><span class="sp"></span><span class="sum">1 video</span></header>
      <div class="inspo"><span class="vid">${I("play")}</span><div><b style="font-size:14.5px">Bali'de 14 gün: Ubud'dan Uluwatu'ya</b><div class="m" style="font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center"><span class="mine">Senin linkin</span>${bm("yt")}YouTube</div></div></div></section>` : ""}
  </div>`;
}

function chat(sc) {
  return `<aside class="chat"><h2>${I("spark")}Seyahat asistanı</h2><div class="msgs">${sc.chat.map(([who, txt, chips, links]) => `<div class="msg ${who}">
      <span class="who-l">${who === "me" ? "Emre" : "Asistan"}</span>${txt}
      ${links ? `<div class="links"><span class="head">${I("clip")}${links.length} link${sc === SC.C ? " · eklentide kayıtlı" : ""}</span>${links.map(l => `<span class="lk">${I("link")}<span>${l}</span></span>`).join("")}</div>` : ""}
      ${chips ? `<div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>` : ""}</div>`).join("")}</div>
    <div class="input">${I("clip")}<span>Birlikte değerlendirelim…</span><span class="send">${I("up")}</span></div></aside>`;
}

function app(sc) {
  return `<div class="shell"><div class="topbar"><span class="logo" style="color:var(--accent)">${I("compass")}<span style="color:var(--ink)">Trip Radar</span></span>
    <span class="tripsel">Bali Gezisi ${I("chev")}</span><span class="sp"></span><span class="share">${I("share")}Paylaş</span></div>
    <div class="cols">${chat(sc)}<div class="main">${board(sc)}</div></div></div>`;
}

/* Aşamalar sekmesi */
const LIVE = [
  { s: "niyet", h: "Niyet", p: "AI'nın anladığı ihtiyaç. Neden satırı ve şartlar var; seçenek yok.", trig: "Tarih ya da link gelince" },
  { s: "fikir", h: "Fikir", p: "Senin linklerin önde, AI adayları arkada. Hiçbiri plana girmedi, sayılmaz.", trig: "Birini “Plana al”" },
  { s: "plan", h: "Plan", p: "Seçtin ama rezerve değil. Diğer adaylar “Diğer 2 aday” arkasına çekilir.", trig: "Siteye git, “Rezerve ettim”" },
  { s: "rez", h: "Rezerve", p: "Alındı. Belge ve onay numarası kartta. Hero'daki bar yeşile ilerler.", trig: "" }
];
const liveSc = s => ({ dated: true, stays: { ubud: s === "niyet" ? {} : s === "fikir" ? { mine: ["sawah", "kayu"], ai: ["alas"] } : { stage: s, chosen: "sawah", rest: 2, mine: ["sawah"] } } });

function ladder() {
  const ub = STAYS[0];
  const stageCard = s => stayCard(ub, liveSc(s));
  const small = [["fikir", {}], ["plan", { stage: "plan" }], ["rez", { stage: "rez" }]];
  return `<div class="shell"><div class="ladder">
    <h3>Pahalı ve kıyaslanan: aynı kart dört aşamada</h3>
    <p>Niyet kartı bir kap: “Ubud'da 5 gece”. Seçenekler (oteller) onun içinde Fikir, Plan, Rezerve aşamalarından geçer. Kalan fikirler bir aşama değil, seçimin sonucu.</p>
    <div class="lrow">${LIVE.map(l => `<div class="lcol"><span class="lcap"><b>${l.h}</b></span>${stageCard(l.s)}${l.trig ? `<span class="trig">${I("right")}${l.trig}</span>` : ""}</div>`).join("")}</div>

    <h3>Ucuz ve keşif: niyet yok, fikirle başlar</h3>
    <p>Deneyim, yapılacak şey, restoran, eSIM doğrudan fikir olarak gelir. “Ekle” plana koyar. Bilet gerekiyorsa bir de rezerve adımı var; restoran ve gezilecek yer için plan son durak.</p>
    <div class="lrow">${small.map(([s, o]) => `<div class="lcol"><span class="lcap"><b>${STAGES[s][0] === "Planda" ? "Plan" : STAGES[s][0]}</b></span>${ideaRow(["teras", o])}</div>`).join("")}</div>

    <h3>Canlı: bir kartın yolculuğu</h3>
    <div class="live"><div id="liveCard"></div>
      <ol class="stage-list" id="liveList">${LIVE.map((l, i) => `<li data-i="${i}">${chip(l.s, l.h)}<div><b>${l.p}</b>${l.trig ? `<p>Sonraki adım: ${l.trig.toLowerCase()}</p>` : ""}</div></li>`).join("")}</ol></div>
  </div></div>`;
}

/* Yönetim */
const ORDER = ["A", "B", "C", "D", "E", "L"];
let cur = "A", still = false, liveTimer = null, liveI = 0;
function tabs() {
  document.getElementById("tabs").innerHTML = ORDER.map(k => `<button role="tab" aria-selected="${k === cur}" data-k="${k}">${k === "L" ? "Aşamalar" : `<b>${k}</b>${SC[k].tab}`}</button>`).join("");
}
function show(k) {
  cur = k; tabs();
  document.getElementById("desc").innerHTML = k === "L" ? "<b>Aşamalar.</b> Aynı otelin dört hâli yan yana; altta tek kartın aşamalardan geçişi canlı oynar." : SC[k].desc;
  document.getElementById("view").innerHTML = k === "L" ? ladder() : app(SC[k]);
  clearInterval(liveTimer);
  if (k === "L") { liveI = 0; stepLive(); if (!still) liveTimer = setInterval(stepLive, 2600); }
  document.querySelectorAll(".fresh").forEach(el => el.classList.add("play"));
  try { localStorage.setItem("tr-sc", k); } catch (e) {}
}
function stepLive() {
  const box = document.getElementById("liveCard"); if (!box) return;
  box.innerHTML = stayCard(STAYS[0], liveSc(LIVE[liveI].s));
  const card = box.firstElementChild; if (!still) card.classList.add("morph");
  document.querySelectorAll("#liveList li").forEach(li => li.classList.toggle("on", +li.dataset.i === liveI));
  liveI = (liveI + 1) % LIVE.length;
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(b.dataset.k); });
document.getElementById("motion").addEventListener("click", e => {
  still = !still; document.body.classList.toggle("still", still);
  const b = e.currentTarget; b.setAttribute("aria-pressed", String(still));
  b.innerHTML = still ? `${I("play")}<span>Hareketi oynat</span>` : `${I("pause")}<span>Hareketi duraklat</span>`;
  clearInterval(liveTimer); if (!still && cur === "L") liveTimer = setInterval(stepLive, 2600);
});
document.addEventListener("click", e => { const li = e.target.closest("#liveList li"); if (li) { liveI = +li.dataset.i; stepLive(); } });
let start = "A"; try { const s = localStorage.getItem("tr-sc"); if (ORDER.includes(s)) start = s; } catch (e) {}
show(start);
</script>
