<title>Japonya Planı</title>
<style>
/* Layout: senaryo seçici; eklentinin web panosu: solda sohbet, sağda bugünkü hero v9 + gezinin şekli + açılır/kapanır bölümler.
   Bölüm sırası (incumbent): Uçuş · Konaklama · Ulaşım · Deneyimler · Belgeler ve internet · Hazırlık.
   Pahalı olan kutucuk (niyet), ucuz olan kare fikir (doğrudan Ekle). Renk: kategori rengi ikonda ve bölüm başlığının küçük karesinde; amber seçildi; yeşil rezerve. */
:root {
  --bg: #eeecf5; --app: #ffffff; --soft: #f7f5f1; --tile: #fbfaf7;
  --ink: #1c1a33; --muted: #6b6790; --line: #e7e4dd; --line2: #efece7; --dash: #b9b5cf;
  --accent: #5b45e0; --accent-ink: #4a35cc; --lav: #ece8ff; --on-accent: #ffffff;
  --mint: #eaf7f2; --mintbar: #2cc79a; --planbar: #f0a53a;
  --plan-bg: #fbf6ea; --plan-line: #e9d29a; --plan-ink: #8a5a00; --plan-dot: #e09422;
  --book-bg: #eef8f1; --book-line: #b9e0c7; --book-ink: #1b7f45;
  --plus: #1b7f45; --minus: #c62828; --best: #e9f6ee;
  --c-fly: #6a4fe0; --c-stay: #1d8577; --c-move: #b5761c; --c-exp: #c0256b; --c-doc: #0f7a5e; --c-prep: #475467;
  --b-web: #475467; --b-tk: #c8102e; --b-qr: #5c0632; --b-ek: #b5121b; --b-booking: #003b95; --b-airbnb: #c8174f; --b-jr: #2a7a46; --b-klook: #b23c00; --b-airalo: #b82a30; --b-google: #1765cc; --b-sky: #0062e3; --b-amazon: #232f3e; --b-viator: #186b6d; --b-trip: #00744e; --b-maps: #1e8e3e;
  --on-brand: #ffffff;
  --p-e: #5b45e0; --p-s: #1d8577;
  --glow: rgba(91, 69, 224, .4); --scrim: rgba(28, 26, 51, .38);
  --shadow: 0 1px 2px rgba(28, 26, 51, .05), 0 16px 40px -22px rgba(28, 26, 51, .28);
  --shadow-sm: 0 1px 2px rgba(28, 26, 51, .06), 0 6px 18px -10px rgba(28, 26, 51, .25);
  --shadow-lg: 0 30px 80px -20px rgba(28, 26, 51, .45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0c14; --app: #17161f; --soft: #201e2c; --tile: #efede8;
  --ink: #eeecfb; --muted: #aaa6c9; --line: #2f2d40; --line2: #292737; --dash: #4d4a66;
  --accent: #9a8bff; --accent-ink: #b5aaff; --lav: #2a2550; --on-accent: #16132e;
  --mint: #142d27; --planbar: #f0a53a;
  --plan-bg: #2a2416; --plan-line: #5c4a1f; --plan-ink: #f0bf63; --plan-dot: #f0a53a;
  --book-bg: #142a1e; --book-line: #26583a; --book-ink: #5fd393; --plus: #5fd393; --minus: #ff8a80; --best: #163325;
  --c-fly: #9d8bff; --c-stay: #3fc4b4; --c-move: #e2ab52; --c-exp: #ec6aa4; --c-doc: #3fc79f; --c-prep: #aab3c5;
  --p-e: #9a8bff; --p-s: #3fc4b4;
  --glow: rgba(154, 139, 255, .5); --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 44px -22px rgba(0, 0, 0, .8);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
  --shadow-lg: 0 30px 80px -20px rgba(0, 0, 0, .9);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d0c14; --app: #17161f; --soft: #201e2c; --tile: #efede8;
  --ink: #eeecfb; --muted: #aaa6c9; --line: #2f2d40; --line2: #292737; --dash: #4d4a66;
  --accent: #9a8bff; --accent-ink: #b5aaff; --lav: #2a2550; --on-accent: #16132e;
  --mint: #142d27; --planbar: #f0a53a;
  --plan-bg: #2a2416; --plan-line: #5c4a1f; --plan-ink: #f0bf63; --plan-dot: #f0a53a;
  --book-bg: #142a1e; --book-line: #26583a; --book-ink: #5fd393; --plus: #5fd393; --minus: #ff8a80; --best: #163325;
  --c-fly: #9d8bff; --c-stay: #3fc4b4; --c-move: #e2ab52; --c-exp: #ec6aa4; --c-doc: #3fc79f; --c-prep: #aab3c5;
  --p-e: #9a8bff; --p-s: #3fc4b4;
  --glow: rgba(154, 139, 255, .5); --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 44px -22px rgba(0, 0, 0, .8);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
  --shadow-lg: 0 30px 80px -20px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
::selection { background: var(--lav); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.page { padding-block: 20px 48px; padding-inline: clamp(16px, 2.4vw, 32px); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 1560px; margin: 0 auto; }
.page > * { min-width: 0; }

/* Senaryo seçici */
.switch { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: grid; gap: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-radius: 16px; }
.switch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.switch h1 { margin: 0 8px 0 4px; font-family: var(--display); font-size: 17px; letter-spacing: -0.01em; }
.seg-c { display: flex; gap: 4px; flex-wrap: wrap; background: var(--app); padding: 4px; border-radius: 12px; box-shadow: var(--shadow); }
.seg-c button { padding: 6px 12px; border-radius: 9px; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg-c button b { font-weight: 700; color: var(--accent-ink); }
.seg-c button[aria-selected="true"] { background: var(--ink); color: var(--app); }
.seg-c button[aria-selected="true"] b { color: var(--app); }
.motion { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 9px; }
.motion:hover { background: var(--app); }
.sc-desc { margin: 0 4px; font-size: 14px; color: var(--muted); }
.sc-desc b { color: var(--ink); font-weight: 600; }

/* Kabuk */
.shell { background: var(--app); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 750; font-size: 17px; }
.logo svg { width: 22px; height: 22px; color: var(--accent); }
.tripsel { font-size: 14px; display: inline-flex; gap: 4px; align-items: center; padding-left: 14px; border-left: 1px solid var(--line); }
.topnav { display: flex; gap: 24px; margin: 0 auto; font-size: 14.5px; }
.topnav button { padding: 4px 0; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.topnav button.on { color: var(--accent-ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--accent); }
.badge { font-size: 11.5px; font-weight: 700; background: var(--lav); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; }
.cols { display: grid; grid-template-columns: 320px minmax(0, 1fr); }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .chat { border-right: 0; border-bottom: 1px solid var(--line2); } }

/* Kişiler */
.av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 800; color: var(--on-accent); flex: none; border: 2px solid var(--app); }
.av.ai { background: var(--lav); color: var(--accent-ink); }
.av.ai svg { width: 11px; height: 11px; stroke-width: 2.2; }
.av.lg { width: 34px; height: 34px; font-size: 13px; }
.avs { display: inline-flex; }
.avs .av + .av { margin-left: -6px; }
.saver { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.saver b { color: var(--ink); font-weight: 600; }

/* Sohbet */
.chat { border-right: 1px solid var(--line2); padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chat h2 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.chat h2 svg { color: var(--accent); }
.msgs { display: grid; gap: 10px; align-content: start; flex: 1; }
.msg { padding: 10px 12px; border-radius: 14px; font-size: 14px; min-width: 0; animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.me { background: var(--lav); border-top-left-radius: 5px; }
.msg.ai { background: var(--soft); border-top-left-radius: 5px; }
.msg.act { background: var(--app); border: 1px dashed var(--accent); color: var(--accent-ink); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.msg.act svg { width: 15px; height: 15px; }
.msg b { font-weight: 650; }
.who-l { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-ink); background: var(--app); }
.links { display: grid; gap: 4px; margin-top: 8px; }
.links .lk { display: flex; gap: 7px; align-items: center; font-size: 12.5px; background: var(--app); border-radius: 8px; padding: 4px 7px; min-width: 0; }
.links .lk .u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); min-width: 0; flex: 1; }
.links .lk .to { color: var(--accent-ink); font-weight: 600; white-space: nowrap; flex: none; }
.working { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); padding: 2px 4px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bob 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-3px); opacity: 1; } }
.input { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 12px; color: var(--muted); font-size: 14px; }
.input .send { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; background: var(--lav); color: var(--accent-ink); display: grid; place-items: center; }

/* Hero v9 (bugünkü, aynen) */
.main { padding: 20px 24px 28px; display: grid; gap: 20px; min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 62fr) minmax(0, 34fr); gap: 4%; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.story { display: grid; gap: 12px; align-content: start; min-width: 0; }
.photo { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 1.92 / 1; max-width: 100%; }
.photo svg { display: block; width: 100%; height: 100%; }
.citysel { position: absolute; top: 12px; left: 12px; display: flex; padding: 4px; background: rgba(255,255,255,.9); border-radius: 999px; font-size: 13.5px; color: #6b6790; }
.citysel span { padding: 4px 10px; border-radius: 999px; }
.citysel span.on { background: #fff; color: #1c1a33; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.pills { position: absolute; top: 12px; right: 12px; }
.pills span { background: #ece8ff; color: #4a35cc; font-size: 13px; padding: 5px 11px; border-radius: 999px; }
.story h3 { margin: 4px 0 0; font-family: var(--display); font-size: clamp(28px, 3vw, 40px); line-height: 1.05; letter-spacing: -0.025em; }
.dline { display: flex; gap: 8px; align-items: center; font-size: 16px; flex-wrap: wrap; }
.est { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--dash); border-radius: 999px; padding: 1px 8px; }
.tone { margin: 0; color: var(--muted); font-size: 16px; text-wrap: pretty; }
.cells { display: flex; flex-wrap: wrap; }
.cell { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 0; margin-right: 16px; border-right: 1px solid var(--line); font-size: 16px; white-space: nowrap; }
.cell:last-child { border-right: 0; }
.cell svg { width: 20px; height: 20px; }
.prog { background: var(--mint); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; }
.prog b { font-size: 16px; }
.legend { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.seg { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--mintbar) 16%, transparent); }
.seg i { display: block; height: 100%; transition: width .8s cubic-bezier(.16, 1, .3, 1); }
.prog .cta { grid-row: 1 / span 3; grid-column: 2; background: var(--ink); color: var(--app); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
@media (max-width: 560px) { .prog { grid-template-columns: minmax(0, 1fr); } .prog .cta { grid-row: auto; grid-column: auto; justify-self: start; } }
.card { background: var(--soft); border-radius: 20px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card .blk + .blk { border-top: 1px solid var(--line); padding-top: 14px; }
.people { display: flex; gap: 12px; align-items: center; }
.people small { display: block; color: var(--muted); font-size: 13.5px; }
.styles { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.style { font-size: 13.5px; padding: 5px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; background: var(--app); }
.style svg { width: 15px; height: 15px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14.5px; }
.kv .h { font-weight: 700; font-size: 17px; }
.kv .m { color: var(--muted); }
.kv .r { text-align: right; }
.country { display: flex; gap: 8px; align-items: center; font-size: 14.5px; }
.flag { width: 24px; height: 16px; border-radius: 3px; background: radial-gradient(circle at 50% 50%, #bc002d 30%, #fff 31%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); display: inline-block; }
.wx { display: flex; gap: 16px; font-size: 14px; margin-top: 8px; flex-wrap: wrap; }
.wx span { display: inline-flex; gap: 6px; align-items: center; }
.wx svg { width: 16px; height: 16px; color: var(--c-move); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.ptabs { display: flex; justify-content: center; gap: 28px; font-size: 15px; color: var(--muted); }
.ptabs span.on { color: var(--ink); font-weight: 650; box-shadow: inset 0 -3px 0 var(--accent); padding-bottom: 8px; }

/* Gezinin şekli */
.journey { display: grid; align-items: start; padding: 6px 4px 0; }
.jstop { position: relative; display: grid; justify-items: center; gap: 3px; text-align: center; outline: none; }
.jnode { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--tile); border: 2px dashed var(--dash); transition: transform .35s cubic-bezier(.16, 1, .3, 1); }
.jnode img { width: 32px; height: 26px; object-fit: contain; }
.jstop.j-plan .jnode { border: 2px solid var(--plan-dot); }
.jstop.j-rez .jnode { border: 2px solid var(--book-ink); }
.jstop:hover .jnode, .jstop:focus-visible .jnode { transform: translateY(-3px) scale(1.06); }
.jstop b { font-size: 13px; white-space: nowrap; }
.jstop small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.jtip { position: absolute; top: calc(100% + 8px); left: 50%; width: 210px; transform: translate(-50%, -6px) scale(.96); opacity: 0; pointer-events: none; z-index: 5; background: var(--app); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 10px 12px; text-align: left; font-size: 13px; display: grid; gap: 5px; transition: opacity .2s, transform .3s cubic-bezier(.16, 1, .3, 1); }
.jstop:first-child .jtip { left: 0; transform: translate(0, -6px); }
.jstop:last-child .jtip { left: auto; right: 0; transform: translate(0, -6px); }
.jstop:hover .jtip, .jstop:focus-visible .jtip { opacity: 1; transform: translate(-50%, 0) scale(1); }
.jstop:first-child:hover .jtip, .jstop:first-child:focus-visible .jtip, .jstop:last-child:hover .jtip, .jstop:last-child:focus-visible .jtip { transform: none; }
.jtip .r { display: flex; gap: 6px; align-items: flex-start; }
.jtip .r svg { width: 14px; height: 14px; color: var(--muted); margin-top: 2px; }
.jhop { position: relative; height: 46px; display: grid; place-items: center; color: var(--muted); font-size: 11.5px; overflow: hidden; }
.jhop::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px dotted var(--dash); }
.jhop .lbl { position: absolute; top: calc(50% + 8px); background: var(--app); padding: 0 4px; white-space: nowrap; }
.jhop .mover { position: absolute; top: calc(50% - 9px); left: 0; width: 18px; height: 18px; background: var(--app); animation: travel 6s cubic-bezier(.45, 0, .55, 1) infinite; }
.jhop .mover.fly { color: var(--c-fly); } .jhop .mover.rail { color: var(--c-move); animation-duration: 5s; }
@keyframes travel { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: calc(100% - 18px); opacity: 0; } }
@media (max-width: 620px) { .jstop small, .jhop .lbl { display: none; } .jnode { width: 36px; height: 36px; } .jstop b { font-size: 11.5px; } }

/* Plan başlığı */
.planbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.planbar strong { font-size: 20px; font-family: var(--display); letter-spacing: -0.01em; }
.sortsw { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; font-size: 13px; }
.sortsw span { padding: 4px 10px; border-radius: 8px; color: var(--muted); }
.sortsw span.on { background: var(--app); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.key { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 26px; height: 16px; border-radius: 5px; display: inline-block; }
.sw.bos { background: var(--app); border: 1.5px dashed var(--dash); }
.sw.plan { background: var(--plan-bg); border: 1px solid var(--plan-line); }
.sw.rez { background: var(--book-bg); border: 1px solid var(--book-line); }

/* Durum çemberi */
.sd { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.sd.bos { border: 1.5px dashed var(--dash); background: var(--app); }
.sd.plan { border: 2px solid var(--plan-dot); background: var(--app); }
.sd.rez { background: var(--book-ink); color: var(--app); }
.sd.rez svg { width: 11px; height: 11px; stroke-width: 3; }

/* Bölümler: belirgin, açılır kapanır, sayı ve bütçe başlıkta */
.secs { display: grid; gap: 12px; }
.sec { border: 1px solid var(--line2); border-radius: 20px; overflow: hidden; background: var(--app); }
.sec-h { width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 2px 14px; align-items: center; padding: 14px 18px; cursor: pointer; transition: background .2s; }
.sec-h:hover { background: var(--soft); }
.sec.closed .sec-h { background: var(--soft); }
.sec-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; grid-row: span 2; }
.sec-ic svg { width: 20px; height: 20px; }
.sec-h h4 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; display: flex; gap: 8px; align-items: baseline; }
.sec-h h4 .n { font-size: 14px; font-weight: 600; color: var(--muted); }
.sec-h .st { grid-column: 2; font-size: 13px; color: var(--muted); }
.sec-h .bud { grid-row: 1 / span 2; grid-column: 4; text-align: right; font-size: 13px; color: var(--muted); }
.sec-h .bud b { display: block; font-size: 15px; color: var(--ink); }
.sec-h .mini { grid-row: 1 / span 2; grid-column: 3; width: 110px; height: 6px; border-radius: 99px; background: var(--line2); display: flex; overflow: hidden; }
.sec-h .mini i { display: block; height: 100%; transition: width .8s cubic-bezier(.16, 1, .3, 1); }
.sec-h .chev { grid-row: 1 / span 2; grid-column: 5; color: var(--muted); transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.sec.closed .sec-h .chev { transform: rotate(-90deg); }
@media (max-width: 640px) { .sec-h { grid-template-columns: auto minmax(0, 1fr) auto; } .sec-h .mini { display: none; } .sec-h .bud { grid-column: 3; } .sec-h .chev { display: none; } }
.sec-b { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s cubic-bezier(.16, 1, .3, 1); }
.sec.closed .sec-b { grid-template-rows: 0fr; }
.sec-b > div { overflow: hidden; }
.sec-in { padding: 4px 18px 18px; display: grid; gap: 14px; }
.note { margin: 0; font-size: 13.5px; color: var(--accent-ink); display: flex; gap: 6px; align-items: flex-start; }
.note svg { width: 14px; height: 14px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; align-items: start; }

/* Kutucuk */
.slot { position: relative; text-align: left; width: 100%; border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; cursor: pointer; transition: background .5s, border-color .5s, box-shadow .25s, transform .25s cubic-bezier(.16, 1, .3, 1); }
.slot:hover { box-shadow: var(--shadow-sm); }
.m-bos { background: var(--app); border: 1.5px dashed var(--dash); }
.m-plan { background: var(--plan-bg); border: 1px solid var(--plan-line); }
.m-rez { background: var(--book-bg); border: 1px solid var(--book-line); }
.top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.top .ty { display: inline-flex; gap: 5px; align-items: center; font-weight: 650; color: var(--ink); white-space: nowrap; }
.top .ty .ic { display: inline-flex; }
.top .ty svg { width: 15px; height: 15px; }
.top .sp { flex: 1; }
.top .lab { font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.m-bos .top .lab { color: var(--muted); font-weight: 500; }
.m-plan .top .lab { color: var(--plan-ink); }
.m-rez .top .lab { color: var(--book-ink); }
.row { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; align-items: center; }
.art { width: 60px; height: 50px; border-radius: 12px; background: var(--tile); object-fit: contain; padding: 4px; }
.what { font-size: 18px; font-weight: 750; letter-spacing: -0.015em; line-height: 1.2; }
.sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sub svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }
.moons { display: inline-flex; gap: 3px; vertical-align: 1px; margin-right: 6px; }
.moons i { width: 7px; height: 7px; border-radius: 50%; background: var(--c-stay); opacity: .35; }
.m-plan .moons i { background: var(--plan-dot); opacity: 1; }
.m-rez .moons i { background: var(--book-ink); opacity: 1; }
.wants { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.wants li { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--soft); }
.why { margin: 0; font-size: 13px; color: var(--accent-ink); display: flex; gap: 6px; align-items: flex-start; }
.why svg { width: 14px; height: 14px; margin-top: 2px; }
.self { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.self .k { font-weight: 650; margin-right: 2px; }
.blink { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border-radius: 9px; color: var(--ink); text-decoration: none; background: var(--app); border: 1px solid var(--line); font-size: 13px; transition: border-color .2s, transform .2s; }
.blink:hover { border-color: var(--accent); transform: translateY(-1px); }
.blink svg { width: 12px; height: 12px; color: var(--muted); }
.foot { display: flex; align-items: center; gap: 8px; min-height: 34px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--dash) 40%, transparent); font-size: 13px; }
.foot .sp { flex: 1; }
.dd { display: inline-flex; gap: 6px; align-items: center; color: var(--accent-ink); font-weight: 650; padding: 4px 8px 4px 4px; border-radius: 8px; }
.dd:hover { background: var(--lav); }
.dd svg.chev { width: 15px; height: 15px; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.dd[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
.searching { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); }
.searching .bar { width: 44px; height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--line2) 25%, var(--lav) 50%, var(--line2) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.price { font-size: 16px; font-weight: 750; }
.price small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.proof { display: inline-flex; gap: 5px; align-items: center; font-weight: 650; color: var(--book-ink); min-width: 0; }
.proof svg { width: 14px; height: 14px; }
.more { color: var(--muted); display: inline-flex; gap: 3px; align-items: center; font-size: 12.5px; white-space: nowrap; }
.more svg { width: 14px; height: 14px; }
.ask { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-ink); background: var(--lav); transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
.ask:hover { transform: rotate(-12deg) scale(1.08); }
.ask svg { width: 15px; height: 15px; }
.go { display: inline-flex; gap: 6px; align-items: center; background: var(--ink); color: var(--app); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap; text-decoration: none; }
.bm { width: 18px; height: 18px; border-radius: 5px; color: var(--on-brand); font-size: 10px; font-weight: 800; display: inline-grid; place-items: center; flex: none; }
.stamp { position: absolute; right: 16px; top: 44px; width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--book-ink); color: var(--book-ink); display: grid; place-items: center; transform: rotate(-12deg); opacity: .4; pointer-events: none; }
.stamp svg { width: 16px; height: 16px; stroke-width: 2.4; }
.m-rez .row { padding-right: 50px; }

/* Kartın içinde açılan seçenekler */
.drop { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.16, 1, .3, 1); margin-top: -4px; }
.drop.open { grid-template-rows: 1fr; }
.drop > div { overflow: hidden; }
.drop .in { display: grid; gap: 6px; padding-top: 6px; }
.mo { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 1px 10px; align-items: center; padding: 7px 8px; border-radius: 12px; background: var(--soft); }
.mo.cur { background: var(--plan-bg); outline: 1px solid var(--plan-line); }
.mo .th { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--app); grid-row: span 2; position: relative; }
.mo .th .av { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; font-size: 9.5px; }
.mo .nm { font-size: 13.5px; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mo .sb { font-size: 12px; color: var(--muted); grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mo .pr { grid-row: span 2; font-weight: 700; font-size: 14px; text-align: right; }
.mo .pr small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.mo .pk { grid-row: span 2; }
.pick { display: inline-flex; gap: 5px; align-items: center; background: var(--ink); color: var(--app); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.pick svg { width: 13px; height: 13px; }
.all { justify-self: start; font-size: 13px; color: var(--accent-ink); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; padding: 2px 4px; }
.all svg { width: 14px; height: 14px; }

/* Biniş kartı */
.tkw { container-type: inline-size; min-width: 0; }
.tk { padding: 0; grid-template-columns: minmax(0, 1fr) 150px; gap: 0; display: grid; }
.tk-main { padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.route { display: grid; grid-template-columns: auto minmax(50px, 1fr) auto; align-items: center; gap: 8px; }
.route .c b { display: block; font-size: 21px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
.route .c small { font-size: 12.5px; color: var(--muted); }
.route .c .t { font-size: 14px; font-weight: 700; }
.route .c.r { text-align: right; }
.route .sil { width: 100%; height: 44px; color: var(--c-fly); }
.m-bos .route .sil { opacity: .45; }
.tk-stub { position: relative; border-left: 1.5px dashed var(--dash); padding: 14px; display: grid; gap: 3px; align-content: center; min-width: 0; font-size: 13px; }
.tk-stub::before, .tk-stub::after { content: ""; position: absolute; left: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--app); }
.tk-stub::before { top: -10px; } .tk-stub::after { bottom: -10px; }
.stub-k { font-size: 12px; color: var(--muted); }
.stub-v { font-size: 15px; font-weight: 750; }
.tk .stamp { right: 12px; top: auto; bottom: 10px; width: 36px; height: 36px; }
@container (max-width: 480px) { .tk { grid-template-columns: minmax(0, 1fr); } .tk-stub { border-left: 0; border-top: 1.5px dashed var(--dash); } .tk-stub::before, .tk-stub::after { display: none; } }

/* Deneyimler: planda olanlar satır, fikirler kare */
.planned { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 1px 12px; align-items: center; padding: 8px 10px 8px 8px; border-radius: 14px; animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
.prow img { width: 48px; height: 48px; border-radius: 10px; background: var(--tile); object-fit: contain; padding: 2px; grid-row: span 2; }
.prow .t { font-size: 14.5px; font-weight: 650; }
.prow .m { grid-column: 2; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.prow .r { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.back { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.back:hover { color: var(--accent-ink); }
.back svg { width: 14px; height: 14px; }
.ideas-h { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
.ideas-h b { color: var(--ink); }
.ideas-h .sp { flex: 1; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--app); border-color: var(--ink); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 12px; }
.tile { position: relative; display: grid; gap: 4px; padding: 8px 8px 10px; border-radius: 16px; align-content: start; background: var(--app); border: 1px solid var(--line); transition: transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .25s; animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.tile .pic { height: 92px; border-radius: 11px; background: var(--tile); display: grid; place-items: center; overflow: hidden; position: relative; }
.tile .pic img { height: 80px; object-fit: contain; }
.tile .kind { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700; color: #1c1a33; background: rgba(255,255,255,.92); border-radius: 6px; padding: 1px 6px; display: inline-flex; gap: 4px; align-items: center; }
.tile .kind svg { width: 11px; height: 11px; }
.tile .t { font-size: 13.5px; font-weight: 650; line-height: 1.3; margin-top: 2px; }
.tile .m { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.tile .who { position: absolute; top: 14px; left: 14px; }
.tile .x { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--app); color: var(--muted); display: grid; place-items: center; opacity: 0; transition: opacity .18s; box-shadow: var(--shadow-sm); }
.tile .x svg { width: 12px; height: 12px; }
.tile:hover .x, .tile:focus-within .x { opacity: 1; }
@media (hover: none) { .tile .x { opacity: 1; } }
.tile .add { justify-self: start; margin-top: 4px; display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 600; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); border-radius: 999px; padding: 4px 11px; }
.tile .add svg { width: 13px; height: 13px; }
.morebtn { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--lav); border-radius: 999px; padding: 5px 12px; }
.morebtn svg { width: 14px; height: 14px; }

/* Belgeler satırları */
.drow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: 14px; }
.drow img { width: 40px; height: 40px; object-fit: contain; grid-row: span 2; }
.drow b { font-size: 15px; }
.drow .ts { grid-column: 2; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.drow .tr { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 8px; align-items: center; }
.info-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--book-bg); color: var(--book-ink); font-size: 14px; font-weight: 600; }
.info-row svg { width: 16px; height: 16px; }
.info-row span { color: var(--ink); font-weight: 400; }

/* Hazırlık: işaretlenen “Hazır”a taşınır */
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.ck { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 14px; cursor: pointer; animation: rise .4s cubic-bezier(.16, 1, .3, 1); }
.ck .box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--dash); background: var(--app); display: grid; place-items: center; flex: none; color: transparent; transition: background .25s, border-color .25s; }
.ck .box svg { width: 13px; height: 13px; stroke-width: 3; }
.ck .ct { flex: 1; min-width: 0; display: grid; }
.ck small { font-size: 12px; color: var(--muted); }
.ck .buy { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; color: var(--accent-ink); white-space: nowrap; }
.ck .buy .bm { width: 15px; height: 15px; font-size: 9px; }
.ready-h { font-size: 13px; font-weight: 650; color: var(--book-ink); display: flex; gap: 6px; align-items: center; }
.ready-h svg { width: 15px; height: 15px; }
.ck.ok { background: var(--app); border: 1px solid var(--book-line); }
.ck.ok .box { background: var(--book-ink); border-color: var(--book-ink); color: var(--app); }
.ck.ok .tag { font-size: 11.5px; font-weight: 700; color: var(--book-ink); background: var(--book-bg); border-radius: 999px; padding: 1px 8px; }

/* Seçim penceresi */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: grid; place-items: center; padding: 24px 16px; opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.picker { width: min(640px, 100%); max-height: min(88vh, 860px); overflow: auto; background: var(--app); border-radius: 22px; box-shadow: var(--shadow-lg); transform: translateY(16px) scale(.98); transition: transform .4s cubic-bezier(.16, 1, .3, 1); }
.scrim.on .picker { transform: none; }
.pk-h { position: sticky; top: 0; background: var(--app); z-index: 2; padding: 18px 20px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; border-bottom: 1px solid var(--line2); }
.pk-h .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; grid-row: span 2; }
.pk-h .ic svg { width: 20px; height: 20px; }
.pk-h h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
.pk-h p { margin: 0; font-size: 13.5px; color: var(--muted); grid-column: 2; }
.pk-h .close { grid-row: 1 / span 2; grid-column: 3; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.pk-b { padding: 16px 20px 18px; display: grid; gap: 14px; }
.foryou { padding: 12px 14px; border-radius: 14px; background: var(--lav); font-size: 14px; display: grid; gap: 2px; }
.foryou b { font-weight: 700; }
.pk-sec { display: grid; gap: 8px; }
.pk-sec h6 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.pk-sec h6 svg { width: 14px; height: 14px; }
.opt { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); transition: border-color .2s, background .2s; animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
.opt:hover { border-color: var(--accent); }
.opt.cur { background: var(--plan-bg); border-color: var(--plan-line); }
.opt.cur.rez { background: var(--book-bg); border-color: var(--book-line); }
.score { width: 44px; height: 44px; border-radius: 50%; grid-row: span 3; display: grid; place-items: center; align-content: center; font-weight: 800; font-size: 16px; line-height: 1; background: var(--soft); }
.score small { font-size: 9px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.score.hi { background: var(--lav); color: var(--accent-ink); }
.opt .on { font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rozet { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--lav); color: var(--accent-ink); }
.opt .os { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.opt .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.reacts { display: inline-flex; gap: 5px; align-items: center; }
.reacts svg { width: 14px; height: 14px; }
.opt .pr { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-weight: 750; font-size: 16px; }
.opt .pr small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.opt .act { grid-column: 3; grid-row: 3; justify-self: end; }
.ghost { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--app); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.ghost svg { width: 13px; height: 13px; }
.chosen-ok { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 650; color: var(--book-ink); }
.chosen-ok svg { width: 14px; height: 14px; }
.booked { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 0; }
.booked div { padding: 10px 12px; border-radius: 12px; background: var(--book-bg); display: grid; gap: 1px; }
.booked dt { font-size: 12px; color: var(--muted); }
.booked dd { margin: 0; font-weight: 700; font-size: 15px; }
.pk-f { position: sticky; bottom: 0; background: var(--app); border-top: 1px solid var(--line2); padding: 12px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pk-f .sp { flex: 1; }
.empty { font-size: 13.5px; color: var(--muted); padding: 10px 12px; border-radius: 12px; background: var(--soft); }

/* Hareket */
.arrive .art { animation: drop .7s cubic-bezier(.16, 1, .3, 1); }
@keyframes drop { 0% { transform: translateY(-14px) scale(.85); opacity: 0; } 100% { transform: none; opacity: 1; } }
.arrive .sil { animation: takeoff 1.1s cubic-bezier(.16, 1, .3, 1); }
@keyframes takeoff { 0% { transform: translate(-40%, 8px) rotate(-6deg); opacity: 0; } 60% { transform: translate(6%, -4px) rotate(-3deg); opacity: 1; } 100% { transform: none; } }
.arrive .lab { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); display: inline-block; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.arrive { animation: glow 1.6s cubic-bezier(.16, 1, .3, 1); }
@keyframes glow { 0% { box-shadow: 0 0 0 0 var(--glow); } 35% { box-shadow: 0 0 0 6px var(--glow); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* Pano */
.pano { padding: 22px 26px 28px; display: grid; gap: 16px; }
.pano-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pano-h h3 { margin: 0; font-family: var(--display); font-size: 34px; letter-spacing: -0.025em; }
.pano-h .cnt { color: var(--muted); font-size: 15px; }
.pano-h .sp { flex: 1; }
.pbtn { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 14px; }
.pbtn.primary { background: var(--lav); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-ink); font-weight: 600; }
.pbtn svg { width: 16px; height: 16px; }
.view { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 3px; }
.view button { padding: 6px 12px; border-radius: 9px; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.view button svg { width: 15px; height: 15px; }
.view button[aria-pressed="true"] { background: var(--app); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
.cats { display: flex; gap: 6px 20px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; align-items: center; }
.cats button { display: inline-flex; gap: 8px; align-items: center; padding: 8px 2px 10px; font-size: 14.5px; }
.cats button span { color: var(--muted); }
.cats button.on { color: var(--accent-ink); box-shadow: inset 0 -2px 0 var(--accent); }
.cats svg { width: 19px; height: 19px; }
.cats .fav svg { color: #e11d5b; }
.cats .fav.on svg { fill: #e11d5b; }
.group { display: grid; gap: 12px; }
.group + .group { padding-top: 14px; border-top: 1px solid var(--line2); }
.group-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.group-h b { font-size: 16px; }
.group-h .s { font-size: 13px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.group-h .sp { flex: 1; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; align-items: start; }
.pc { position: relative; background: var(--app); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); display: grid; transition: transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .25s, border-color .4s; }
.pc:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.pc.inplan { border-color: var(--plan-dot); }
.pc.isrez { border-color: var(--book-ink); }
.pc .img { height: 112px; position: relative; display: grid; place-items: center; overflow: hidden; }
.pc .img img { height: 88px; object-fit: contain; }
.pc .rz { position: absolute; top: 10px; left: 10px; }
.pc .heart { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; color: #1c1a33; transition: transform .25s cubic-bezier(.2, 1.6, .4, 1); }
.pc .heart:active { transform: scale(.85); }
.pc .heart svg { width: 16px; height: 16px; }
.pc .heart.on svg { fill: #e11d5b; stroke: #e11d5b; }
.pc .sc { position: absolute; right: 10px; bottom: -20px; width: 44px; height: 44px; border-radius: 50%; background: var(--app); box-shadow: var(--shadow-sm); display: grid; place-items: center; align-content: center; font-weight: 800; font-size: 15px; line-height: 1; z-index: 1; }
.pc .sc small { font-size: 9px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.pc .bd { padding: 14px 14px 8px; display: grid; gap: 4px; align-content: start; }
.pc .need { font-size: 12px; font-weight: 650; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.pc .need svg { width: 13px; height: 13px; }
.pc .row1 { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pc h5 { margin: 0; font-size: 16px; font-weight: 750; line-height: 1.25; padding-right: 40px; }
.pc .meta { font-size: 13px; color: var(--muted); }
.pc .row3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.pc .pr { font-size: 16.5px; font-weight: 750; }
.pc .pr small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.addp { display: inline-flex; gap: 6px; align-items: center; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); border-radius: 10px; padding: 5px 11px; font-size: 13.5px; font-weight: 600; }
.addp svg { width: 14px; height: 14px; }
.addp.on { background: var(--plan-bg); border-color: var(--plan-line); color: var(--plan-ink); }
.addp.rez { background: var(--book-bg); border-color: var(--book-line); color: var(--book-ink); }
.dest { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.dest svg { width: 12px; height: 12px; }
.why2 { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 14px; border-top: 1px solid var(--line2); font-size: 13px; color: var(--accent-ink); font-weight: 600; }
.why2 svg { width: 15px; height: 15px; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.why2[aria-expanded="true"] svg { transform: rotate(180deg); }
.detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.16, 1, .3, 1); }
.detail.open { grid-template-rows: 1fr; }
.detail > div { overflow: hidden; }
.detail .in { padding: 4px 14px 12px; display: grid; gap: 8px; font-size: 13px; }
.pm-l { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
.pm-l li { display: flex; gap: 6px; align-items: flex-start; }
.pm-l .p { color: var(--plus); } .pm-l .m { color: var(--minus); }
.pm-l li::before { font-weight: 800; width: 10px; flex: none; }
.pm-l .p::before { content: "+"; } .pm-l .m::before { content: "−"; }
.only { font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 0 5px; background: var(--lav); color: var(--accent-ink); white-space: nowrap; }
.crit { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; color: var(--muted); }
.crit b { color: var(--ink); font-weight: 600; }
.crit .y { color: var(--plus); font-weight: 650; } .crit .n { color: var(--minus); font-weight: 650; } .crit .q { color: var(--muted); }
.crit-h { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.ele { justify-self: start; font-size: 12.5px; color: var(--muted); }
.ele:hover { color: var(--minus); }
.pc .ft { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 10px; border-top: 1px solid var(--line2); font-size: 12.5px; color: var(--muted); gap: 8px; }
.pc .ft span { display: inline-flex; gap: 6px; align-items: center; }
.pc .ft svg { width: 15px; height: 15px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
table.cmp { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
.cmp th, .cmp td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line2); vertical-align: top; }
.cmp thead th { background: var(--soft); font-size: 14px; }
.cmp thead th .tn { display: flex; gap: 8px; align-items: center; }
.cmp thead th small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.cmp tbody th { color: var(--muted); font-weight: 500; white-space: nowrap; width: 140px; }
.cmp tr.part th { font-size: 11.5px; font-weight: 700; color: var(--accent-ink); background: color-mix(in srgb, var(--lav) 50%, var(--app)); padding: 6px 12px; }
.cmp td.best { background: var(--best); color: var(--book-ink); font-weight: 700; }
.cmp .y { color: var(--plus); font-weight: 650; } .cmp .n { color: var(--minus); font-weight: 650; } .cmp .q { color: var(--muted); }
.cmp tr:last-child td, .cmp tr:last-child th { border-bottom: 0; }

/* Bildirim */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--app); padding: 10px 16px; border-radius: 14px; font-size: 14px; display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.16, 1, .3, 1); z-index: 80; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { color: var(--lav); font-weight: 650; white-space: nowrap; }

.pfoot { font-size: 12.5px; color: var(--muted); text-align: center; }
.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  if ((b = q("[data-prep]")) && !q("a")) { const k = b.dataset.prep; s.prep[k] = s.prep[k] ? 0 : 1; rerender(); return; }
  if (q("[data-esim]")) { s.esim = 1; rerender(); toast("eSIM plana eklendi."); return; }
  if ((b = q("article[data-slot]")) && !q("a,button,input,label")) { openPicker(b.dataset.slot); return; }
