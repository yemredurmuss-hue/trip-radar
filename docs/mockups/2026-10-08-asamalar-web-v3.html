<title>Bali Planı Aşamaları</title>
<style>
/* Layout: üstte senaryo seçici; altında eklentinin web panosu. Solda yan panel (Asistan | Pano), sağda hero v9 + gezinin şekli + kategori bölümleri. Niyet kartı bir kutucuk: öneri ya da Pano'dan sürüklenen kayıt içine yerleşir. Pano sekmesi Emre'nin onaylı pano görselini izler. */
:root {
  --bg: #eeecf5; --app: #ffffff; --soft: #f7f5f1; --tile: #fbfaf7;
  --ink: #1c1a33; --muted: #6b6790; --line: #e7e4dd; --line2: #efece7; --dash: #b9b5cf;
  --accent: #5b45e0; --accent-ink: #4a35cc; --lav: #ece8ff; --on-accent: #ffffff;
  --mint: #eaf7f2; --mintbar: #2cc79a; --planbar: #f0a53a;
  --plan-bg: #fbf6ea; --plan-line: #e9d29a; --plan-ink: #8a5a00; --plan-dot: #e09422;
  --book-bg: #eef8f1; --book-line: #b9e0c7; --book-ink: #1b7f45;
  --c-fly: #6a4fe0; --c-stay: #23998b; --c-move: #c58a2e; --c-exp: #e0571f; --c-food: #c42a5a; --c-insp: #5b45e0; --c-ins: #0f8a6a;
  --b-booking: #003b95; --b-airbnb: #c8174f; --b-google: #1765cc; --b-sky: #0062e3; --b-kayak: #c74300; --b-viator: #186b6d; --b-airalo: #b82a30; --b-trip: #00744e; --b-maps: #1e8e3e; --b-yt: #c00000; --b-qatar: #5c0632; --b-klook: #a83a00; --b-web: #475467; --b-tk: #c8102e;
  --on-brand: #ffffff;
  --av-e: #5b45e0; --av-s: #23998b;
  --glow: rgba(91, 69, 224, .4);
  --shadow: 0 1px 2px rgba(28, 26, 51, .05), 0 16px 40px -22px rgba(28, 26, 51, .28);
  --shadow-sm: 0 1px 2px rgba(28, 26, 51, .06), 0 6px 18px -10px rgba(28, 26, 51, .25);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0c14; --app: #17161f; --soft: #201e2c; --tile: #efede8;
  --ink: #eeecfb; --muted: #aaa6c9; --line: #2f2d40; --line2: #292737; --dash: #4d4a66;
  --accent: #9a8bff; --accent-ink: #b5aaff; --lav: #2a2550; --on-accent: #16132e;
  --mint: #142d27; --mintbar: #2cc79a; --planbar: #f0a53a;
  --plan-bg: #2a2416; --plan-line: #5c4a1f; --plan-ink: #f0bf63; --plan-dot: #f0a53a;
  --book-bg: #142a1e; --book-line: #26583a; --book-ink: #5fd393;
  --c-fly: #9d8bff; --c-stay: #3fc4b4; --c-move: #e2ab52; --c-exp: #f08a5a; --c-food: #ec6a92; --c-insp: #9a8bff; --c-ins: #3fc79f;
  --av-e: #9a8bff; --av-s: #3fc4b4;
  --glow: rgba(154, 139, 255, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 44px -22px rgba(0, 0, 0, .8);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d0c14; --app: #17161f; --soft: #201e2c; --tile: #efede8;
  --ink: #eeecfb; --muted: #aaa6c9; --line: #2f2d40; --line2: #292737; --dash: #4d4a66;
  --accent: #9a8bff; --accent-ink: #b5aaff; --lav: #2a2550; --on-accent: #16132e;
  --mint: #142d27; --mintbar: #2cc79a; --planbar: #f0a53a;
  --plan-bg: #2a2416; --plan-line: #5c4a1f; --plan-ink: #f0bf63; --plan-dot: #f0a53a;
  --book-bg: #142a1e; --book-line: #26583a; --book-ink: #5fd393;
  --c-fly: #9d8bff; --c-stay: #3fc4b4; --c-move: #e2ab52; --c-exp: #f08a5a; --c-food: #ec6a92; --c-insp: #9a8bff; --c-ins: #3fc79f;
  --av-e: #9a8bff; --av-s: #3fc4b4;
  --glow: rgba(154, 139, 255, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 44px -22px rgba(0, 0, 0, .8);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
::selection { background: var(--lav); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.page { padding-block: 20px 48px; padding-inline: clamp(16px, 2.4vw, 32px); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 1560px; margin: 0 auto; }
.page > * { min-width: 0; }

/* Senaryo seçici */
.switch { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: grid; gap: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-radius: 16px; }
.switch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.switch h1 { margin: 0 8px 0 4px; font-family: var(--display); font-size: 17px; letter-spacing: -0.01em; }
.tabs-sc { display: flex; gap: 4px; flex-wrap: wrap; background: var(--app); padding: 4px; border-radius: 12px; box-shadow: var(--shadow); }
.tabs-sc button { padding: 6px 12px; border-radius: 9px; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tabs-sc button b { font-weight: 700; color: var(--accent-ink); }
.tabs-sc button[aria-selected="true"] { background: var(--ink); color: var(--app); }
.tabs-sc button[aria-selected="true"] b { color: var(--app); }
.tabs-sc .sep { width: 1px; background: var(--line); margin: 4px 2px; }
.motion { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 9px; }
.motion:hover { background: var(--app); }
.sc-desc { margin: 0 4px; font-size: 14px; color: var(--muted); }
.sc-desc b { color: var(--ink); font-weight: 600; }

/* Kabuk */
.shell { background: var(--app); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 750; font-size: 17px; }
.logo svg { width: 22px; height: 22px; }
.tripsel { color: var(--ink); font-size: 14px; display: inline-flex; gap: 4px; align-items: center; padding-left: 14px; border-left: 1px solid var(--line); }
.topnav { display: flex; gap: 24px; margin: 0 auto; font-size: 14.5px; color: var(--ink); }
.topnav button { padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.topnav button.on { color: var(--accent-ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--accent); }
.badge { font-size: 11.5px; font-weight: 700; background: var(--lav); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; }
.people-s { display: inline-flex; }
.cols { display: grid; grid-template-columns: 340px minmax(0, 1fr); }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .side { border-right: 0; border-bottom: 1px solid var(--line2); } }

/* Yüzler */
.av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 800; color: var(--on-accent); flex: none; border: 2px solid var(--app); }
.av.e { background: var(--av-e); } .av.s { background: var(--av-s); }
.av.ai { background: var(--lav); color: var(--accent-ink); }
.av.ai svg { width: 11px; height: 11px; stroke-width: 2.2; }
.av.lg { width: 30px; height: 30px; font-size: 13px; }
.avs { display: inline-flex; }
.avs .av + .av { margin-left: -6px; }

/* Yan panel: Asistan | Pano */
.side { border-right: 1px solid var(--line2); display: flex; flex-direction: column; min-width: 0; }
.side-tabs { display: flex; gap: 4px; padding: 12px 14px 0; }
.side-tabs button { flex: 1; padding: 8px 10px; border-radius: 10px 10px 0 0; font-size: 14px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; justify-content: center; border-bottom: 2px solid transparent; }
.side-tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.side-tabs svg { width: 16px; height: 16px; }
.side-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.msgs { display: grid; gap: 10px; align-content: start; flex: 1; }
.msg { padding: 10px 12px; border-radius: 14px; font-size: 14px; min-width: 0; }
.msg.me { background: var(--lav); border-top-left-radius: 5px; }
.msg.ai { background: var(--soft); border-top-left-radius: 5px; }
.msg b { font-weight: 650; }
.who-l { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-ink); background: var(--app); }
.links { display: grid; gap: 4px; margin-top: 8px; }
.links .lk { display: flex; gap: 7px; align-items: center; font-size: 12.5px; background: var(--app); border-radius: 8px; padding: 4px 7px; min-width: 0; }
.links .lk span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.links .head { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.input { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 12px; color: var(--muted); font-size: 14px; }
.input .send { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; background: var(--lav); color: var(--accent-ink); display: grid; place-items: center; }

/* Yan paneldeki Pano: sürüklenebilir kayıtlar */
.pp-head { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.pp-head svg { width: 15px; height: 15px; color: var(--accent); }
.pp-group { display: grid; gap: 6px; }
.pp-group h6 { margin: 6px 0 0; font-size: 12.5px; font-weight: 650; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.pp-group h6 svg { width: 14px; height: 14px; }
.pi { display: grid; grid-template-columns: 14px 44px minmax(0, 1fr) auto; gap: 1px 9px; align-items: center; padding: 6px 8px 6px 4px; border-radius: 12px; background: var(--app); border: 1px solid var(--line); cursor: grab; transition: transform .2s cubic-bezier(.16, 1, .3, 1), box-shadow .2s, opacity .3s; }
.pi:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.pi:active { cursor: grabbing; }
.pi.dragging { opacity: .4; }
.pi .grip { grid-row: span 2; color: var(--dash); width: 14px; height: 14px; }
.pi .th { width: 44px; height: 44px; border-radius: 9px; grid-row: span 2; position: relative; background-size: cover; }
.pi .th .av { position: absolute; left: -5px; bottom: -5px; }
.pi .t { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi .m { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; min-width: 0; }
.pi .m span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi .go { grid-row: span 2; grid-column: 4; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--accent-ink); background: var(--lav); }
.pi .go svg { width: 15px; height: 15px; }
.pi.inplan { cursor: default; background: var(--plan-bg); border-color: var(--plan-line); }
.pi.inplan .go { background: transparent; color: var(--plan-ink); }
.pi.inplan .grip { visibility: hidden; }
.pi.stray { border-style: dashed; }

/* Hero v9, aynen */
.main { padding: 20px 24px 28px; display: grid; gap: 18px; min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 62fr) minmax(0, 34fr); gap: 4%; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.story { display: grid; gap: 12px; align-content: start; min-width: 0; }
.photo { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 1.92 / 1; max-width: 100%; }
.photo svg { display: block; width: 100%; height: 100%; }
.citysel { position: absolute; top: 12px; left: 12px; display: flex; padding: 4px; background: rgba(255,255,255,.9); border-radius: 999px; font-size: 14px; color: #6b6790; }
.citysel span { padding: 4px 12px; border-radius: 999px; }
.citysel span.on { background: #fff; color: #1c1a33; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.pills { position: absolute; top: 12px; right: 12px; }
.pills span { background: #ece8ff; color: #4a35cc; font-size: 13px; padding: 5px 11px; border-radius: 999px; }
.story h3 { margin: 4px 0 0; font-family: var(--display); font-size: clamp(28px, 3vw, 40px); line-height: 1.05; letter-spacing: -0.025em; }
.dline { display: flex; gap: 8px; align-items: center; font-size: 16px; }
.tone { margin: 0; color: var(--muted); font-size: 16px; text-wrap: pretty; }
.cells { display: flex; flex-wrap: wrap; }
.cell { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 0; margin-right: 16px; border-right: 1px solid var(--line); font-size: 16px; white-space: nowrap; }
.cell:last-child { border-right: 0; }
.cell svg { width: 20px; height: 20px; }
.prog { background: var(--mint); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; }
.prog b { font-size: 16px; }
.prog .legend { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.seg { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--mintbar) 16%, transparent); }
.seg i { display: block; height: 100%; transition: width .7s cubic-bezier(.16, 1, .3, 1); }
.prog .cta { grid-row: 1 / span 3; grid-column: 2; background: var(--ink); color: var(--app); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
@media (max-width: 560px) { .prog { grid-template-columns: minmax(0, 1fr); } .prog .cta { grid-row: auto; grid-column: auto; justify-self: start; } }
.card { background: var(--soft); border-radius: 20px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card .blk + .blk { border-top: 1px solid var(--line); padding-top: 14px; }
.people { display: flex; gap: 12px; align-items: center; }
.bigav { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--on-accent); border: 2px solid var(--soft); }
.bigav + .bigav { margin-left: -12px; }
.people small { display: block; color: var(--muted); font-size: 13.5px; }
.styles { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.style { font-size: 13.5px; padding: 5px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
.style svg { width: 15px; height: 15px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14.5px; }
.kv .h { font-weight: 700; font-size: 17px; }
.kv .m { color: var(--muted); }
.kv .r { text-align: right; }
.country { display: flex; gap: 8px; align-items: center; font-size: 14.5px; }
.flag { width: 24px; height: 16px; border-radius: 3px; background: linear-gradient(#d7262e 50%, #fff 50%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.wx { display: flex; gap: 16px; font-size: 14px; margin-top: 8px; flex-wrap: wrap; }
.wx span { display: inline-flex; gap: 6px; align-items: center; }
.wx svg { width: 16px; height: 16px; color: var(--c-move); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.ptabs { display: flex; justify-content: center; gap: 28px; font-size: 15px; color: var(--muted); }
.ptabs span.on { color: var(--ink); font-weight: 650; box-shadow: inset 0 -3px 0 var(--accent); padding-bottom: 8px; }

/* Gezinin şekli */
.shape { display: flex; align-items: flex-start; overflow-x: auto; padding: 4px 2px 6px; gap: 0; }
.stop { display: grid; justify-items: center; gap: 3px; min-width: 96px; text-align: center; }
.node { width: 52px; height: 52px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; position: relative; border: 2px dashed var(--dash); }
.node img { width: 40px; height: 32px; object-fit: contain; }
.node .ph { width: 48px; height: 48px; border-radius: 50%; }
.stop.n-plan .node { border: 2px solid var(--plan-dot); }
.stop.n-rez .node { border: 2px solid var(--book-ink); }
.node .mark { position: absolute; right: -4px; bottom: -2px; }
.stop b { font-size: 13.5px; }
.stop small { font-size: 12px; color: var(--muted); }
.stop .ev { font-size: 11.5px; color: var(--c-food); background: color-mix(in srgb, var(--c-food) 10%, transparent); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.hop { flex: 1; min-width: 34px; display: grid; justify-items: center; padding-top: 18px; color: var(--muted); font-size: 11.5px; gap: 2px; }
.hop::before { content: ""; width: 100%; border-top: 2px dotted var(--dash); }
.hop svg { width: 14px; height: 14px; margin-top: -10px; background: var(--app); padding: 0 2px; box-sizing: content-box; }
.island { display: grid; gap: 4px; padding: 8px 10px 6px; border-radius: 18px; background: color-mix(in srgb, var(--c-stay) 7%, transparent); flex: 3; min-width: 330px; }
.island-h { font-size: 12.5px; font-weight: 700; color: color-mix(in srgb, var(--c-stay) 70%, var(--ink)); display: flex; gap: 6px; align-items: center; justify-content: center; }
.island-row { display: flex; align-items: flex-start; }
.island .hop svg { background: color-mix(in srgb, var(--c-stay) 7%, var(--app)); }

/* Plan başlığı */
.planbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.planbar strong { font-size: 20px; font-family: var(--display); letter-spacing: -0.01em; }
.sortsw { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; font-size: 13px; }
.sortsw span { padding: 4px 10px; border-radius: 8px; color: var(--muted); }
.sortsw span.on { background: var(--app); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.key { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 26px; height: 16px; border-radius: 5px; display: inline-block; }
.sw.bos { background: var(--app); border: 1.5px dashed var(--dash); }
.sw.oneri { background: var(--app); border: 1.5px dashed var(--accent); }
.sw.plan { background: var(--plan-bg); border: 1px solid var(--plan-line); }
.sw.rez { background: var(--book-bg); border: 1px solid var(--book-line); }

/* Durum çemberi */
.sd { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.sd.bos, .sd.oneri { border: 1.5px dashed var(--dash); background: var(--app); }
.sd.oneri { border-color: var(--accent); }
.sd.plan { border: 2px solid var(--plan-dot); background: var(--app); }
.sd.rez { background: var(--book-ink); color: var(--app); }
.sd.rez svg { width: 11px; height: 11px; stroke-width: 3; }

/* Bölümler */
.plan { border: 1px solid var(--line2); border-radius: 22px; overflow: hidden; }
.sec { padding: 18px 20px 20px; display: grid; gap: 14px; transition: background .25s; }
.sec + .sec { border-top: 1px solid var(--line2); }
.sec-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sec-h h4 { margin: 0; font-size: 17px; font-weight: 650; }
.sec-h .sp { flex: 1; }
.sec-h .sum { font-size: 13px; color: var(--muted); }
.mini { width: 96px; height: 6px; border-radius: 99px; background: var(--line2); display: flex; overflow: hidden; }
.mini i { display: block; height: 100%; transition: width .7s cubic-bezier(.16, 1, .3, 1); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }

/* Kutucuk (niyet kartı) ve malzemeleri */

let ST = {}; const LIVE = SC.D.make(); /* Pano sekmesi ile D aynı durumu paylaşır */

/* Yardımcılar */
const stayOf = city => STAYS.find(s => s.city === city);
const inPlan = (s, id) => Object.values(s.slots).some(x => (x.m === "plan" || x.m === "rez") && x.ref === id) || s.planned.some(([k]) => k === id);
const needs = s => Object.values(s.slots).map(x => x.m);
const tally = arr => ({ rez: arr.filter(m => m === "rez").length, plan: arr.filter(m => m === "plan").length, rest: arr.filter(m => m !== "rez" && m !== "plan").length, n: arr.length });
const scene = `<svg viewBox="0 0 480 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

  <path d="M70 160 q-26 -4 -40 10 M70 160 q-14 -18 -36 -16 M70 160 q8 -22 30 -22 M70 160 q24 -6 38 8 M70 160 q2 -24 -6 -34" stroke="#3f5a35" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;

function hero(s) {

  return `<section class="hero"><div class="story">
      <div class="photo">${scene}<div class="citysel"><span class="on">Ubud</span><span>Seminyak</span><span>Uluwatu</span></div>${s.dated ? `<div class="pills"><span>155 gün kaldı</span></div>` : ""}</div>
      <h3>Bali Gezisi</h3><div class="dline num">${I("cal")}<span>${s.dated ? "12–27 Mart · 15 gün" : "15 gün"}</span></div>
      <p class="tone">Ubud'un ormanından Uluwatu'nun uçurumlarına, ikinize sakin ve lüks bir Bali.</p>
      <div class="cells"><span class="cell" style="color:var(--c-fly)">${I("plane")}<span style="color:var(--ink)">2 uçuş</span></span><span class="cell" style="color:var(--c-stay)">${I("bed")}<span style="color:var(--ink)">3 konaklama</span></span><span class="cell" style="color:var(--c-move)">${I("car")}<span style="color:var(--ink)">3 ulaşım</span></span><span class="cell" style="color:var(--c-exp)">${I("ticket")}<span style="color:var(--ink)">${nExp} deneyim</span></span></div>
      <div class="prog"><b>Bali planın şekilleniyor</b>
        <div class="seg"><i style="width:${t.rez / t.n * 100}%;background:var(--book-ink)"></i><i style="width:${t.plan / t.n * 100}%;background:var(--planbar)"></i></div>
        <div class="legend num"><span><i class="dot" style="background:var(--book-ink)"></i>${t.rez} rezerve</span><span><i class="dot" style="background:var(--planbar)"></i>${t.plan} seçildi</span><span><i class="dot" style="background:var(--line)"></i>${t.rest} aranıyor</span></div>

      <div class="blk"><div class="people"><span style="display:flex"><span class="bigav" style="background:var(--av-e)">E</span><span class="bigav" style="background:var(--av-s)">S</span></span><div>Emre & Sabine<small>2 kişi</small></div></div>
        <div class="styles"><span class="style" style="background:var(--lav);color:var(--accent-ink)">${I("gem")}Lüks</span><span class="style" style="background:color-mix(in srgb, var(--c-food) 10%, transparent);color:var(--c-food)">${I("heart")}Romantik</span></div></div>
      <div class="blk kv num"><span class="h">Bütçe</span><span class="h r">${s.budget ? "€6.000" : "Yüksek"}</span>${s.budget ? `<span class="m"><i class="dot" style="background:var(--book-ink)"></i>Rezerve</span><span class="r">${t.rez ? "€4.560" : "€0"}</span><span class="m"><i class="dot" style="background:var(--planbar)"></i>Seçilen</span><span class="r">${t.plan ? "€1.276" : "€0"}</span>` : `<span class="m" style="grid-column:1/-1">Kişi başı tutar sohbette netleşir</span>`}</div>
      <div class="blk kv"><span class="h" style="grid-column:1/-1">Tercihler</span><span class="m">Özel havuz</span><span class="r">Çok önemli</span><span class="m">Sakinlik</span><span class="r">Önemli</span><a href="#" onclick="return false" style="grid-column:1/-1;font-size:14px">+4 tercih ›</a></div>
      <div class="blk"><div class="country"><span class="flag"></span>Endonezya</div><div class="wx num"><span>Ubud ${I("sun")} 29°</span><span>Uluwatu ${I("sun")} 31°</span></div></div>
      <div class="blk facts"><span>Rupiah</span><span>C/F priz</span><span>+5 saat</span><span>Endonezce</span></div></aside></section>
  <div class="ptabs"><span class="on">Plan</span><span>Gün gün</span><span>Belgeler</span></div>`;

function shape(s) {
  const m = k => s.slots[k].m, cls = x => x === "plan" ? "n-plan" : x === "rez" ? "n-rez" : "";
  const stop = st => { const sl = s.slots["stay:" + st.k], ch = (sl.m === "plan" || sl.m === "rez") && H[sl.ref];
    return `<div class="stop ${cls(sl.m)}"><span class="node">${ch ? `<span class="ph" style="background:${ch.g}"></span>` : `<img src="illus/${st.img}.png" alt="">`}<span class="mark">${sd(sl.m === "oneri" ? "bos" : sl.m)}</span></span><b>${st.city}</b><small class="num">${st.n} gece</small>
      ${st.k === "ubud" && s.dated ? `<span class="ev">Legong · 14 Mart</span>` : st.k === "ulu" ? `<span class="ev">Kecak · gün batımı</span>` : ""}</div>`; };
  const hop = (icon, txt) => `<div class="hop">${I(icon)}<span>${txt}</span></div>`;
  const fl = (k, txt) => `<div class="stop ${cls(m(k))}"><span class="node"><img src="illus/ucus.png" alt=""><span class="mark">${sd(m(k) === "oneri" ? "bos" : m(k))}</span></span><b>İstanbul</b><small>${txt}</small></div>`;
  return `<div class="shape" aria-label="Gezinin şekli">${fl("flight:out", s.dated ? "11 Mart gece" : "çıkış")}${hop("plane", "~16 sa")}
    <div class="island"><div class="island-h">${I("pin")}Bali · 14 gece</div><div class="island-row">${stop(STAYS[0])}${hop("car", "1 sa")}${stop(STAYS[1])}${hop("car", "50 dk")}${stop(STAYS[2])}</div></div>
    ${hop("plane", "~17 sa")}${fl("flight:back", s.dated ? "27 Mart" : "dönüş")}</div>`;
}

function secHead(icon, color, name, ms) {
  const t = tally(ms);
  return `<header class="sec-h"><span style="color:${color}">${I(icon)}</span><h4>${name}</h4><span class="sp"></span><span class="sum num">${[t.rez && `${t.rez} rezerve`, t.plan && `${t.plan} seçildi`, t.rest && `${t.rest} aranıyor`].filter(Boolean).join(" · ")}</span>
    <span class="mini"><i style="width:${t.rez / t.n * 100}%;background:var(--book-ink)"></i><i style="width:${t.plan / t.n * 100}%;background:var(--planbar)"></i></span></header>`;
}
const propBtns = key => `<span class="pa"><button class="btn dark sm" data-accept="${key}">${I("into")}Yerleştir</button><button class="xbtn" data-reject="${key}" aria-label="Öneriyi at">${I("x")}</button></span>`;
const panoLine = (s, filter, label) => { const n = s.pano.filter(id => { const p = PANO.find(x => x.id === id); return p && filter(p) && !inPlan(s, id); }).length;
  return n ? `<button class="pcount" data-side="pano">${I("board")}Pano'da ${n} ${label}</button>` : ""; };

/* Konaklama kutucuğu */
function staySlot(s, st) {
  const key = "stay:" + st.k, sl = s.slots[key], m = sl.m, h = sl.ref && H[sl.ref];
  const top = `<div class="top">${sd(m)}<span class="ty"><span style="color:var(--c-stay);display:inline-flex">${I("bed")}</span>Konaklama</span>${s.dated ? `<span class="num">· ${st.d}</span>` : ""}<span class="sp"></span><span class="lab">${m === "oneri" ? "" : LAB[m]}</span></div>`;
  if (m === "bos" || m === "oneri") return `<article class="slot m-${m}" data-slot="${key}" data-cat="stay" data-city="${st.city}">${top}
    <div class="body"><img class="art" src="illus/${st.img}.png" alt=""><div><h5>${st.city}</h5><div class="nights num"><span class="moons">${"<i></i>".repeat(st.n)}</span>${st.n} gece · 2 kişi</div><p class="area">${I("pin")}${st.area[0]} <span>· ${st.area[1]}</span></p></div></div>
    <ul class="wants">${st.w.map(([ic, t]) => `<li>${I(ic)}${t}</li>`).join("")}</ul><p class="why">${I("spark")}${st.why}</p>
    ${m === "oneri" ? `<div class="prop"><span class="ph" style="background:${h.g}">${AV.AI}</span><span class="pn">${h.name}</span><span class="ps num">${bm(h.site)}${h.rate} · ${eur(h.n)} / gece · ${h.mk.filter(x => x.startsWith("✓")).length}/3 şart</span>${propBtns(key)}</div>` : ""}
    <div class="drophint">${I("into")}Buraya bırak: ${st.city}'da ${st.n} gece</div>
    <div class="self"><span class="k">Kendin ara</span>${blink("booking", s.dated ? ` · ${st.d}` : "")}${blink("airbnb")}${panoLine(s, p => p.cat === "stay" && p.city === st.city, `${st.city} kaydı`)}</div></article>`;
  const decide = m === "plan"
    ? `<dl class="facts2 num"><div><dt>Toplam</dt><dd>${eur(h.n * st.n)} <small>${st.n} gece</small></dd></div><div><dt>Ücretsiz iptal</dt><dd>${h.cancel}</dd></div><div><dt>Puan</dt><dd>${BR[h.site][1]} ${h.rate}</dd></div><div><dt>Şartların</dt><dd>${h.mk.filter(x => x.startsWith("✓")).length} / 3 tutuyor</dd></div></dl>
      <div class="acts"><a class="btn dark" href="#" onclick="return false">${bm(h.site)}${BR[h.site][1]}'da rezerve et ↗</a><button class="btn ghost">Rezerve ettim</button><button class="back" data-return="${key}">${I("undo")}Pano'ya geri</button></div>`
    : `<dl class="facts2 num"><div><dt>Giriş</dt><dd>${st.ci}</dd></div><div><dt>Çıkış</dt><dd>${st.co}</dd></div><div><dt>Adres</dt><dd>${h.addr || "—"}</dd></div><div><dt>Ödeme</dt><dd>${h.pay || "Ödendi"}</dd></div></dl>
      <div class="acts"><span class="doc">${I("file")}onay-${st.k}.pdf</span><a class="blink" href="#" onclick="return false">${I("nav")}Yol tarifi</a><span class="back" style="cursor:default">Onay no. 4821-77</span></div>`;
  return `<article class="slot m-${m}" data-slot="${key}" data-cat="stay" data-city="${st.city}">${top}
    <div class="decided"><span class="ph" style="background:${h.g}"></span><div><div class="city">${st.city} · ${st.n} gece</div><div class="hn">${h.name}</div><div class="nights"><span class="moons">${"<i></i>".repeat(st.n)}</span>${bm(h.site)}${BR[h.site][1]} ${h.rate}</div></div></div>
    ${decide}<div class="drophint">${I("into")}Bununla değiştir</div>${m === "rez" ? `<span class="stamp">${I("check")}</span>` : ""}</article>`;
}

/* Uçuş: biniş kartı */
function ticket(s, leg) {
  const key = "flight:" + leg, sl = s.slots[key], m = sl.m, out = leg === "out", f = sl.ref && F[sl.ref];
  const from = out ? ["İstanbul", "IST"] : ["Bali", "DPS · Denpasar"], to = out ? ["Bali", "DPS · Denpasar"] : ["İstanbul", "IST"];
  const day = s.dated ? (out ? "11 Mart gece" : "27 Mart") : (out ? "gidiş" : "dönüş");
  const tm = f && (out ? f.t : f.tb);
  const decided = m === "plan" || m === "rez";
  let stub = `<div><div class="stub-k">Aradığımız</div><div class="stub-v">En çok 1 aktarma</div><div class="stub-k">Business'a da bak · 2 kişi</div></div>${panoLine(s, p => p.cat === "flight", "uçuş kaydı")}`;
  if (m === "plan") stub = `<div><div class="stub-k">${BR[f.air][1]} · ${f.code}</div><div class="price num">${eur(f.n)}<small> · 2 kişi</small></div><div class="stub-k">${f.bag} · ${f.ref}</div></div><div class="acts"><a class="btn dark sm" href="#" onclick="return false">Bileti al ↗</a><button class="back" data-return="${key}">${I("undo")}</button></div>`;
  if (m === "rez") stub = `<div><div class="stub-k">${BR[f.air][1]} · ${f.code}</div><div class="stub-v num">PNR 7KQ2LM</div><div class="stub-k">Koltuk 23A · 23B</div><div class="stub-k">Check-in ${out ? "10 Mart" : "26 Mart"}'ta açılır</div></div><span class="doc">${I("file")}e-bilet.pdf</span>`;
  return `<div class="tkw"><article class="slot tk m-${m}" data-slot="${key}" data-cat="flight">
    <div class="tk-main"><div class="top">${sd(m)}<span class="ty"><span style="color:var(--c-fly);display:inline-flex">${I("plane")}</span>Uçuş</span><span>· ${out ? "Gidiş" : "Dönüş"} · ${day}</span><span class="sp"></span><span class="lab">${m === "oneri" ? "" : LAB[m]}</span></div>
      <div class="route"><div class="c"><b>${from[0]}</b>${decided ? `<span class="tm num">${tm[0]}</span> ` : ""}<small>${from[1]}</small></div>${SIL("plane", "sil")}<div class="c r"><b>${to[0]}</b>${decided ? `<span class="tm num">${tm[1]}</span> ` : ""}<small>${to[1]}</small></div></div>
      <div class="tk-sub">${decided ? f.d : "~16 sa · tek aktarma"}</div>
      ${m === "oneri" ? `<div class="prop"><span class="ph">${bm(f.air)}</span><span class="pn num">${BR[f.air][1]} · ${f.t[0]} → ${f.t[1]} ${AV.AI}</span><span class="ps num">${f.d} · <b style="color:var(--ink)">${eur(f.n)}</b> 2 kişi</span>${propBtns(key)}</div>` : ""}
      <div class="drophint">${I("into")}Buraya bırak: ${out ? "gidiş" : "dönüş"} uçuşu</div>
      ${decided ? "" : `<div class="self"><span class="k">Kendin ara</span>${blink("google")}${blink("sky")}${blink("kayak")}</div>`}</div>
    <div class="tk-stub">${stub}</div></article></div>`;
}

/* Ulaşım */
function moves(s) {
  return `<section class="sec" data-sec="move">${secHead("car", "var(--c-move)", "Ulaşım", MOVES.map((_, i) => s.slots["move:" + i].m))}
    <div class="trows">${MOVES.map(([a, b, sub, d], i) => { const key = "move:" + i, sl = s.slots[key], m = sl.m;
      return `<article class="slot trow m-${m}" data-slot="${key}" data-cat="move">${SIL("car", "tsil")}
        <div><b>${a} → ${b}</b><div class="ts num">${m === "plan" ? `${bm("klook")}Klook · özel transfer · €38 · ${d} 22:30 karşılama` : `${sub}${s.dated ? ` · ${d}` : ""}`}</div></div>
        <span class="tr">${sd(m)}${m === "plan" ? `<a class="btn dark sm" href="#" onclick="return false">Rezerve et ↗</a><button class="back" data-return="${key}">${I("undo")}</button>` : blink("klook")}</span>
        ${m === "oneri" ? `<div class="prop"><span class="ph">${AV.AI}</span><span class="pn">${bm("klook")}Klook özel transfer · €38</span>${propBtns(key)}</div>` : ""}
        ${sl.ask ? `<div class="ask">${I("msg")}Sohbette soruldu: villa mı alacak, transfer mi?</div>` : ""}
        <div class="drophint" style="grid-column:1/-1">${I("into")}Buraya bırak</div></article>`; }).join("")}</div></section>`;
}

/* Deneyimler ve yemek */
function ideas(s) {
  const tile = k => { const x = IDEAS[k]; const who = PANO.find(p => p.id === k)?.who || "AI";
    return `<div class="tile" data-idea="${k}"><span class="pic"><img src="illus/${x.img}.png" alt=""></span><span class="who">${AV[who]}</span>
      <button class="x" data-drop-idea="${k}" aria-label="${x.t} fikrini at">${I("x")}</button>
      <span class="t">${x.t}</span><span class="m num">${I("pin")}${x.city} · ${x.idea ? "AI fikri" : `${bm(x.src)}${x.p}`}</span>
      <button class="btn ghost sm add" data-add-idea="${k}">${I("plus")}Plana ekle</button></div>`; };
  const prow = ([k, m]) => { const x = IDEAS[k];
    const r = m === "rez" ? `<span class="doc">${I("check")}Bilet alındı · 25 Mart 17:30</span>` : x.ticket ? `<a class="btn dark sm" href="#" onclick="return false">Bilet al ↗</a><button class="back" data-unplan="${k}">${I("undo")}</button>` : `<span style="font-size:12.5px;color:var(--plan-ink);font-weight:600">25 Mart akşamı</span><button class="back" data-unplan="${k}">${I("undo")}</button>`;
    return `<div class="prow slot m-${m}" style="padding:8px 10px 8px 8px"><img src="illus/${x.img}.png" alt=""><span class="t">${x.t}</span><span class="m num">${sd(m)}${x.city}${x.src ? ` · ${bm(x.src)}${x.p}` : " · AI fikri"}</span><span class="r">${r}</span></div>`; };
  return `<section class="sec" data-sec="exp" data-slot="ideas" data-cat="exp">
    <header class="sec-h"><span style="color:var(--c-exp)">${I("ticket")}</span><h4>Deneyimler ve yemek</h4><span class="sp"></span><span class="sum num">${s.planned.length ? `${s.planned.length} planda · ` : ""}${s.shelf.length} fikir</span></header>
    ${s.planned.length ? `<div class="planned">${s.planned.map(prow).join("")}</div>` : ""}
    <div class="ideas-h"><b>Fikirler</b><span>· × ile at, “Plana ekle” ile al</span><span class="sp"></span>${blink("viator")}${blink("trip")}<button>${I("spark")}Yeni fikir iste</button></div>
    <div class="shelf">${s.shelf.map(tile).join("")}</div>
    <div class="drophint">${I("into")}Buraya bırak: plana eklenir</div></section>`;
}

function other(s) {
  return `<section class="sec">${secHead("shield", "var(--c-ins)", "Sigorta ve internet", [s.slots.ins.m])}
    <div class="grid2"><article class="slot trow m-bos">${I("shield")}<div><b>Seyahat sağlık sigortası</b><div class="ts num">Endonezya · 2 kişi${s.dated ? " · 12–27 Mart" : ""} · dalış ve scooter kapsamı</div></div><span class="tr">${sd("bos")}<a class="blink" href="#" onclick="return false">Karşılaştır${I("ext")}</a></span></article>
      <article class="slot trow m-${s === ST.E ? "rez" : "bos"}"><img src="illus/esim.png" alt="" style="width:40px;height:40px;object-fit:contain"><div><b>Endonezya eSIM · 10 GB</b><div class="ts num">${AV.AI}${bm("airalo")}Airalo · 15 gün · €17</div></div><span class="tr">${s === ST.E ? `<span class="doc">${I("check")}Alındı</span>` : `<button class="btn ghost sm">${I("plus")}Plana ekle</button>`}</span></article></div></section>`;
}

function planView(s) {
  return `${hero(s)}
  <div class="planbar"><strong>Plan</strong><span class="sortsw"><span class="on">Kategoriye göre</span><span>Yolculuk sırasıyla</span></span>
    <span class="key"><span><i class="sw bos"></i>Arıyoruz</span><span><i class="sw oneri"></i>İçinde öneri</span><span><i class="sw plan"></i>Seçildi</span><span><i class="sw rez"></i>Rezerve</span></span></div>
  ${shape(s)}
  <div class="plan">
    <section class="sec">${secHead("plane", "var(--c-fly)", "Uçuş", [s.slots["flight:out"].m, s.slots["flight:back"].m])}<div class="grid2">${ticket(s, "out")}${ticket(s, "back")}</div></section>
    <section class="sec">${secHead("bed", "var(--c-stay)", "Konaklama", STAYS.map(st => s.slots["stay:" + st.k].m))}<div class="grid3">${STAYS.map(st => staySlot(s, st)).join("")}</div></section>
    ${moves(s)}${ideas(s)}${other(s)}</div>`;
}

/* Yan panel */
function chatHtml(s) {
  return `<div class="msgs">${s.chat.map(([who, txt, chips, links]) => `<div class="msg ${who === "E" ? "me" : "ai"}"><span class="who-l">${who === "E" ? `${AV.E}Emre` : `${AV.AI}Asistan`}</span>${txt}
      ${links ? `<div class="links"><span class="head">${I("clip")}${links.length} link · eklentiden</span>${links.map(l => `<span class="lk">${I("link")}<span>${l}</span></span>`).join("")}</div>` : ""}
      ${chips ? `<div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>` : ""}</div>`).join("")}</div>
    <div class="input">${I("clip")}<span>Birlikte değerlendirelim…</span><span class="send">${I("up")}</span></div>`;
}
function panoPanel(s) {
  const items = s.pano.map(id => PANO.find(p => p.id === id));
  if (!items.length) return `<p class="pp-head">${I("board")}Pano boş. Eklentiyle kaydettiğin her link buraya düşer.</p>`;
  const groups = ["stay", "flight", "move", "exp", "food", "insp"].map(c => [c, items.filter(p => p.cat === c)]).filter(([, l]) => l.length);
  return `<p class="pp-head">${I("into")}Kutuya sürükle ya da oka bas. Seçtiklerin amber olur.</p>${groups.map(([c, list]) => `<div class="pp-group"><h6><span style="color:${CAT[c][2]}">${I(CAT[c][0])}</span>${CAT[c][1]}</h6>${list.map(p => panoItem(s, p)).join("")}</div>`).join("")}`;
}
function panoItem(s, p) {
  const mm = pmeta(p), on = inPlan(s, p.id), drag = !on && p.cat !== "insp" && !p.stray;
  const th = mm.g ? `background:${mm.g}` : `background:var(--tile) url(illus/${mm.img || (p.cat === "flight" ? "ucus" : "yapilacak")}.png) center/80% no-repeat`;
  return `<div class="pi${on ? " inplan" : ""}${p.stray ? " stray" : ""}" ${drag ? `draggable="true"` : ""} data-pid="${p.id}">
    ${I("grip", "i grip")}<span class="th" style="${th}">${AV[p.who]}</span><span class="t">${mm.title.split(" · ")[0]}</span>
    <span class="m num">${bm(mm.src)}<span>${on ? "Planda" : p.stray || (mm.price ? `${eur(mm.price)} ${mm.unit}` : mm.meta)}</span></span>
    ${on ? `<span class="go">${I("check")}</span>` : drag ? `<button class="go" data-place="${p.id}" aria-label="Plana yerleştir">${I("into")}</button>` : `<span class="go" style="background:none;color:var(--muted)">${I("ext")}</span>`}</div>`;
}
function side(s) {
  return `<aside class="side"><div class="side-tabs"><button class="${s.side === "chat" ? "on" : ""}" data-side="chat">${I("spark")}Asistan</button><button class="${s.side === "pano" ? "on" : ""}" data-side="pano">${I("board")}Pano <span class="badge">${s.pano.length}</span></button></div>
    <div class="side-body">${s.side === "chat" ? chatHtml(s) : panoPanel(s)}</div></aside>`;
}
function topbar(active, s) {
  return `<div class="topbar"><span class="logo" style="color:var(--accent)">${I("compass")}<span style="color:var(--ink)">Trip Radar</span></span><span class="tripsel">Bali Gezisi ${I("chev")}</span>
    <span class="topnav"><button class="${active === "plan" ? "on" : ""}" data-go="plan">Plan</button><button>Gün gün</button><button class="${active === "pano" ? "on" : ""}" data-go="pano">Pano${s.pano.length ? ` <span class="badge">${s.pano.length}</span>` : ""}</button></span>
    <span class="avs"><span class="av e lg">E</span><span class="av s lg">S</span></span></div>`;
}

/* Pano sayfası */
function panoPage(s) {
  const items = s.pano.map(id => PANO.find(p => p.id === id));
  const count = c => items.filter(p => p.cat === c).length;
  const card = p => { const mm = pmeta(p), on = inPlan(s, p.id);
    const img = mm.flight ? `<span class="img" style="background:var(--lav)"><svg viewBox="0 0 300 150" style="width:100%;height:100%" aria-hidden="true"><path d="M60 110 Q150 20 240 70" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 6"/><circle cx="60" cy="110" r="4" fill="var(--accent)"/><text x="30" y="135" font-size="14" font-weight="700" fill="var(--ink)">İstanbul</text><text x="215" y="100" font-size="14" font-weight="700" fill="var(--ink)">Bali</text></svg><svg class="i" style="position:absolute;left:calc(80% - 20px);top:34%;width:30px;height:30px;color:var(--accent);transform:rotate(30deg)"><use href="#i-plane"/></svg>`
      : mm.g ? `<span class="img" style="background:${mm.g}">${mm.play ? `<svg class="i" style="width:44px;height:44px;fill:#fff;stroke:none"><use href="#i-play"/></svg>` : ""}` : `<span class="img" style="background:var(--tile)"><img src="illus/${mm.img}.png" alt="">`;
    const act = p.cat === "insp" ? `<button class="addp">${I("plus")}Fikirlere ekle</button>` : p.stray ? `<span class="note">${p.stray}</span>` : on ? `<button class="addp on" data-unplace="${p.id}">${I("check")}Planda</button>` : `<button class="addp" data-place="${p.id}">${I("plus")}Plana ekle</button>`;
    return `<article class="pc${p.who === "AI" ? " ai" : ""}">${img}<button class="heart${p.fav ? " on" : ""}" aria-label="Favori">${I("heart")}</button><button class="more" aria-label="Diğer">${I("dots")}</button><span class="by">${AV[p.who]}${p.who === "AI" ? "AI önerisi" : NAME[p.who]}</span></span>
      <div class="bd"><div class="row1"><span style="color:${CAT[p.cat][2]}">${I(CAT[p.cat][0])}<span style="color:var(--ink)">${CAT1[p.cat]}</span></span><span class="src">${bm(mm.src)}${BR[mm.src][1]}</span></div>
        <h5>${mm.title}</h5><div class="meta num">${mm.meta}</div>
        <div class="row3">${mm.price ? `<span class="pr num">${eur(mm.price)} <small>${mm.unit}</small></span>` : "<span></span>"}${act}</div></div>
      <div class="ft num"><span>${I("up-t")}${p.up.length}<span class="avs">${p.up.map(w => AV[w]).join("")}</span></span><span>${I("down-t")}${p.down}</span><span>${I("msg")}${p.com}</span></div></article>`; };
  return `<div class="shell">${topbar("pano", s)}<div class="pano">
    <div class="pano-h"><h3>Pano</h3><span class="cnt num">${items.length} kayıt</span><span class="sp"></span><span class="search">${I("search")}Kayıtlarda ara</span><span class="pbtn">${I("heart")}Favoriler ${items.filter(p => p.fav).length}</span><span class="pbtn primary">${I("plus")}Link ekle</span></div>
    <div class="cats"><button class="on">${I("grid")}Tümü <span>${items.length}</span></button>${Object.keys(CAT).map(c => `<button><span style="color:${CAT[c][2]}">${I(CAT[c][0])}</span>${CAT[c][1]} <span>${count(c)}</span></button>`).join("")}</div>
    <div class="pfilter"><span>Tüm kayıtlar ${I("chev")}</span><span>Son eklenen ${I("chev")}</span></div>
    <div class="pgrid">${items.map(card).join("")}</div></div></div>`;
}

function app(s) { return `<div class="shell">${topbar("plan", s)}<div class="cols">${side(s)}<div class="main">${planView(s)}</div></div></div>`; }

/* Aşamalar */
function ladder() {
  const mk = m => { const s = base(); s.slots["stay:ubud"] = m === "bos" ? { m } : { m, ref: m === "oneri" ? "alas" : "sawah" }; s.slots["flight:out"] = m === "bos" ? { m } : { m, ref: "qr" }; return s; };
  const COLS = [["bos", "Arıyoruz", ["AI'nın anladığı: semt, şartlar, neden", "Kendin ara düğmeleri önde", "Çizim, kesikli çerçeve"], "AI bir öneri koyar ya da Pano'dan sürüklersin"],
    ["oneri", "İçinde öneri", ["Tek öneri, kutunun içinde", "Karar bilgisi: fiyat, puan, kaç şart tutuyor", "Yerleştir ya da ×"], "Yerleştir"],
    ["plan", "Seçildi", ["Çizim gerçek fotoğrafa döner, amber", "Karar bilgisi: toplam, ücretsiz iptal, şartlar", "Rezerve et ↗ · Pano'ya geri"], "Sitede rezerve et, “Rezerve ettim”"],
    ["rez", "Rezerve", ["Yeşil, mühürlü", "Yol bilgisi: giriş-çıkış saati, adres, onay", "Uçuşta PNR, koltuk, check-in günü"], ""]];
  return `<div class="shell"><div class="ladder">
    <h3>Konaklama: kutucuk dolarken</h3><p>Niyet kartı bir kutucuk. Öneri ya da Pano'dan gelen kayıt içine yerleşir; kutu dolunca kart oturur ve gösterdiği bilgi değişir: önce karar vermek için, rezerveden sonra yolda lazım olan.</p>
    <div class="lrow">${COLS.map(([m, h, info, trig]) => `<div class="lcol"><span class="lcap">${sd(m)}${h}</span>${staySlot(mk(m), STAYS[0])}<ul class="info">${info.map(x => `<li>${x}</li>`).join("")}</ul>${trig ? `<span class="trig">${I("right")}${trig}</span>` : ""}</div>`).join("")}</div>
    <h3>Uçuş: aynı dil biniş kartında</h3>
    <div class="lrow" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))">${COLS.map(([m, h]) => `<div class="lcol"><span class="lcap">${sd(m)}${h}</span>${ticket(mk(m), "out")}</div>`).join("")}</div>
  </div></div>`;
}

/* Yönetim */
const ORDER = ["A", "B", "C", "D", "E", "P", "L"];
const DESC = { P: "<b>Pano</b> (onaylı görsel). Kaydettiğin ve AI'nın önerdiği her şey burada; kim ekledi, kim beğendi görünür. “Plana ekle” kaydı doğru kutuya yerleştirir; D sekmesindeki Plan'la aynı durumu paylaşır.",
  L: "<b>Aşamalar.</b> Kutucuğun dört hâli: aşama çerçeve, görsel ve renkle okunur; her aşama o an gereken bilgiyi gösterir." };
let cur = "A", still = false;
function stateFor(k) { if (k === "D" || k === "P") return LIVE; if (!ST[k]) ST[k] = SC[k].make(); return ST[k]; }
function tabs() { document.getElementById("tabs").innerHTML = ORDER.map(k => (k === "P" ? `<span class="sep"></span>` : "") + `<button role="tab" aria-selected="${k === cur}" data-k="${k}">${k === "P" ? `${I("board")}Pano` : k === "L" ? "Aşamalar" : `<b>${k}</b>${SC[k].tab}`}</button>`).join(""); }
function show(k, keep) {
  if (!keep) { cur = k; tabs(); }
  document.getElementById("desc").innerHTML = DESC[k] || SC[k].desc;
  const s = k === "L" ? null : stateFor(k), y = scrollY;
  document.getElementById("view").innerHTML = k === "L" ? ladder() : k === "P" ? panoPage(s) : app(s);
  if (keep) scrollTo(0, y);
  try { localStorage.setItem("tr-sc3", k); } catch (e) {}
}
const rerender = () => show(cur, true);
let toastT; function toast(msg, undo) { const t = document.getElementById("toast"); t.innerHTML = `<span>${msg}</span>${undo ? `<button id="tundo">Geri al</button>` : ""}`; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3600); if (undo) document.getElementById("tundo").onclick = () => { undo(); t.classList.remove("on"); }; }
function flash(sel) { requestAnimationFrame(() => { const el = document.querySelector(sel); if (el && !still) { el.classList.add("fresh"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } }); }

/* Yerleştirme: Pano kaydını doğru kutuya koy */
function targetFor(s, p) {
  if (p.cat === "stay") { const st = stayOf(p.city); return st ? "stay:" + st.k : null; }
  if (p.cat === "flight") return ["flight:out", "flight:back"].find(k => !["plan", "rez"].includes(s.slots[k].m)) || "flight:out";
  if (p.cat === "move") return "move:0";
  if (p.cat === "exp" || p.cat === "food") return "ideas";
  return null;
}
function place(s, pid, slotKey) {
  const p = PANO.find(x => x.id === pid); slotKey = slotKey || targetFor(s, p);
  if (!slotKey) { toast(p.stray ? `${p.stray}; sohbette rotaya eklemeyi sor.` : "Bu kayıt bir kutuya gitmiyor; fikirlerde duruyor."); return; }
  if (slotKey === "ideas") { if (!s.planned.some(([k]) => k === pid)) s.planned.push([pid, "plan"]); s.shelf = s.shelf.filter(k => k !== pid); rerender(); flash(`[data-slot="ideas"] .prow:last-child`); toast(`${IDEAS[pid].t} plana eklendi.`); return; }
  const prev = { ...s.slots[slotKey] };
  s.slots[slotKey] = { m: "plan", ref: pid }; rerender(); flash(`[data-slot="${slotKey}"]`);
  const label = p.cat === "stay" ? `${stayOf(p.city).city}'da ${stayOf(p.city).n} gece` : p.cat === "flight" ? (slotKey.endsWith("out") ? "gidiş uçuşu" : "dönüş uçuşu") : "havalimanı transferi";
  toast(`${pmeta(p).title.split(" · ")[0]} → ${label} kutusuna yerleşti.`, () => { s.slots[slotKey] = prev; rerender(); });
}

/* Olaylar */
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(b.dataset.k); });
document.getElementById("motion").addEventListener("click", e => { still = !still; document.body.classList.toggle("still", still); const b = e.currentTarget; b.setAttribute("aria-pressed", String(still)); b.innerHTML = still ? `${I("play")}<span>Hareketi oynat</span>` : `${I("pause")}<span>Hareketi duraklat</span>`; });
document.addEventListener("click", e => {
  if (!document.getElementById("view").contains(e.target)) return;
  const s = stateFor(cur), q = sel => e.target.closest(sel);
  let b;
  if ((b = q("[data-side]"))) { s.side = b.dataset.side; rerender(); return; }
  if ((b = q("[data-go]"))) { if (s === LIVE) show(b.dataset.go === "pano" ? "P" : "D"); else if (b.dataset.go === "pano") { cur = "P"; tabs(); show("P"); } return; }
  if ((b = q("[data-place]"))) { place(s, b.dataset.place); return; }
  if ((b = q("[data-unplace]"))) { const id = b.dataset.unplace; Object.entries(s.slots).forEach(([k, v]) => { if (v.ref === id && v.m === "plan") s.slots[k] = { m: "bos" }; }); s.planned = s.planned.filter(([k]) => k !== id); rerender(); toast("Plan'dan çıktı, Pano'da duruyor."); return; }
  if ((b = q("[data-accept]"))) { const k = b.dataset.accept; s.slots[k] = { m: "plan", ref: s.slots[k].ref }; rerender(); flash(`[data-slot="${k}"]`); toast("Öneri kutuya yerleşti."); return; }
  if ((b = q("[data-reject]"))) { const k = b.dataset.reject, prev = { ...s.slots[k] }; s.slots[k] = { m: "bos" }; rerender(); toast("Öneri atıldı. Sohbette “başka öner” diyebilirsin.", () => { s.slots[k] = prev; rerender(); }); return; }
  if ((b = q("[data-return]"))) { const k = b.dataset.return, prev = { ...s.slots[k] }; s.slots[k] = { m: "bos" }; rerender(); toast("Pano'ya geri döndü.", () => { s.slots[k] = prev; rerender(); }); return; }
  if ((b = q("[data-drop-idea]"))) { const k = b.dataset.dropIdea; s.shelf = s.shelf.filter(x => x !== k); rerender(); toast(`${IDEAS[k].t} atıldı.`, () => { s.shelf.push(k); rerender(); }); return; }
  if ((b = q("[data-add-idea]"))) { const k = b.dataset.addIdea; s.planned.push([k, "plan"]); s.shelf = s.shelf.filter(x => x !== k); rerender(); flash(`[data-slot="ideas"] .prow:last-child`); toast(`${IDEAS[k].t} plana eklendi.`); return; }
  if ((b = q("[data-unplan]"))) { const k = b.dataset.unplan; s.planned = s.planned.filter(([x]) => x !== k); s.shelf.unshift(k); rerender(); toast("Fikirlere geri döndü."); return; }
});

/* Sürükle bırak */
let dragId = null;
const fits = (slot, p) => { const cat = slot.dataset.cat; if (cat === "exp") return p.cat === "exp" || p.cat === "food"; if (cat !== p.cat) return false; if (cat === "stay") return slot.dataset.city === p.city; return true; };
document.addEventListener("dragstart", e => { const it = e.target.closest?.(".pi[draggable]"); if (!it) return; dragId = it.dataset.pid; it.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch (x) {}
  const p = PANO.find(x => x.id === dragId); document.querySelectorAll("[data-slot]").forEach(sl => { if (fits(sl, p) && !sl.classList.contains("m-rez")) sl.classList.add("can-drop"); }); });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".can-drop,.over,.dragging").forEach(el => el.classList.remove("can-drop", "over", "dragging")); });
document.addEventListener("dragover", e => { const sl = e.target.closest?.(".can-drop"); if (!sl) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; document.querySelectorAll(".over").forEach(x => x !== sl && x.classList.remove("over")); sl.classList.add("over"); });
document.addEventListener("dragleave", e => { const sl = e.target.closest?.(".can-drop"); if (sl && !sl.contains(e.relatedTarget)) sl.classList.remove("over"); });
document.addEventListener("drop", e => { const sl = e.target.closest?.(".can-drop"); if (!sl || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; place(stateFor(cur), id, sl.dataset.slot); });

let start = "A"; try { const s = localStorage.getItem("tr-sc3"); if (ORDER.includes(s)) start = s; } catch (e) {}
cur = start; tabs(); show(start);
</script>
