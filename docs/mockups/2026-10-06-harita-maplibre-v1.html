<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gezi haritası v1</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  :root { --accent:#5b45e0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif; }
  html,body { margin:0; height:100%; background:#0b1020; }
  #map { position:absolute; inset:0; }
  .stop { display:flex; flex-direction:column; align-items:center; gap:6px; transform:translateY(-8px); }
  .stop .nm { background:#fff; border-radius:10px; padding:5px 10px; font-weight:700; font-size:15px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .stop .ph { position:relative; width:64px; height:64px; border-radius:50%; border:3px solid #fff; box-shadow:0 4px 14px rgba(0,0,0,.3); background-size:cover; background-position:center; }
  .stop .n { position:absolute; top:-4px; right:-6px; width:24px; height:24px; border-radius:50%; background:#fff; font-weight:800; font-size:13px; display:grid; place-items:center; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .home { width:40px; height:40px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 2px 10px rgba(0,0,0,.25); font-size:18px; }
  .dur { background:#fff; border-radius:10px; padding:5px 10px; font-weight:700; font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,.18); display:flex; gap:6px; align-items:center; }
  .plane { font-size:26px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .play { position:absolute; left:20px; bottom:20px; width:52px; height:52px; border-radius:50%; border:0; background:#c9b8ff; color:#1d1d1f; font-size:20px; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; }
</style>
</head>
<body>
<div id="map"></div>
<button class="play" id="play" title="Geziyi oynat">▶</button>
<script>
  const STOPS = [
    { name:"İstanbul", c:[28.98,41.01], home:true },
    { name:"Porto", c:[-8.61,41.15], n:3 },
    { name:"Madeira", c:[-16.91,32.65], n:2 },
  ];
  const LEGS = [[0,1,"4 sa 55 dk"],[1,2,"1 sa 50 dk"]];
  // Büyük daire yayı (düz çizgi yerine)
  function arc(a, b, n = 96) {
    const r = Math.PI/180, [l1,p1]=[a[0]*r,a[1]*r], [l2,p2]=[b[0]*r,b[1]*r];
    const d = 2*Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2));
    const out = [];
    for (let i=0;i<=n;i++){ const f=i/n, A=Math.sin((1-f)*d)/Math.sin(d), B=Math.sin(f*d)/Math.sin(d);
      const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2), y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2), z=A*Math.sin(p1)+B*Math.sin(p2);
      out.push([Math.atan2(y,x)/r, Math.atan2(z,Math.sqrt(x*x+y*y))/r]); }
    return out;
  }
  const map = new maplibregl.Map({
    container:"map", style:"https://tiles.openfreemap.org/styles/liberty",
    center:[8,40], zoom:3.1, attributionControl:{ compact:true }, preserveDrawingBuffer:true,
  });
  map.on("style.load", () => {
    map.setProjection({ type:"globe" });
    map.setSky?.({ "sky-color":"#7ab8ff", "horizon-color":"#cfe6ff", "atmosphere-blend":["interpolate",["linear"],["zoom"],0,1,5,1,7,0] });
  });
  const KEY = "sb_publishable_HotkmMyo4PGggsarTsiVZQ_eOSUlhS0";
  const photo = (q) => fetch("https://zjkesdsbructiyflzqvq.supabase.co/functions/v1/city-image?q=" + encodeURIComponent(q), { headers:{ apikey:KEY } }).then(r => r.json()).then(j => j.url).catch(() => null);
  map.on("load", async () => {
    // Etiketler Türkçe (yoksa İngilizce), yerel alfabe yok
    for (const l of map.getStyle().layers) if (l.type === "symbol" && l.layout?.["text-field"]) { try { map.setLayoutProperty(l.id, "text-field", ["coalesce", ["get","name:tr"], ["get","name_en"], ["get","name"]]); } catch (e) { console.error(String(e)); } }
    for (const s of STOPS) if (!s.home) { try { s.img = await photo(s.name); } catch (e) { console.error(String(e)); } }
    LEGS.forEach(([a,b,dur],i) => {
      const line = arc(STOPS[a].c, STOPS[b].c);
      map.addSource("leg"+i, { type:"geojson", data:{ type:"Feature", geometry:{ type:"LineString", coordinates:line } } });
      map.addLayer({ id:"leg"+i, type:"line", source:"leg"+i, paint:{ "line-color":"#2a1f4d", "line-width":4, "line-dasharray":[2,1] }, layout:{ "line-cap":"round" } });
      const mid = line[Math.floor(line.length*(i ? 0.3 : 0.45))];
      const el = document.createElement("div"); el.className="dur"; el.innerHTML="✈ "+dur;
      new maplibregl.Marker({ element:el }).setLngLat(mid).addTo(map);
    });
    STOPS.forEach((s) => {
      const el = document.createElement("div");
      if (s.home) { el.className="home"; el.textContent="⌂"; }
      else { el.className="stop"; el.innerHTML = `<span class="nm">${s.name}</span><span class="ph" style="background-image:url(${s.img})"><span class="n">${s.n}</span></span>`; }
      new maplibregl.Marker({ element:el, anchor: s.home ? "center" : "bottom" }).setLngLat(s.c).addTo(map);
    });
    const pl = document.createElement("div"); pl.className="plane"; pl.textContent="✈";
    const plane = new maplibregl.Marker({ element:pl, rotationAlignment:"map" }).setLngLat(STOPS[0].c);
    function fly() {
      const path = LEGS.flatMap(([a,b]) => arc(STOPS[a].c, STOPS[b].c, 120));
      plane.addTo(map); let i = 0;
      const step = () => { if (i >= path.length-1) { plane.remove(); return; }
        const [x0,y0]=path[i], [x1,y1]=path[i+1]; plane.setLngLat(path[i]);
        plane.setRotation(Math.atan2(x1-x0, y1-y0)*180/Math.PI - 45); i += 2; requestAnimationFrame(step); };
      step();
    }
    document.getElementById("play").onclick = fly;
    window.__ready = true;
  });
</script>
</body>
</html>
