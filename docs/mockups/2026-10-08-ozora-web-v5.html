<title>Ozora Planı</title>
<style>

:root {

  --on-brand: #ffffff;
  --p-e: #5b45e0; --p-a: #1d8577; --p-d: #b23c00; --p-z: #c0256b; --p-m: #1765cc; --p-c: #8a5a00;
  --glow: rgba(91, 69, 224, .4); --scrim: rgba(28, 26, 51, .38);
  --shadow: 0 1px 2px rgba(28, 26, 51, .05), 0 16px 40px -22px rgba(28, 26, 51, .28);
  --shadow-sm: 0 1px 2px rgba(28, 26, 51, .06), 0 6px 18px -10px rgba(28, 26, 51, .25);
  --shadow-lg: 0 30px 80px -20px rgba(28, 26, 51, .45);

}

  --c-ev: #ec6aa4; --c-fly: #9d8bff; --c-stay: #3fc4b4; --c-move: #e2ab52; --c-doc: #3fc79f; --c-prep: #aab3c5; --c-idea: #9a8bff;
  --p-e: #9a8bff; --p-a: #3fc4b4; --p-d: #f08a5a; --p-z: #ec6aa4; --p-m: #77a3f3; --p-c: #f0bf63;
  --glow: rgba(154, 139, 255, .5); --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 44px -22px rgba(0, 0, 0, .8);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
  --shadow-lg: 0 30px 80px -20px rgba(0, 0, 0, .9);

} }
:root[data-theme="dark"] {
  --bg: #0d0c14; --app: #17161f; --soft: #201e2c; --tile: #efede8;

  --plan-bg: #2a2416; --plan-line: #5c4a1f; --plan-ink: #f0bf63; --plan-dot: #f0a53a;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
::selection { background: var(--lav); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.page { padding-block: 20px 48px; padding-inline: clamp(16px, 2.4vw, 32px); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 1560px; margin: 0 auto; }
.page > * { min-width: 0; }

/* Senaryo seçici */
.switch { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: grid; gap: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-radius: 16px; }
.switch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.switch h1 { margin: 0 8px 0 4px; font-family: var(--display); font-size: 17px; letter-spacing: -0.01em; }
.tabs-sc { display: flex; gap: 4px; flex-wrap: wrap; background: var(--app); padding: 4px; border-radius: 12px; box-shadow: var(--shadow); }
.tabs-sc button { padding: 6px 12px; border-radius: 9px; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tabs-sc button b { font-weight: 700; color: var(--accent-ink); }
.tabs-sc button[aria-selected="true"] { background: var(--ink); color: var(--app); }
.tabs-sc button[aria-selected="true"] b { color: var(--app); }
.tabs-sc .sep { width: 1px; background: var(--line); margin: 4px 2px; }
.motion { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 9px; }
.motion:hover { background: var(--app); }
.sc-desc { margin: 0 4px; font-size: 14px; color: var(--muted); }
.sc-desc b { color: var(--ink); font-weight: 600; }

/* Kabuk */
.shell { background: var(--app); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 750; font-size: 17px; }
.logo svg { width: 22px; height: 22px; color: var(--accent); }
.tripsel { font-size: 14px; display: inline-flex; gap: 4px; align-items: center; padding-left: 14px; border-left: 1px solid var(--line); }
.topnav { display: flex; gap: 24px; margin: 0 auto; font-size: 14.5px; }
.topnav button { padding: 4px 0; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.topnav button.on { color: var(--accent-ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--accent); }
.badge { font-size: 11.5px; font-weight: 700; background: var(--lav); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; }
.cols { display: grid; grid-template-columns: 320px minmax(0, 1fr); }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .chat { border-right: 0; border-bottom: 1px solid var(--line2); } }

/* Kişiler */
.av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 800; color: var(--on-accent); flex: none; border: 2px solid var(--app); }
.av.ai { background: var(--lav); color: var(--accent-ink); }
.av.ai svg { width: 11px; height: 11px; stroke-width: 2.2; }
.av.lg { width: 30px; height: 30px; font-size: 12.5px; }
.avs { display: inline-flex; }
.avs .av + .av { margin-left: -6px; }
.saver { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.saver b { color: var(--ink); font-weight: 600; }

/* Sohbet */
.chat { border-right: 1px solid var(--line2); padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chat h2 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.chat h2 svg { color: var(--accent); }
.msgs { display: grid; gap: 10px; align-content: start; flex: 1; }
.msg { padding: 10px 12px; border-radius: 14px; font-size: 14px; min-width: 0; }
.msg.me { background: var(--lav); border-top-left-radius: 5px; }
.msg.ai { background: var(--soft); border-top-left-radius: 5px; }
.msg b { font-weight: 650; }
.who-l { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-ink); background: var(--app); }
.links { display: grid; gap: 4px; margin-top: 8px; }
.links .lk { display: flex; gap: 7px; align-items: center; font-size: 12.5px; background: var(--app); border-radius: 8px; padding: 4px 7px; min-width: 0; }
.links .lk span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.working { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bob 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-3px); opacity: 1; } }
.input { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 12px; color: var(--muted); font-size: 14px; }
.input .send { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; background: var(--lav); color: var(--accent-ink); display: grid; place-items: center; }

/* Hero v9 */
.main { padding: 20px 24px 28px; display: grid; gap: 20px; min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 62fr) minmax(0, 34fr); gap: 4%; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.story { display: grid; gap: 12px; align-content: start; min-width: 0; }
.photo { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 1.92 / 1; max-width: 100%; }
.photo svg { display: block; width: 100%; height: 100%; }
.citysel { position: absolute; top: 12px; left: 12px; display: flex; padding: 4px; background: rgba(255,255,255,.9); border-radius: 999px; font-size: 14px; color: #6b6790; }
.citysel span { padding: 4px 12px; border-radius: 999px; }
.citysel span.on { background: #fff; color: #1c1a33; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.pills { position: absolute; top: 12px; right: 12px; }
.pills span { background: #ece8ff; color: #4a35cc; font-size: 13px; padding: 5px 11px; border-radius: 999px; }
.story h3 { margin: 4px 0 0; font-family: var(--display); font-size: clamp(28px, 3vw, 40px); line-height: 1.05; letter-spacing: -0.025em; }
.dline { display: flex; gap: 8px; align-items: center; font-size: 16px; flex-wrap: wrap; }
.est { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--dash); border-radius: 999px; padding: 1px 8px; }
.tone { margin: 0; color: var(--muted); font-size: 16px; text-wrap: pretty; }
.cells { display: flex; flex-wrap: wrap; }
.cell { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 0; margin-right: 16px; border-right: 1px solid var(--line); font-size: 16px; white-space: nowrap; }
.cell:last-child { border-right: 0; }
.cell svg { width: 20px; height: 20px; }
.prog { background: var(--mint); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; }
.prog b { font-size: 16px; }
.prog .legend { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.seg { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--mintbar) 16%, transparent); }
.seg i { display: block; height: 100%; transition: width .8s cubic-bezier(.16, 1, .3, 1); }
.prog .cta { grid-row: 1 / span 3; grid-column: 2; background: var(--ink); color: var(--app); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
@media (max-width: 560px) { .prog { grid-template-columns: minmax(0, 1fr); } .prog .cta { grid-row: auto; grid-column: auto; justify-self: start; } }
.card { background: var(--soft); border-radius: 20px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card .blk + .blk { border-top: 1px solid var(--line); padding-top: 14px; }
.people { display: flex; gap: 12px; align-items: center; }
.people small { display: block; color: var(--muted); font-size: 13.5px; }
.styles { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.style { font-size: 13.5px; padding: 5px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; background: var(--app); }
.style svg { width: 15px; height: 15px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14.5px; }
.kv .h { font-weight: 700; font-size: 17px; }
.kv .m { color: var(--muted); }
.kv .r { text-align: right; }
.country { display: flex; gap: 8px; align-items: center; font-size: 14.5px; }
.flag { width: 24px; height: 16px; border-radius: 3px; background: linear-gradient(#ce2939 33.3%, #fff 33.3% 66.6%, #477050 66.6%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.wx { display: flex; gap: 16px; font-size: 14px; margin-top: 8px; flex-wrap: wrap; }
.wx span { display: inline-flex; gap: 6px; align-items: center; }
.wx svg { width: 16px; height: 16px; color: var(--c-move); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.ptabs { display: flex; justify-content: center; gap: 28px; font-size: 15px; color: var(--muted); }
.ptabs span.on { color: var(--ink); font-weight: 650; box-shadow: inset 0 -3px 0 var(--accent); padding-bottom: 8px; }

/* Yolculuk: kaydırma yok, dört durak, doğru taşıt */
.journey { display: grid; grid-template-columns: auto minmax(20px, 1fr) auto minmax(20px, 1fr) auto minmax(20px, 1fr) auto; align-items: start; padding: 6px 4px 0; }
.jstop { position: relative; display: grid; justify-items: center; gap: 3px; text-align: center; outline: none; }
.jnode { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--tile); border: 2px dashed var(--dash); transition: transform .35s cubic-bezier(.16, 1, .3, 1); }
.jnode img, .jnode svg.art { width: 34px; height: 28px; object-fit: contain; padding: 0; }
.jstop.big .jnode { width: 60px; height: 60px; }
.jstop.big .jnode svg.art { width: 44px; height: 36px; color: var(--c-ev); }
.jstop.j-plan .jnode { border: 2px solid var(--plan-dot); }
.jstop.j-rez .jnode { border: 2px solid var(--book-ink); }
.jstop:hover .jnode, .jstop:focus-visible .jnode { transform: translateY(-3px) scale(1.06); }
.jstop b { font-size: 13.5px; white-space: nowrap; }
.jstop small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.jtip { position: absolute; top: calc(100% + 8px); left: 50%; width: 210px; transform: translate(-50%, -6px) scale(.96); opacity: 0; pointer-events: none; z-index: 5; background: var(--app); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 10px 12px; text-align: left; font-size: 13px; display: grid; gap: 5px; transition: opacity .2s, transform .3s cubic-bezier(.16, 1, .3, 1); }
.jstop:first-child .jtip { left: 0; transform: translate(0, -6px) scale(.96); }
.jstop:last-child .jtip { left: auto; right: 0; transform: translate(0, -6px) scale(.96); }
.jstop:hover .jtip, .jstop:focus-visible .jtip { opacity: 1; transform: translate(-50%, 0) scale(1); }
.jstop:first-child:hover .jtip, .jstop:first-child:focus-visible .jtip, .jstop:last-child:hover .jtip, .jstop:last-child:focus-visible .jtip { transform: none; }
.jtip .r { display: flex; gap: 6px; align-items: flex-start; }
.jtip .r svg { width: 14px; height: 14px; color: var(--muted); margin-top: 2px; }
.jhop { position: relative; height: 48px; display: grid; place-items: center; color: var(--muted); font-size: 11.5px; overflow: hidden; }
.jstop.big + .jhop, .jhop:has(+ .jstop.big) { height: 60px; }
.jhop::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px dotted var(--dash); }
.jhop .lbl { position: absolute; top: calc(50% + 8px); background: var(--app); padding: 0 4px; white-space: nowrap; }
.jhop .mover { position: absolute; top: calc(50% - 9px); left: 0; width: 18px; height: 18px; background: var(--app); animation: travel 6s cubic-bezier(.45, 0, .55, 1) infinite; }
.jhop .mover.fly { color: var(--c-fly); }
.jhop .mover.bus { color: var(--c-move); animation-duration: 8s; }
@keyframes travel { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: calc(100% - 18px); opacity: 0; } }
@media (max-width: 520px) { .jstop small, .jhop .lbl { display: none; } .jnode { width: 40px; height: 40px; } .jstop.big .jnode { width: 48px; height: 48px; } }

/* Plan başlığı */
.planbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.planbar strong { font-size: 20px; font-family: var(--display); letter-spacing: -0.01em; }
.sortsw { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; font-size: 13px; }
.sortsw span { padding: 4px 10px; border-radius: 8px; color: var(--muted); }
.sortsw span.on { background: var(--app); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.key { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 26px; height: 16px; border-radius: 5px; display: inline-block; }
.sw.bos { background: var(--app); border: 1.5px dashed var(--dash); }
.sw.plan { background: var(--plan-bg); border: 1px solid var(--plan-line); }
.sw.rez { background: var(--book-bg); border: 1px solid var(--book-line); }

/* Durum çemberi */
.sd { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.sd.bos { border: 1.5px dashed var(--dash); background: var(--app); }
.sd.plan { border: 2px solid var(--plan-dot); background: var(--app); }
.sd.rez { background: var(--book-ink); color: var(--app); }
.sd.rez svg { width: 11px; height: 11px; stroke-width: 3; }

/* Bölümler */
.plan { border: 1px solid var(--line2); border-radius: 22px; overflow: hidden; }
.sec { padding: 18px 20px 20px; display: grid; gap: 14px; }
.sec + .sec { border-top: 1px solid var(--line2); }
.sec-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sec-h h4 { margin: 0; font-size: 17px; font-weight: 650; }
.sec-h .sp { flex: 1; }
.sec-h .sum { font-size: 13px; color: var(--muted); }
.mini { width: 96px; height: 6px; border-radius: 99px; background: var(--line2); display: flex; overflow: hidden; }
.mini i { display: block; height: 100%; transition: width .8s cubic-bezier(.16, 1, .3, 1); }
.note { margin: -6px 0 0; font-size: 13.5px; color: var(--accent-ink); display: flex; gap: 6px; align-items: flex-start; }
.note svg { width: 14px; height: 14px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; }

/* Kutucuk: üç malzeme, üç satır düzeni (üst · gövde · alt) */
.slot { position: relative; text-align: left; width: 100%; border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; cursor: pointer; transition: background .5s, border-color .5s, box-shadow .25s, transform .25s cubic-bezier(.16, 1, .3, 1); }
.slot:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.m-bos { background: var(--app); border: 1.5px dashed var(--dash); }
.m-plan { background: var(--plan-bg); border: 1px solid var(--plan-line); }
.m-rez { background: var(--book-bg); border: 1px solid var(--book-line); }
.top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.top .ty { display: inline-flex; gap: 5px; align-items: center; font-weight: 650; color: var(--ink); }
.top .ty .ic { display: inline-flex; }
.top .ty svg { width: 15px; height: 15px; }
.top .sp { flex: 1; }
.top .lab { font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.m-bos .top .lab { color: var(--muted); font-weight: 500; }
.m-plan .top .lab { color: var(--plan-ink); }
.m-rez .top .lab { color: var(--book-ink); }
.pin { font-size: 11.5px; font-weight: 650; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.art { width: 64px; height: 52px; border-radius: 12px; background: var(--tile); object-fit: contain; padding: 4px; display: grid; place-items: center; }
.art svg.art { width: 52px; height: 42px; background: none; }
.what { font-size: 18px; font-weight: 750; letter-spacing: -0.015em; line-height: 1.2; }
.sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sub svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }
.why { margin: 0; font-size: 13px; color: var(--accent-ink); display: flex; gap: 6px; align-items: flex-start; }
.why svg { width: 14px; height: 14px; margin-top: 2px; }
.foot { display: flex; align-items: center; gap: 10px; min-height: 34px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--dash) 40%, transparent); font-size: 13px; }
.foot .sp { flex: 1; }
.fcount { display: inline-flex; gap: 6px; align-items: center; color: var(--accent-ink); font-weight: 600; }
.fcount svg { width: 15px; height: 15px; }
.searching { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); }
.price { font-size: 16px; font-weight: 750; }
.price small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.proof { display: inline-flex; gap: 5px; align-items: center; font-weight: 650; color: var(--book-ink); min-width: 0; }
.proof svg { width: 14px; height: 14px; }
.more { color: var(--muted); display: inline-flex; gap: 3px; align-items: center; font-size: 12.5px; white-space: nowrap; }
.more svg { width: 14px; height: 14px; transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
.slot:hover .more svg { transform: translateX(3px); }
.go { display: inline-flex; gap: 6px; align-items: center; background: var(--ink); color: var(--app); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap; text-decoration: none; }
.go svg { width: 13px; height: 13px; }
.bm { width: 18px; height: 18px; border-radius: 5px; color: var(--on-brand); font-size: 10px; font-weight: 800; display: inline-grid; place-items: center; flex: none; }
.stamp { position: absolute; right: 16px; top: 44px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--book-ink); color: var(--book-ink); display: grid; place-items: center; transform: rotate(-12deg); opacity: .4; pointer-events: none; }
.stamp svg { width: 16px; height: 16px; stroke-width: 2.4; }
.m-rez .row { padding-right: 52px; }

/* Bilet biçimi: uçuş ve etkinlik */
.tkw { container-type: inline-size; min-width: 0; }
.tk { padding: 0; grid-template-columns: minmax(0, 1fr) 150px; gap: 0; display: grid; }
.tk-main { padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.route { display: grid; grid-template-columns: auto minmax(50px, 1fr) auto; align-items: center; gap: 8px; }
.route .c b { display: block; font-size: 21px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
.route .c small { font-size: 12.5px; color: var(--muted); }
.route .c .t { font-size: 14px; font-weight: 700; }
.route .c.r { text-align: right; }
.route .sil { width: 100%; height: 44px; color: var(--c-fly); }
.m-bos .route .sil { opacity: .45; }
.tk-stub { position: relative; border-left: 1.5px dashed var(--dash); padding: 14px; display: grid; gap: 3px; align-content: center; min-width: 0; font-size: 13px; }
.tk-stub::before, .tk-stub::after { content: ""; position: absolute; left: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--app); }
.tk-stub::before { top: -10px; } .tk-stub::after { bottom: -10px; }
.stub-k { font-size: 12px; color: var(--muted); }
.stub-v { font-size: 15px; font-weight: 750; }
@container (max-width: 470px) { .tk { grid-template-columns: minmax(0, 1fr); } .tk-stub { border-left: 0; border-top: 1.5px dashed var(--dash); } .tk-stub::before, .tk-stub::after { display: none; } }
.tk .stamp { right: 12px; top: auto; bottom: 10px; width: 38px; height: 38px; }

/* Hazırlık */
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; }
.ck { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; background: var(--soft); font-size: 14px; cursor: pointer; transition: background .3s; }
.ck input { appearance: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--dash); background: var(--app); display: grid; place-items: center; flex: none; cursor: pointer; transition: background .25s, border-color .25s; }
.ck input:checked { background: var(--book-ink); border-color: var(--book-ink); }
.ck input:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--app); border-bottom: 2px solid var(--app); transform: rotate(-45deg) translate(1px, -1px); }
.ck:has(input:checked) { background: var(--book-bg); }
.ck:has(input:checked) .ct > span { text-decoration: line-through; color: var(--muted); }
.ck .ct { flex: 1; min-width: 0; display: grid; }
.ck small { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.ck .buy { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; color: var(--accent-ink); white-space: nowrap; }
.ck .buy .bm { width: 15px; height: 15px; font-size: 9px; }

/* Fikirler */
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.idea { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--app); }
.idea img { width: 48px; height: 48px; border-radius: 10px; background: var(--tile); object-fit: contain; padding: 2px; grid-row: span 3; }
.idea .t { font-size: 14px; font-weight: 650; line-height: 1.25; padding-right: 26px; }
.idea .m { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.idea .x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity .18s; }
.idea .x svg { width: 12px; height: 12px; }
.idea:hover .x, .idea:focus-within .x { opacity: 1; }
@media (hover: none) { .idea .x { opacity: 1; } }
.idea.added { background: var(--plan-bg); border-color: var(--plan-line); }
.idea .add { justify-self: start; font-size: 12.5px; font-weight: 600; color: var(--accent-ink); display: inline-flex; gap: 4px; align-items: center; }
.idea .add svg { width: 13px; height: 13px; }

/* Seçim penceresi = küçük karşılaştırma */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: grid; place-items: center; padding: 24px 16px; opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.picker { width: min(700px, 100%); max-height: min(88vh, 900px); overflow: auto; background: var(--app); border-radius: 22px; box-shadow: var(--shadow-lg); transform: translateY(16px) scale(.98); transition: transform .4s cubic-bezier(.16, 1, .3, 1); }
.scrim.on .picker { transform: none; }
.pk-h { position: sticky; top: 0; background: var(--app); z-index: 2; padding: 18px 20px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; border-bottom: 1px solid var(--line2); }
.pk-h .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; grid-row: span 2; background: var(--soft); }
.pk-h .ic svg { width: 20px; height: 20px; }
.pk-h h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
.pk-h p { margin: 0; font-size: 13.5px; color: var(--muted); grid-column: 2; }
.pk-h .close { grid-row: 1 / span 2; grid-column: 3; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.pk-b { padding: 16px 20px 18px; display: grid; gap: 16px; }
.foryou { padding: 12px 14px; border-radius: 14px; background: var(--lav); font-size: 14px; display: grid; gap: 2px; }
.foryou b { font-weight: 700; }
.foryou span { color: var(--muted); font-size: 13px; }
.pk-sec { display: grid; gap: 8px; }
.pk-sec h6 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.pk-sec h6 svg { width: 14px; height: 14px; }
.opt { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 3px 12px; align-items: start; padding: 12px; border-radius: 16px; border: 1px solid var(--line); transition: border-color .2s, background .2s; }
.opt:hover { border-color: var(--accent); }
.opt.cur { background: var(--plan-bg); border-color: var(--plan-line); }
.opt.cur.rez { background: var(--book-bg); border-color: var(--book-line); }
.score { width: 48px; height: 48px; border-radius: 50%; grid-row: span 4; display: grid; place-items: center; align-content: center; font-weight: 800; font-size: 17px; line-height: 1; background: var(--soft); }
.score small { font-size: 9.5px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.score.hi { background: var(--lav); color: var(--accent-ink); }
.opt .on { font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rozet { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--lav); color: var(--accent-ink); }
.opt .os { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.pm { font-size: 13px; display: grid; gap: 1px; }
.pm .p { color: var(--plus); } .pm .m { color: var(--minus); }
.pm .p::before { content: "+ "; font-weight: 800; } .pm .m::before { content: "− "; font-weight: 800; }
.opt .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.reacts { display: inline-flex; gap: 5px; align-items: center; }
.reacts svg { width: 14px; height: 14px; }
.opt .pr { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-weight: 750; font-size: 16px; }
.opt .pr small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.opt .act { grid-column: 3; grid-row: 3 / span 2; align-self: end; justify-self: end; }
.pick { display: inline-flex; gap: 6px; align-items: center; background: var(--ink); color: var(--app); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
.pick svg { width: 13px; height: 13px; }
.ghost { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--app); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.ghost svg { width: 13px; height: 13px; }
.chosen-ok { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 650; color: var(--book-ink); }
.chosen-ok svg { width: 14px; height: 14px; }
.booked { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.booked div { padding: 10px 12px; border-radius: 12px; background: var(--book-bg); display: grid; gap: 1px; }
.booked dt { font-size: 12px; color: var(--muted); }
.booked dd { margin: 0; font-weight: 700; font-size: 15px; }
.self { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.blink { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border-radius: 9px; color: var(--ink); text-decoration: none; background: var(--app); border: 1px solid var(--line); font-size: 13px; transition: border-color .2s, transform .2s; }
.blink:hover { border-color: var(--accent); transform: translateY(-1px); }
.blink svg { width: 12px; height: 12px; color: var(--muted); }
.pk-f { position: sticky; bottom: 0; background: var(--app); border-top: 1px solid var(--line2); padding: 12px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pk-f .sp { flex: 1; }
.empty { font-size: 13.5px; color: var(--muted); padding: 10px 12px; border-radius: 12px; background: var(--soft); }

/* Hareket: aşama geçişleri */
.arrive .art, .arrive .ph { animation: drop .7s cubic-bezier(.16, 1, .3, 1); }
@keyframes drop { 0% { transform: translateY(-14px) scale(.85); opacity: 0; } 100% { transform: none; opacity: 1; } }
.arrive .sil { animation: takeoff 1.1s cubic-bezier(.16, 1, .3, 1); }
@keyframes takeoff { 0% { transform: translate(-40%, 8px) rotate(-6deg); opacity: 0; } 60% { transform: translate(6%, -4px) rotate(-3deg); opacity: 1; } 100% { transform: none; } }
.arrive .stamp { animation: stamp .55s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes stamp { 0% { transform: rotate(-30deg) scale(1.8); opacity: 0; } 100% { transform: rotate(-12deg) scale(1); opacity: .4; } }
.arrive .lab { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); display: inline-block; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.arrive { animation: glow 1.6s cubic-bezier(.16, 1, .3, 1); }
@keyframes glow { 0% { box-shadow: 0 0 0 0 var(--glow); } 35% { box-shadow: 0 0 0 6px var(--glow); } 100% { box-shadow: 0 0 0 14px transparent; } }
.searching .bar { width: 44px; height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--line2) 25%, var(--lav) 50%, var(--line2) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Pano: çalışma masası */
.pano { padding: 22px 26px 28px; display: grid; gap: 16px; }
.pano-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pano-h h3 { margin: 0; font-family: var(--display); font-size: 36px; letter-spacing: -0.025em; }
.pano-h .cnt { color: var(--muted); font-size: 16px; }
.pano-h .sp { flex: 1; }
.pbtn { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 14px; }
.pbtn.primary { background: var(--lav); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-ink); font-weight: 600; }
.pbtn svg { width: 16px; height: 16px; }
.cats { display: flex; gap: 6px 22px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.cats button { display: inline-flex; gap: 8px; align-items: center; padding: 8px 2px 10px; font-size: 14.5px; }
.cats button span { color: var(--muted); }
.cats button.on { color: var(--accent-ink); box-shadow: inset 0 -2px 0 var(--accent); }
.cats svg { width: 20px; height: 20px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.pc { position: relative; background: var(--app); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); display: grid; grid-template-rows: auto 1fr auto; transition: transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .25s; }
.pc:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.pc.inplan { border-color: var(--plan-dot); }
.pc .img { height: 130px; position: relative; display: grid; place-items: center; overflow: hidden; }
.pc .img img { height: 100px; object-fit: contain; }
.pc .rz { position: absolute; top: 10px; left: 10px; }
.pc .heart { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; color: #1c1a33; }
.pc .heart svg { width: 16px; height: 16px; }
.pc .heart.on svg { fill: #e11d5b; stroke: #e11d5b; }
.pc .sc { position: absolute; right: 10px; bottom: -22px; width: 46px; height: 46px; border-radius: 50%; background: var(--app); box-shadow: var(--shadow-sm); display: grid; place-items: center; align-content: center; font-weight: 800; font-size: 16px; line-height: 1; }
.pc .sc small { font-size: 9px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.pc .bd { padding: 28px 14px 8px; display: grid; gap: 5px; align-content: start; }
.pc .row1 { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.pc .row1 span { display: inline-flex; gap: 6px; align-items: center; }
.pc h5 { margin: 0; font-size: 16.5px; font-weight: 750; line-height: 1.25; }
.pc .meta { font-size: 13px; color: var(--muted); }
.pc .row3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.pc .pr { font-size: 17px; font-weight: 750; }
.pc .pr small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.addp { display: inline-flex; gap: 6px; align-items: center; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); border-radius: 10px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; }
.addp svg { width: 15px; height: 15px; }
.addp.on { background: var(--plan-bg); border-color: var(--plan-line); color: var(--plan-ink); }
.addp.rez { background: var(--book-bg); border-color: var(--book-line); color: var(--book-ink); }
.pc .ft { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 12px; border-top: 1px solid var(--line2); font-size: 12.5px; color: var(--muted); gap: 8px; }
.pc .ft span { display: inline-flex; gap: 6px; align-items: center; }
.pc .ft svg { width: 15px; height: 15px; }

/* Aşamalar */
.ladder { display: grid; gap: 22px; padding: 22px 24px 28px; }
.ladder h3 { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: -0.015em; }
.ladder > p { margin: -12px 0 0; color: var(--muted); max-width: 82ch; }
.lrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px 30px; }
.lcol { display: grid; gap: 10px; align-content: start; position: relative; min-width: 0; }
.lcol + .lcol::before { content: ""; position: absolute; left: -22px; top: 90px; width: 12px; height: 12px; border-top: 2px solid var(--dash); border-right: 2px solid var(--dash); transform: rotate(45deg); }
@media (max-width: 600px) { .lcol + .lcol::before { display: none; } }
.lcap { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.info { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.info li { display: flex; gap: 6px; }
.info li::before { content: "·"; color: var(--accent); font-weight: 800; }
.replay { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--accent-ink); padding: 5px 10px; border-radius: 9px; border: 1px solid var(--line); }
.replay svg { width: 14px; height: 14px; }
.dayof { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dayof div { padding: 10px 12px; border-radius: 12px; background: var(--app); display: grid; gap: 2px; }
.dayof dt { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.dayof dt svg { width: 13px; height: 13px; }
.dayof dd { margin: 0; font-size: 18px; font-weight: 750; }
.src-note { font-size: 12px; color: var(--muted); text-align: right; }

/* Bildirim */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--app); padding: 10px 16px; border-radius: 14px; font-size: 14px; display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.16, 1, .3, 1); z-index: 80; max-width: calc(100vw - 32px); }

function topbar(active, s) {

/* Seçim penceresi: o kutunun küçük karşılaştırması */
let pk = null;
function scoreHtml(o) { return o.score ? `<span class="score num${o.badge === "Önerim" ? " hi" : ""}">${o.score}<small>uyum</small></span>` : `<span class="score">${bm(o.src)}</span>`; }
function openPicker(k) {
  if (cur === "L" || cur === "P") return;
  const s = stateFor(cur), d = SLOTS[k], sl = s.slots[k];
  const title = d.what || `${d.from[0]} → ${d.to[0]}`, sub = `${s.dated ? d.d + " · " : ""}${d.n}`;
  const list = known(s, k).slice().sort((a, b) => (b.score || 0) - (a.score || 0)), cur0 = sl.ref && optOf(k, sl.ref);
  const row = o => { const isCur = sl.ref === o.id;
    return `<div class="opt${isCur ? " cur" + (sl.m === "rez" ? " rez" : "") : ""}">
      ${scoreHtml(o)}<span class="on">${o.name}${o.time ? ` <span class="num" style="font-weight:500;color:var(--muted)">${o.time[0]} → ${o.time[1]}</span>` : ""}${o.badge ? `<span class="rozet">${o.badge}</span>` : ""}</span>

      <span class="meta">${saver(o.who)}${o.up.length ? `<span class="reacts">${I("up-t")}<span class="avs">${o.up.slice(0, 4).map(w => av(w)).join("")}</span>${o.up.length > 4 ? `+${o.up.length - 4}` : ""}</span>` : ""}</span>
      <span class="pr num">${o.total ? eur(o.total) : "—"}<small>${o.total ? "toplam · " + o.unit.replace("kişi · ", "") : o.unit}</small></span>
      <span class="act">${isCur ? (sl.m === "rez" ? `<span class="chosen-ok">${I("check")}Rezerve</span>` : `<button class="ghost" data-rez="${k}">${I("check")}Rezerve ettim</button>`) : `<button class="pick" data-pick="${k}:${o.id}">${I("check")}Seç</button>`}</span></div>`; };
  const fy = FORYOU[k] && list.length > 1 && sl.m !== "rez" ? `<div class="foryou"><b>Senin için: ${FORYOU[k][0]}</b>${FORYOU[k][1]}<span>Kriterlerin: bagaj, 6 kişi, saat. AI yorumu düşük ağırlıklı; son karar senin.</span></div>` : "";
  const booked = sl.m === "rez" ? `<div class="pk-sec"><h6>${I("check")}Rezervasyon</h6><dl class="booked num">${BOOKED[k].rows.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl><span class="src-note">Bilgi bilet ve onay mailinden okundu</span></div>` : "";
  document.getElementById("pickerRoot").innerHTML = `<div class="scrim" id="scrim"><div class="picker" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
    <div class="pk-h"><span class="ic" style="color:${d.color || "var(--c-fly)"}">${I(d.icon || "plane")}</span><h3 id="pkTitle">${title}</h3><p class="num">${sub}</p><button class="close" data-close aria-label="Kapat">${I("x")}</button></div>
    <div class="pk-b">${booked}${fy}
      ${list.length ? `<div class="pk-sec"><h6>${I("users")}${list.length} seçenek · kaydettikleriniz ve AI önerisi</h6>${list.map(row).join("")}</div>` : `<p class="empty">${s.searching ? "AI arıyor; bulunca burada belirecek. Sen de kendin bakabilirsin." : "Henüz kayıt yok. Kendin ara; eklentiyle kaydettiğin her link buraya gelir."}</p>`}
      <div class="pk-sec"><h6>${I("search")}Kendin ara</h6><div class="self">${d.self.map(([b, x]) => blink(b, x || (s.dated && d.d ? ` · ${d.d}` : ""))).join("")}</div></div>
    </div>
    <div class="pk-f">${sl.m !== "bos" ? `<button class="ghost" data-clear="${k}">${I("undo")}Seçimi kaldır</button>` : ""}<span class="sp"></span><button class="ghost" data-go="pano">${I("board")}Pano'da tabloyla karşılaştır</button></div>
  </div></div>`;
  pk = k; requestAnimationFrame(() => document.getElementById("scrim").classList.add("on"));
  setTimeout(() => document.querySelector(".picker .close")?.focus(), 50);
}
function closePicker() { const sc = document.getElementById("scrim"); if (!sc) return; sc.classList.remove("on"); setTimeout(() => { document.getElementById("pickerRoot").innerHTML = ""; }, 250); const k = pk; pk = null; if (k) document.querySelector(`[data-slot="${k}"]`)?.focus(); }

/* Pano: çalışma masası; kategori seçilince “Senin için” özeti */
let panoCat = "fly";
function panoPage(s) {
  const CATS = { ev: ["ticket", "Etkinlik", "var(--c-ev)"], fly: ["plane", "Uçuşlar", "var(--c-fly)"], stay: ["tent", "Konaklama", "var(--c-stay)"], move: ["bus", "Ulaşım", "var(--c-move)"], doc: ["passport", "Vize ve sigorta", "var(--c-doc)"] };
  const secOf = k => SECS.find(x => x.slots.includes(k)).k;
  const all = Object.entries(OPT).flatMap(([k, l]) => l.filter(o => s.known === "all" || (s.known === "ai" && o.who === "AI")).map(o => ({ ...o, k })));
  const items = panoCat === "all" ? all : all.filter(o => secOf(o.k) === panoCat);
  const sum = panoCat !== "all" ? Object.keys(FORYOU).filter(k => secOf(k) === panoCat && known(s, k).length > 1).map(k => `<div class="foryou"><b>${SLOTS[k].what || SLOTS[k].from[0] + " → " + SLOTS[k].to[0]}: ${FORYOU[k][0]}</b>${FORYOU[k][1]}</div>`).join("") : "";
  const card = o => { const sl = s.slots[o.k], on = sl.ref === o.id, c = secOf(o.k);
    const img = c === "fly" ? `<span class="img" style="background:var(--lav)"><svg viewBox="0 0 300 130" style="width:100%;height:100%" aria-hidden="true"><path d="M50 95 Q150 15 250 65" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 6"/><circle cx="50" cy="95" r="4" fill="var(--accent)"/><text x="22" y="121" font-size="14" font-weight="700" fill="var(--ink)">${SLOTS[o.k].from[0]}</text><text x="190" y="92" font-size="14" font-weight="700" fill="var(--ink)">${SLOTS[o.k].to[0]}</text></svg>`
      : c === "ev" || o.k === "camp" ? `<span class="img" style="background:var(--tile);color:${CATS[c][2]}"><svg style="width:110px;height:84px" aria-hidden="true"><use href="#art-${o.k === "camp" ? "camp" : "dome"}"/></svg>`
      : `<span class="img" style="background:var(--tile)"><img src="illus/${SLOTS[o.k].img}.png" alt="">`;
    return `<article class="pc${on ? " inplan" : ""}">${img}${o.badge ? `<span class="rz rozet">${o.badge}</span>` : ""}<button class="heart${o.up.length > 2 ? " on" : ""}" aria-label="Favori">${I("heart")}</button>${o.score ? `<span class="sc num">${o.score}<small>uyum</small></span>` : ""}</span>
      <div class="bd"><div class="row1"><span><span style="color:${CATS[c][2]};display:inline-flex">${I(CATS[c][0])}</span>${SLOTS[o.k].what || SLOTS[o.k].type + " uçuşu"}</span><span>${bm(o.src)}${BR[o.src][1]}</span></div>
        <h5>${o.name}${o.time ? ` · <span class="num">${o.time[0]}</span>` : ""}</h5><div class="meta num">${o.sub}</div>
        <span class="pm">${o.plus ? `<span class="p">${o.plus}</span>` : ""}${o.minus ? `<span class="m">${o.minus}</span>` : ""}</span>
        <div class="row3">${o.total ? `<span class="pr num">${eur(o.total)} <small>toplam</small></span>` : `<span class="pr" style="font-size:14px;font-weight:600">${o.unit}</span>`}${on ? `<span class="addp ${sl.m === "rez" ? "rez" : "on"}">${I("check")}${sl.m === "rez" ? "Rezerve" : "Seçildi"}</span>` : `<button class="addp" data-pick="${o.k}:${o.id}">${I("plus")}Seç</button>`}</div></div>
      <div class="ft num">${saver(o.who)}<span>${I("up-t")}${o.up.length}<span class="avs">${o.up.slice(0, 3).map(w => av(w)).join("")}</span></span></div></article>`; };
  return `<div class="shell">${topbar("pano", s)}<div class="pano">
    <div class="pano-h"><h3>Pano</h3><span class="cnt num">${all.length} kayıt · çalışma masası</span><span class="sp"></span><span class="pbtn">${I("search")}Kayıtlarda ara</span><span class="pbtn">${I("grid")}Tablo</span><span class="pbtn primary">${I("plus")}Link ekle</span></div>
    <div class="cats"><button class="${panoCat === "all" ? "on" : ""}" data-cat="all">${I("grid")}Tümü <span>${all.length}</span></button>${Object.entries(CATS).map(([c, [ic, n, col]]) => `<button class="${panoCat === c ? "on" : ""}" data-cat="${c}"><span style="color:${col};display:inline-flex">${I(ic)}</span>${n} <span>${all.filter(o => secOf(o.k) === c).length}</span></button>`).join("")}</div>
    ${sum}<div class="pgrid">${items.map(card).join("")}</div></div></div>`;
}

/* Aşamalar: üç aşama + uçuş günü (rezerveden sonra gelen canlı bilgi) */
function ladder() {
  const mk = m => { const s = base(); s.known = "all"; ["ticket", "out", "bud"].forEach(k => s.slots[k] = m === "bos" ? { m } : { m, ref: { ticket: "t-full", out: "f-tk", bud: "s-and" }[k] }); return s; };
  const COL = [["bos", "Arıyoruz", ["Ne, nerede, neden", "Altında kaç fikir, kimlerden", "Basınca küçük karşılaştırma"]], ["plan", "Seçildi", ["Kararın adı büyük", "Solda fiyat, sağda tek eylem: Rezerve et ↗", "Basınca fikir değiştir"]], ["rez", "Rezerve", ["Yeşil, mühürlü", "Solda tek satır kanıt", "Basınca rezervasyon ayrıntısı"]]];
  const row = k => `<div class="lrow">${COL.map(([m, h, info]) => `<div class="lcol"><span class="lcap">${sd(m)}${h}</span>${slotCard(mk(m), k)}${k === "bud" ? `<ul class="info">${info.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}</div>`).join("")}</div>`;
  const s = mk("rez");
  return `<div class="shell"><div class="ladder">
    <h3>Üç aşama, aynı düzen</h3><p>Her kart üç satır: üstte tür ve durum, ortada ne olduğu, altta solda bilgi ve sağda tek eylem. Malzeme aşamayı söyler: kesikli arıyoruz, amber seçildi, yeşil rezerve.</p>
    <div><button class="replay" data-replay>${I("play")}Geçişi oynat</button></div>
    ${row("ticket")}${row("out")}${row("bud")}
    <h3>Rezerveden sonra: uçuş günü</h3><p>Bilet alındıktan sonra kartın üstüne canlı uçuş bilgisi gelir (bugün AeroDataBox'tan çekilen veri); kart aynı kalır, kutular eklenir.</p>
    <div class="grid2" style="max-width:900px"><div class="tkw"><article class="slot tk m-rez"><div class="tk-main"><div class="top">${sd("rez")}<span class="ty"><span class="ic" style="color:var(--c-fly)">${I("plane")}</span>Uçuş · Gidiş</span><span class="num">· Bugün</span><span class="sp"></span><span class="lab">Rezerve</span></div>
      <div class="route"><div class="c"><b>İstanbul</b><span class="t num">10:40</span> <small>IST</small></div>${SIL("sil")}<div class="c r"><b>Budapeşte</b><span class="t num">11:50</span> <small>BUD</small></div></div>
      <dl class="dayof num"><div><dt>${I("takeoff")}Tahmini kalkış</dt><dd>10:40</dd></div><div><dt>${I("desk")}Check-in masası</dt><dd>212–216</dd></div><div><dt>${I("door")}Kapı</dt><dd>F7</dd></div></dl>
      <div class="foot"><span class="proof">${I("check")}Zamanında</span><span class="sp"></span><span class="src-note">AeroDataBox · 2 dk önce</span></div></div>
      <div class="tk-stub"><span class="stub-k">Turkish Airlines</span><span class="stub-v num">PNR 7KQ2LM</span><span class="stub-k">6 yolcu · 23A–F</span></div></article></div></div>
  </div></div>`;
}

/* Yönetim */
const ORDER = ["A", "B", "C", "D", "P", "L"];
const DESC = { P: "<b>Pano · çalışma masası.</b> Kaydedilen her link ve AI önerisi, bugünkü karşılaştırmanın diliyle: uyum puanı, tek rozet, yalnız bunda artı/eksi, kim kaydetti, kim beğendi. Kategori seçince üstte “Senin için” özeti.", L: "<b>Aşamalar.</b> Etkinlik, uçuş ve konaklama üç hâlde, ayrıca rezerveden sonra uçuş günü. “Geçişi oynat” hareketi gösterir." };
let cur = "A", still = false, panoFrom = "C";
const tabs = () => document.getElementById("tabs").innerHTML = ORDER.map(k => (k === "P" ? `<span class="sep"></span>` : "") + `<button role="tab" aria-selected="${k === cur}" data-k="${k}">${k === "P" ? `${I("board")}Pano` : k === "L" ? "Aşamalar" : `<b>${k}</b>${SC[k].tab}`}</button>`).join("");
function show(k, keep) {
  if (!keep) { cur = k; tabs(); }
  document.getElementById("desc").innerHTML = DESC[k] || SC[k].desc;
  const y = scrollY, s = k === "P" ? stateFor(panoFrom) : k === "L" ? null : stateFor(k);
  document.getElementById("view").innerHTML = k === "L" ? ladder() : k === "P" ? panoPage(s) : app(s);
  if (keep) scrollTo(0, y);
  try { localStorage.setItem("tr-oz5", k); } catch (e) {}
}
const rerender = () => show(cur, true);
let toastT; function toast(msg, undo) { const t = document.getElementById("toast"); t.innerHTML = `<span>${msg}</span>${undo ? `<button id="tundo">Geri al</button>` : ""}`; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3600); if (undo) document.getElementById("tundo").onclick = () => { undo(); t.classList.remove("on"); }; }
const arrive = k => requestAnimationFrame(() => { if (still) return; const el = document.querySelector(`[data-slot="${k}"]`); if (el) { el.classList.add("arrive"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); setTimeout(() => el.classList.remove("arrive"), 1600); } });

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.k === "P" && cur !== "P" && cur !== "L") panoFrom = cur; show(b.dataset.k); });
document.getElementById("motion").addEventListener("click", e => { still = !still; document.body.classList.toggle("still", still); const b = e.currentTarget; b.setAttribute("aria-pressed", String(still)); b.innerHTML = still ? `${I("play")}<span>Hareketi oynat</span>` : `${I("pause")}<span>Hareketi duraklat</span>`; });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[data-slot]")) { e.preventDefault(); openPicker(e.target.dataset.slot); } });
document.addEventListener("change", e => { const c = e.target.closest("[data-prep]"); if (!c) return; const s = stateFor(cur); s.prep[c.dataset.prep] = c.checked ? 1 : 0; c.closest(".sec").querySelector(".sum").textContent = `${Object.values(s.prep).filter(Boolean).length}/8 hazır · Ozora'ya göre önerildi`; });
document.addEventListener("click", e => {
  const q = sel => e.target.closest(sel); let b;
  if (q("[data-close]") || e.target.id === "scrim") { closePicker(); return; }
  if ((b = q("[data-go]"))) { e.preventDefault(); closePicker(); if (b.dataset.go === "pano") { if (cur !== "P") panoFrom = cur; show("P"); } else show(panoFrom); return; }
  if ((b = q("[data-cat]"))) { panoCat = b.dataset.cat; rerender(); return; }
  if ((b = q("[data-replay]"))) { replay(); return; }
  if (cur === "L") return;
  const s = cur === "P" ? stateFor(panoFrom) : stateFor(cur);
  if ((b = q("[data-pick]"))) { const [k, id] = b.dataset.pick.split(":"), prev = { ...s.slots[k] }; s.slots[k] = { m: "plan", ref: id }; closePicker(); rerender(); arrive(k);
    toast(`${optOf(k, id).name} seçildi.`, () => { s.slots[k] = prev; rerender(); }); return; }
  if ((b = q("[data-rez]"))) { const k = b.dataset.rez; s.slots[k].m = "rez"; closePicker(); rerender(); arrive(k); toast("Rezerve olarak işaretlendi. Onay mailini bırakırsan ayrıntıyı eklerim."); return; }
  if ((b = q("[data-clear]"))) { const k = b.dataset.clear, prev = { ...s.slots[k] }; s.slots[k] = { m: "bos" }; closePicker(); rerender(); toast("Seçim kaldırıldı; seçenekler duruyor.", () => { s.slots[k] = prev; rerender(); }); return; }
  if ((b = q("[data-stop]"))) { e.preventDefault(); e.stopPropagation(); toast("Sitede rezerve et; dönünce karta basıp “Rezerve ettim” de ya da onay mailini bırak."); return; }
  if ((b = q("[data-idea-add]"))) { s.ideas[b.dataset.ideaAdd] = 1; rerender(); toast("Fikir plana eklendi."); return; }
  if ((b = q("[data-idea-x]"))) { const k = b.dataset.ideaX; s.ideas[k] = -1; rerender(); toast("Fikir atıldı.", () => { s.ideas[k] = 0; rerender(); }); return; }
  if ((b = q("[data-slot]")) && !q("a,button,input,label")) { openPicker(b.dataset.slot); return; }
});
function replay() {
  const steps = ["bos", "plan", "rez"], keys = ["ticket", "out", "bud"]; let i = 0;
  const run = () => { const box = document.querySelector(".ladder"); if (!box || cur !== "L") return;
    const s = base(); s.known = "all"; keys.forEach(k => s.slots[k] = steps[i] === "bos" ? { m: "bos" } : { m: steps[i], ref: { ticket: "t-full", out: "f-tk", bud: "s-and" }[k] });
    box.querySelectorAll(".lrow").forEach((r, ri) => { if (ri > 2) return; const k = keys[ri], first = r.querySelector(".lcol"); first.querySelector(".tkw, .slot").outerHTML = slotCard(s, k); const el = first.querySelector(`[data-slot="${k}"]`); if (el && !still) el.classList.add("arrive"); first.querySelector(".lcap").innerHTML = `${sd(steps[i])}${LAB[steps[i]]}`; });
    i++; if (i < steps.length) setTimeout(run, 1500); else setTimeout(() => show("L", true), 2200); };
  run();
}
let start = "A"; try { const v = localStorage.getItem("tr-oz5"); if (ORDER.includes(v)) start = v; } catch (e) {}
cur = start; tabs(); show(start);
</script>
